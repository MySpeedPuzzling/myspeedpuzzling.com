# https://github.com/docker/build-push-action/blob/master/docs/advanced/tags-labels.md

name: Release

permissions:
  deployments: write
  packages: write
  # GITHUB_TOKEN is handed to the image build so Composer's GitHub downloads are
  # authenticated (see Dockerfile) - reading public repos' zipballs needs this
  contents: read

on:
    workflow_run:
        workflows: [Tests]
        types:
            - completed
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    docker:
        name: "Docker images"
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v6
                with:
                    # list of Docker images to use as base name for tags
                    images: ghcr.io/myspeedpuzzling/website
                    # generate Docker tags based on the following events/attributes
                    tags: |
                        type=ref,event=branch
                        type=sha

            # The Tests workflow just ran on this very commit and saved Composer's
            # download cache under this key; hand it to the image build (as a named
            # context, see Dockerfile) so a cold `composer install` fetches nothing
            # from GitHub. Restore-only, same paths as Tests - the entry is
            # versioned by its path list, so `vendor` has to ride along to hit it.
            -   name: Restore Composer download cache
                uses: actions/cache/restore@v6
                with:
                    path: |
                        vendor
                        .composer-cache
                    key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-

            # A missing cache must not break the build - an empty context is fine
            -   name: Ensure the Composer cache context exists
                run: mkdir -p .composer-cache

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Login to GHCR
                if: github.event_name != 'pull_request'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    context: .
                    push: ${{ github.event_name != 'pull_request' }}
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=registry,ref=ghcr.io/myspeedpuzzling/website:buildcache
                    cache-to: type=registry,ref=ghcr.io/myspeedpuzzling/website:buildcache,mode=max
                    build-args: APP_VERSION=${{ github.sha }}
                    build-contexts: |
                        composer-cache=.composer-cache
                    secrets: |
                        github_token=${{ secrets.GITHUB_TOKEN }}

    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        needs:
            - docker
        environment:
            name: prod
            url: https://myspeedpuzzling.com
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Trigger lily deploy (HMAC webhook)
                env:
                    SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
                run: |
                    BODY='{"app":"myspeedpuzzling","tag":"main"}'
                    SIG="$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')"
                    curl -fsS -X POST https://deploy.lily.srv.thedevs.cz/hooks/myspeedpuzzling \
                      -H 'Content-Type: application/json' \
                      -H "X-Hub-Signature-256: sha256=$SIG" \
                      --data-raw "$BODY"

            -   name: Create Sentry release
                uses: getsentry/action-release@v3
                env:
                    SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
                    SENTRY_ORG: speedpuzzling
                with:
                    environment: prod
                    projects: web

