name: Tests

on:
    push:
        branches:
            - main
    pull_request:

env:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/speedpuzzling_test?serverVersion=16&charset=utf8

jobs:
  tests:
    runs-on: ubuntu-latest
    container: ghcr.io/myspeedpuzzling/web-base-php85:main
    services:
      postgres:
          image: postgres:16
          env:
              POSTGRES_PASSWORD: postgres
          options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          ports:
              - 5432:5432
    steps:
      -   uses: actions/checkout@v7
      -   uses: actions/cache@v6
          with:
              path: |
                  vendor
                  .composer-cache
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-
      -   id: webpack-cache
          uses: actions/cache@v6
          with:
              path: public/build
              key: ${{ runner.os }}-webpack-${{ hashFiles('assets/**', 'package-lock.json', 'webpack.config.js') }}
      -   run: composer install --no-scripts --no-progress
          env:
              COMPOSER_CACHE_DIR: .composer-cache
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          uses: actions/cache@v6
          with:
              path: node_modules
              key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-npm-
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm install
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm run dev
      -   run: vendor/bin/phpunit --testsuite "Project Test Suite"

  # Same topology as local development, on purpose: web-test (FrankenPHP, test env)
  # serves the app, selenium chrome drives it, phpunit runs inside web-test on the
  # compose network. The previous Panther-managed `php -S` setup served requests
  # with stale per-test DATABASE_URLs (one long-lived PHP process: putenv leakage
  # + stat-cache staleness across requests), which broke DB-backed native-auth
  # sessions in ways the local setup could never reproduce (2026-07-30).
  panther-tests:
    runs-on: ubuntu-latest
    steps:
      -   uses: actions/checkout@v7
      -   uses: actions/cache@v6
          with:
              path: |
                  vendor
                  .composer-cache
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-
      -   id: webpack-cache
          uses: actions/cache@v6
          with:
              path: public/build
              key: ${{ runner.os }}-webpack-${{ hashFiles('assets/**', 'package-lock.json', 'webpack.config.js') }}
      -   uses: shivammathur/setup-php@v2
          with:
              php-version: '8.5'
              extensions: pdo_pgsql, intl, redis, imagick, uuid
      -   run: composer install --no-scripts --no-progress
          env:
              COMPOSER_CACHE_DIR: .composer-cache
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          uses: actions/cache@v6
          with:
              path: node_modules
              key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-npm-
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm install
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm run dev
      -   run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      -   run: docker compose up -d postgres chrome
      -   run: docker compose up -d --no-deps web-test
      -   name: Wait for web-test to serve
          run: |
              for i in $(seq 1 30); do
                docker compose exec -T web-test curl -sf http://localhost:8080/-/health-check/liveness > /dev/null && exit 0
                sleep 2
              done
              echo "web-test never became healthy"; docker compose logs web-test | tail -50; exit 1
      -   name: Run Panther tests
          run: docker compose exec -T web-test vendor/bin/phpunit --testsuite "Panther Test Suite"
      -   name: Dump app log on failure
          if: failure()
          run: tail -n 400 var/log/test.log || true
      -   name: Upload failure screenshots
          if: failure()
          uses: actions/upload-artifact@v4
          with:
              name: panther-screenshots
              path: var/error-screenshots
              if-no-files-found: ignore


  phpstan:
      runs-on: ubuntu-latest
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      steps:
        -   uses: actions/checkout@v7
        -   uses: actions/cache@v6
            with:
                path: |
                    vendor
                    .composer-cache
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-composer-
        -   uses: actions/cache@v6
            with:
                path: var/phpstan
                key: ${{ runner.os }}-phpstan-${{ hashFiles('src/**/*.php', 'tests/**/*.php', 'config/**/*.php', 'phpstan.neon') }}
                restore-keys: |
                    ${{ runner.os }}-phpstan-
        -   run: composer install --no-scripts --no-progress
            env:
                COMPOSER_CACHE_DIR: .composer-cache
        -   run: bin/console cache:warmup --env=dev
        -   run: composer run-script phpstan

  coding-standards:
      runs-on: ubuntu-latest
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      continue-on-error: true
      steps:
        -   uses: actions/checkout@v7
        -   uses: actions/cache@v6
            with:
                path: |
                    vendor
                    .composer-cache
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-composer-
        -   run: composer install --no-scripts --no-progress
            env:
                COMPOSER_CACHE_DIR: .composer-cache
        -   run: composer run cs


  migrations-up-to-date:
      runs-on: ubuntu-latest
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      services:
          postgres:
              image: postgres:16
              env:
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: speedpuzzling_test
              options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
              ports:
                  - 5432:5432
      steps:
          -   uses: actions/checkout@v7
          -   uses: actions/cache@v6
              with:
                  path: |
                      vendor
                      .composer-cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

          -   run: composer install --no-scripts --no-progress
              env:
                  COMPOSER_CACHE_DIR: .composer-cache
          -   run: bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          -   run: bin/console doctrine:schema:update --dump-sql
          -   run: bin/console doctrine:schema:validate
