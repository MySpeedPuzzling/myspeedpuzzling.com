name: CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:

env:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/speedpuzzling_test?serverVersion=16&charset=utf8

jobs:
  # The suite runs as 3 parallel jobs (ParaTest shards, test classes dealt out
  # round-robin), each with one worker per CPU. ~60s of every job is fixed cost
  # (containers, checkout, caches, database build), so a 4th shard bought nothing.
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container: ghcr.io/myspeedpuzzling/web-base-php85:main
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
          image: postgres:16
          env:
              POSTGRES_PASSWORD: postgres
          options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
          ports:
              - 5432:5432
      # RedisApiUsageCounterTest runs the API usage Lua script against a real Redis
      # (REDIS_STATE_DSN in .env = redis://redis-state:6379); functional tests use
      # an in-memory counter and need no Redis
      redis-state:
          image: redis:7.2
          options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      -   uses: actions/checkout@v7
      -   uses: actions/cache@v6
          with:
              path: |
                  vendor
                  .composer-cache
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-
      -   id: webpack-cache
          uses: actions/cache@v6
          with:
              path: public/build
              key: ${{ runner.os }}-webpack-${{ hashFiles('assets/**', 'package-lock.json', 'webpack.config.js') }}
      -   run: composer install --no-scripts --no-progress
          env:
              COMPOSER_CACHE_DIR: .composer-cache
              # Authenticated GitHub dist downloads on a cold cache - anonymous ones from
              # the shared runner IP get throttled (429), see the Release Dockerfile
              COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
      # node_modules also on a webpack cache hit: tests run real JS libraries under node
      # (PuzzlePickerRankingTest imports @orchidjs/sifter)
      -   id: npm-cache
          uses: actions/cache@v6
          with:
              path: node_modules
              key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-npm-
      -   if: steps.npm-cache.outputs.cache-hit != 'true'
          run: npm install
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm run dev
      # Each worker gets its own clone of the test database - see tests/bootstrap.php
      -   run: vendor/bin/paratest --testsuite "Project Test Suite" --shard=${{ matrix.shard }}/3 --shard-test-distribution=round-robin

  # DISABLED 2026-07-30 (issue #147 / PR #172): the Panther-managed `php -S`
  # server this job relies on serves requests with stale per-test DATABASE_URLs
  # (one long-lived PHP process: putenv leakage + stat-cache staleness across
  # requests) - invisible while sessions were DB-free, fatal since the native
  # login made sessions resolve through user_account. The full suite is green
  # locally against the compose stack (web-test + selenium chrome), which is the
  # Panther gate until this job is rebuilt natively (job container + services
  # with a --network-alias for the app, like the `tests` job).
  panther-tests:
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
          image: postgres:16
          env:
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: speedpuzzling
          options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
          ports:
              - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/speedpuzzling?serverVersion=16&charset=utf8
    steps:
      -   uses: actions/checkout@v7
      -   uses: actions/cache@v6
          with:
              path: |
                  vendor
                  .composer-cache
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-
      -   id: webpack-cache
          uses: actions/cache@v6
          with:
              path: public/build
              key: ${{ runner.os }}-webpack-${{ hashFiles('assets/**', 'package-lock.json', 'webpack.config.js') }}
      -   uses: shivammathur/setup-php@v2
          with:
              php-version: '8.5'
              extensions: pdo_pgsql, intl, redis, imagick, uuid
      -   run: composer install --no-scripts --no-progress
          env:
              COMPOSER_CACHE_DIR: .composer-cache
              # Authenticated GitHub dist downloads on a cold cache - anonymous ones from
              # the shared runner IP get throttled (429), see the Release Dockerfile
              COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          uses: actions/cache@v6
          with:
              path: node_modules
              key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-npm-
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm install
      -   if: steps.webpack-cache.outputs.cache-hit != 'true'
          run: npm run dev
      -   run: bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      -   name: Run Panther tests
          run: vendor/bin/phpunit --testsuite "Panther Test Suite"

  phpstan:
      runs-on: ubuntu-latest
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      steps:
        -   uses: actions/checkout@v7
        -   uses: actions/cache@v6
            with:
                path: |
                    vendor
                    .composer-cache
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-composer-
        -   uses: actions/cache@v6
            with:
                path: var/phpstan
                key: ${{ runner.os }}-phpstan-${{ hashFiles('src/**/*.php', 'tests/**/*.php', 'config/**/*.php', 'phpstan.neon') }}
                restore-keys: |
                    ${{ runner.os }}-phpstan-
        -   run: composer install --no-scripts --no-progress
            env:
                COMPOSER_CACHE_DIR: .composer-cache
                # Authenticated GitHub dist downloads on a cold cache - anonymous ones from
                # the shared runner IP get throttled (429), see the Release Dockerfile
                COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        # PHPStan only needs the container (its XML dump); the optional warmers (templates,
        # routes, Doctrine proxies...) took 10s instead of 3s
        -   run: bin/console cache:warmup --env=dev --no-optional-warmers
        -   run: composer run-script phpstan

  # Plain PHP on the runner instead of the app image: PHPCS only reads tokens, so the
  # image's extensions do not matter, and pulling ~640 MB took 25-30s. With the PHPCS
  # cache (phpcs.xml) only changed files are checked. 66-103s -> ~17s (2026-10-04)
  coding-standards:
      runs-on: ubuntu-latest
      # The app image, like every other gate: the same PHP build everywhere and no extra
      # setup action. Pulling it takes ~11s since the base image went zstd and slim.
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      continue-on-error: true
      steps:
        -   uses: actions/checkout@v7
        -   uses: actions/cache@v6
            with:
                path: |
                    vendor
                    .composer-cache
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-composer-
        # PHPCS validates every cached entry itself (file content, ruleset, sniffs), so an
        # older cache from the restore key is safe
        -   uses: actions/cache@v6
            with:
                path: var/phpcs.cache
                key: phpcs-${{ hashFiles('src/**/*.php', 'tests/**/*.php', 'migrations/**/*.php', 'phpcs.xml', 'composer.lock') }}
                restore-keys: |
                    phpcs-
        -   run: composer install --no-scripts --no-progress
            env:
                COMPOSER_CACHE_DIR: .composer-cache
                # Authenticated GitHub dist downloads on a cold cache - anonymous ones from
                # the shared runner IP get throttled (429), see the Release Dockerfile
                COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        -   run: mkdir -p var && composer run cs


  migrations-up-to-date:
      runs-on: ubuntu-latest
      container: ghcr.io/myspeedpuzzling/web-base-php85:main
      services:
          postgres:
              image: postgres:16
              env:
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: speedpuzzling_test
              options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
              ports:
                  - 5432:5432
      steps:
          -   uses: actions/checkout@v7
          -   uses: actions/cache@v6
              with:
                  path: |
                      vendor
                      .composer-cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

          -   run: composer install --no-scripts --no-progress
              env:
                  COMPOSER_CACHE_DIR: .composer-cache
                  # Authenticated GitHub dist downloads on a cold cache - anonymous ones from
                  # the shared runner IP get throttled (429), see the Release Dockerfile
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
          -   run: bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          -   run: bin/console doctrine:schema:update --dump-sql
          -   run: bin/console doctrine:schema:validate


  # Main only, from here on. The production image builds WHILE the gates above
  # run instead of after them, and is pushed as `sha-<commit>` only - `deploy`
  # gives it the `main` tag (the one lily runs) once every gate is green, so a
  # red commit never reaches production.
  docker:
      name: docker image
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
      # One build at a time, in push order: each build carries the previous
      # build's /build assets forward (see Dockerfile), so builds must not overlap
      concurrency:
          group: docker-build-main
          cancel-in-progress: false
      outputs:
          image: ${{ steps.meta.outputs.tags }}
      env:
          BUILD_ASSETS_IMAGE: ghcr.io/myspeedpuzzling/website:build-assets
      steps:
          -   uses: actions/checkout@v7

          -   name: Docker meta
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/myspeedpuzzling/website
                  tags: |
                      type=sha

          # Composer's download cache for the image build (as a named context, see
          # Dockerfile), so a cold `composer install` fetches nothing from GitHub.
          # Restore-only, same paths as the jobs above - the entry is versioned by
          # its path list AND the compression tool, so `vendor` has to ride along
          # and the job containers must have zstd like this runner does
          # (web-base-php85 ships it since 2026-08-18). The jobs above run at the
          # same time, so after a composer.lock change this falls back to the
          # previous entry - only the changed packages are downloaded.
          -   name: Restore Composer download cache
              uses: actions/cache/restore@v6
              with:
                  path: |
                      vendor
                      .composer-cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

          # A missing cache must not break the build - an empty context is fine
          -   name: Ensure the Composer cache context exists
              run: mkdir -p .composer-cache

          -   name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  # The runner is thrown away after the job; removing the builder
                  # only added 10-20s at the end of every build
                  cleanup: false

          -   name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

          # Self-healing: when the build-assets image is missing (first run, or
          # deleted), take the assets of the image production runs
          -   name: Seed the build-assets image
              run: |
                  if ! docker buildx imagetools inspect "$BUILD_ASSETS_IMAGE" > /dev/null 2>&1; then
                      printf 'FROM ghcr.io/myspeedpuzzling/website:main AS release\nFROM scratch\nCOPY --from=release /app/public/build /build\n' \
                          | docker buildx build --push --tag "$BUILD_ASSETS_IMAGE" -
                  fi

          -   name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: app
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=ghcr.io/myspeedpuzzling/website:buildcache
                  cache-to: type=registry,ref=ghcr.io/myspeedpuzzling/website:buildcache,mode=max
                  build-args: |
                      APP_VERSION=${{ github.sha }}
                      BUILD_ASSETS_IMAGE=${{ env.BUILD_ASSETS_IMAGE }}
                  build-contexts: |
                      composer-cache=.composer-cache
                  secrets: |
                      github_token=${{ secrets.GITHUB_TOKEN }}

          # Same inputs as above, so every stage comes from the builder's cache and
          # only the tiny /build image is exported
          -   name: Push the build assets for the next build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: build-assets
                  push: true
                  tags: ${{ env.BUILD_ASSETS_IMAGE }}
                  cache-from: type=registry,ref=ghcr.io/myspeedpuzzling/website:buildcache
                  build-args: |
                      APP_VERSION=${{ github.sha }}
                      BUILD_ASSETS_IMAGE=${{ env.BUILD_ASSETS_IMAGE }}
                  build-contexts: |
                      composer-cache=.composer-cache
                  secrets: |
                      github_token=${{ secrets.GITHUB_TOKEN }}

  # PRs from this repository only: records that this exact tree - the PR merged
  # into main, which is what pull_request runs test - passed every gate. When the
  # squash merge produces the same tree (main did not move in between), the main
  # pipeline deploys without waiting for the gates again (`deploy-fast`).
  verified:
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      needs:
          - tests
          - phpstan
          - migrations-up-to-date
      runs-on: ubuntu-latest
      permissions:
          contents: read
      steps:
          -   name: Tree of the tested commit
              id: tree
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha)"
                  echo "tree=${tree}" >> "$GITHUB_OUTPUT"
                  echo "${GITHUB_SHA}" > verified-commit.txt
          -   uses: actions/upload-artifact@v7
              with:
                  name: verified-tree-${{ steps.tree.outputs.tree }}
                  path: verified-commit.txt
                  retention-days: 30

  # Main only: did a PR run of this workflow already pass every gate on exactly
  # this tree? Runs alongside the gates, so a direct push waits for nothing extra.
  plan:
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      permissions:
          contents: read
          actions: read
      outputs:
          verified: ${{ steps.check.outputs.verified }}
      steps:
          -   name: Look for a passed PR run of this exact tree
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  verified=false
                  tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha || true)"
                  if [ -n "$tree" ]; then
                      # Same-repository PR runs only (a fork's run cannot vouch for anything)
                      runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=verified-tree-${tree}" \
                          --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == ${{ github.repository_id }}) | .workflow_run.id] | unique | .[]' || true)"
                      for run in $runs; do
                          # ...of this very workflow, on a pull_request
                          origin="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.path + " " + .event' || true)"
                          if [ "$origin" = ".github/workflows/test.yml pull_request" ]; then
                              verified=true
                              echo "::notice::Tree ${tree} already passed every gate in PR run ${run} - deploying without waiting for the gates"
                              break
                          fi
                      done
                  fi
                  echo "Tree ${tree:-unknown}: verified=${verified}"
                  echo "verified=${verified}" >> "$GITHUB_OUTPUT"

  deploy:
      # The gates' results are checked by hand because `plan` may fail (API
      # hiccup) - that must not block a normal deploy. coding-standards stays
      # advisory (continue-on-error), as before.
      if: >-
          ${{ !cancelled() && github.event_name == 'push'
          && needs.tests.result == 'success'
          && needs.phpstan.result == 'success'
          && needs.migrations-up-to-date.result == 'success'
          && needs.docker.result == 'success'
          && needs.plan.outputs.verified != 'true' }}
      needs:
          - plan
          - tests
          - phpstan
          - migrations-up-to-date
          - docker
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
          deployments: write
      concurrency:
          group: deploy-prod
          cancel-in-progress: false
      outputs:
          deployed: ${{ steps.deploy.outputs.deployed }}
      environment:
          name: prod
          url: https://myspeedpuzzling.com
      steps:
          -   uses: actions/checkout@v7
              with:
                  sparse-checkout: .github/actions
          -   id: deploy
              uses: ./.github/actions/deploy-production
              with:
                  image: ${{ needs.docker.outputs.image }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  webhook-secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}

  # The same deploy as above, but for a tree a PR run already verified: only
  # the image has to be ready. The gates above still run, as a second opinion.
  deploy-fast:
      if: github.event_name == 'push' && needs.plan.outputs.verified == 'true'
      needs:
          - plan
          - docker
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
          deployments: write
      concurrency:
          group: deploy-prod
          cancel-in-progress: false
      outputs:
          deployed: ${{ steps.deploy.outputs.deployed }}
      environment:
          name: prod
          url: https://myspeedpuzzling.com
      steps:
          -   uses: actions/checkout@v7
              with:
                  sparse-checkout: .github/actions
          -   id: deploy
              uses: ./.github/actions/deploy-production
              with:
                  image: ${{ needs.docker.outputs.image }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  webhook-secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}

  # Its own job: the action is a Docker image that a job pulls before its first
  # step - inside a deploy job that held the webhook back by ~8s
  sentry-release:
      needs:
          - deploy
          - deploy-fast
      if: >-
          ${{ !cancelled()
          && (needs.deploy.outputs.deployed == 'true' || needs.deploy-fast.outputs.deployed == 'true') }}
      runs-on: ubuntu-latest
      permissions:
          contents: read
      steps:
          -   name: Checkout
              uses: actions/checkout@v7

          -   name: Create Sentry release
              uses: getsentry/action-release@v3
              env:
                  SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
                  SENTRY_ORG: speedpuzzling
              with:
                  environment: prod
                  projects: web
