openapi: 3.1.0
info:
  title: MySpeedPuzzling Internal Admin API
  version: "1.0.0"
  description: |
    Admin-only API for triggering privileged operations from outside the shell
    (Claude Code, curl, phone). Completely separate from the public
    `/api/v1/*` OAuth2 API — uses a single static bearer token.

    Closed-by-default: if `INTERNAL_API_TOKEN` env var is empty,
    all endpoints return 401.

    Not wired into Swagger UI at `/api/docs` on purpose. Render this spec
    manually in Swagger Editor / Redoc / an IDE plugin.
servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: https
      host:
        default: localhost:8080

security:
  - InternalApiBearer: []

paths:
  /internal-api/feature-requests/{featureRequestId}/mark-in-progress:
    post:
      summary: Mark feature request as in_progress
      operationId: markFeatureRequestInProgress
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/feature-requests/{featureRequestId}/mark-completed:
    post:
      summary: Mark feature request as completed
      operationId: markFeatureRequestCompleted
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/feature-requests/{featureRequestId}/mark-declined:
    post:
      summary: Mark feature request as declined
      operationId: markFeatureRequestDeclined
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-merge-requests:
    get:
      summary: Review queue of pending puzzle merge requests
      operationId: listPuzzleMergeRequests
      description: |
        Every pending duplicate report with all the puzzles it proposes to merge.

        Each candidate carries a ready-to-fetch `imageUrl`: whether two puzzles are
        really the same product is normally settled by comparing the artwork, not the
        names. The history counts (`solvedTimesCount` and friends) say which record
        should survive - normally the heaviest one.
      parameters:
        - name: limit
          in: query
          required: false
          description: Requests per page (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The pending queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleMergeReviewQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: File a puzzle duplicate report
      operationId: submitPuzzleMergeRequest
      description: |
        Files a merge request for puzzles no player reported - e.g. the same puzzle
        left twice under one brand after a brand merge. The reviewer player is the
        reporter, so nobody is notified. Settle it with the approve/reject endpoints.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeSubmission"
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequestId]
                properties:
                  mergeRequestId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-merge-requests/{mergeRequestId}/approve:
    post:
      summary: Approve a puzzle merge
      operationId: approvePuzzleMergeRequest
      description: |
        Destructive. The merged puzzles are deleted and their solving times,
        collection items, wish-list/sell-swap entries and lendings move onto the
        survivor. A `puzzle_merge_audit` row records the full before/after state
        first, so the merge can be reviewed and unpicked by hand.

        Anything omitted keeps the survivor's own value, and any EAN, catalogue
        number, alternative name, cover image or manufacturer held **only** by a
        puzzle about to be deleted is carried over rather than lost.

        Names: without `mergedAlternativeNames` every name of every puzzle stays
        (each main title in the language the reporter gave it, else its own
        `nameLanguage`); with it, that list is the survivor's other names.

        Send every candidate's `recordVersion` from the queue as `recordVersions`:
        a puzzle saved since answers 409 and nothing is merged.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/MergeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeApproval"
      responses:
        "204":
          description: Puzzles merged
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A puzzle changed since the recordVersions were read - nothing is merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal-api/puzzle-merge-requests/{mergeRequestId}/reject:
    post:
      summary: Reject a puzzle merge request
      operationId: rejectPuzzleMergeRequest
      description: |
        Declines the duplicate report. The reason is delivered to the player who
        reported it, as a notification, so it should be written for them.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/MergeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeRejection"
      responses:
        "204":
          description: Request rejected
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-change-requests:
    post:
      summary: File a puzzle change proposal
      operationId: submitPuzzleChangeRequest
      description: |
        Files the same review item a player's "Suggest a change" creates, as the reviewer
        player. A field left out keeps the puzzle's current value. `ean` and
        `identificationNumber` are each the whole list of codes as it should end up - a
        list (one code per entry, `[]` removes every code; a list of blank entries only is a
        400, so is anything longer than 255 characters) or one comma-separated string;
        every EAN not already on the puzzle must be a valid EAN/UPC. `alternativeNames` is the whole list of the other names
        as it should end up (re-read the puzzle's names first); it is proposed together
        with `nameLanguage` and applied as a diff against the names when filed.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeProposal"
      responses:
        "201":
          description: Proposal filed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changeRequestId, recordVersion]
                properties:
                  changeRequestId:
                    type: string
                    format: uuid
                  recordVersion:
                    type: string
                    description: The puzzle's record the proposal was filed against - send it back on approve.
                  nameLanguage:
                    type: [string, "null"]
                    description: The main title's language as filed - only when the names are part of the proposal.
                  alternativeNames:
                    type: array
                    description: The other names as filed (cleaned like the puzzle stores them) - only when the names are part of the proposal.
                    items:
                      $ref: "#/components/schemas/PuzzleName"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The puzzle already has a pending merge request or a pending change request of more than its names. A proposal of the names only (name, nameLanguage, alternativeNames) is never refused for this.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /internal-api/puzzle-change-requests/{changeRequestId}/reject:
    post:
      summary: Reject a puzzle change request
      operationId: rejectPuzzleChangeRequest
      description: |
        Declines a "suggest a change" proposal. The reason is delivered to the player
        who proposed it, as a notification, so it should be written for them.
        Does not check the status - send pending requests only.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeRejection"
      responses:
        "204":
          description: Request rejected
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-change-requests/{changeRequestId}/approve:
    post:
      summary: Approve a puzzle change request
      operationId: approvePuzzleChangeRequest
      description: |
        Approves a "suggest a change" proposal, applying only the fields listed in
        `selectedFields` - like the admin review, where unticked fields stay unchanged.
        `[]` approves a proposal that is already satisfied (e.g. a brand fix a brand
        merge made) without touching the puzzle. `alternativeNames` and `nameLanguage`
        correct the proposal before it is applied (selected fields only); the other
        names are always applied as a diff against the names when the request was filed.
        `recordVersion` refuses the approval (409) when the puzzle changed since it was
        read. A different main title needs `name`, `nameLanguage` and `alternativeNames`
        selected together. The player who proposed it is notified; the decision is
        logged with `source = internal_api`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeApproval"
      responses:
        "204":
          description: Request approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already approved or rejected, or the puzzle changed since `recordVersion` (then a JSON `error`) - nothing is applied.
        "422":
          description: The result breaks a rule of the record (e.g. more than 20 other names) - nothing is changed.

  /internal-api/manufacturers/{manufacturerId}/merge:
    post:
      summary: Merge duplicate brands into this one
      operationId: mergeManufacturers
      description: |
        Destructive. Every merged brand is deleted after its puzzles and the change
        requests proposing it move to the survivor (the brand in the path). The
        survivor keeps the logo and EAN prefixes only a merged brand had, becomes
        approved if a merged brand was, and every merged slug answers 301 to the
        survivor's brand pages. One `brand_merged` row per merged brand is written
        to `puzzle_moderation_decision`.

        The survivor's slug never changes - prefer a survivor without a `-2` suffix.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerMerge"
      responses:
        "204":
          description: Brands merged
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An approved brand outside the merge already has the survivor's final name - merge it in the same request.
        "422":
          description: The survivor is in its own merge list.

  /internal-api/manufacturers/{manufacturerId}/approve:
    post:
      summary: Approve a new brand
      operationId: approveManufacturer
      description: |
        For brands whose puzzles were approved without them - the approval queue
        only shows brands with a pending puzzle. Writes a `brand_approved` row to
        `puzzle_moderation_decision`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerApproval"
      responses:
        "204":
          description: Brand approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already approved, or an approved brand of that name exists (case-insensitive) - merge instead.

  /internal-api/manufacturers/{manufacturerId}/delete:
    post:
      summary: Delete a brand nothing uses any more
      operationId: deleteManufacturer
      description: |
        For an empty brand, e.g. a copy whose only puzzle was moved or merged away.
        Refused while a puzzle uses it, a change request proposes it or a merged
        brand's slug redirects to it - merge it into the right brand instead. Its
        slug gets no redirect. Writes a `brand_deleted` row to
        `puzzle_moderation_decision` (name, slug, approval, added_at).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerDeletion"
      responses:
        "204":
          description: Brand deleted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Still in use (puzzles, change requests proposing it, merged slugs redirecting to it) - merge instead.

  /internal-api/competitions:
    get:
      summary: List or search competitions
      operationId: listCompetitions
      description: |
        Every competition - approved, pending or rejected, standalone or an edition
        of a series - newest first (by the event's date, undated ones by when they
        were added).
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name, slug or shortcut of the competition or of its series (accents and letter case ignored).
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, approved, pending, rejected]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of competitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a competition
      operationId: createCompetition
      description: |
        A standalone competition (past or upcoming), added by the reviewer player,
        validated by the rules of the web form (`CompetitionFormData`). With
        `"approve": true` it is approved right away. Rounds and puzzles follow
        through their own endpoints. No e-mail is sent.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CompetitionFields"
                - type: object
                  required: [name]
                  properties:
                    approve:
                      type: boolean
                      default: false
      responses:
        "201":
          description: Created - the competition as `GET /internal-api/competitions/{idOrSlug}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{idOrSlug}:
    get:
      summary: One competition with its rounds, puzzles and maintainers
      operationId: getCompetition
      parameters:
        - name: idOrSlug
          in: path
          required: true
          description: The competition's id, or its slug (a standalone competition's first; an edition's slug is unique only within its series - several editions sharing it answer 409).
          schema:
            type: string
      responses:
        "200":
          description: The competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}:
    patch:
      summary: Update the fields sent
      operationId: updateCompetition
      description: |
        Only the fields sent change; `null` or `""` clears a field. **The slug is
        kept when the name changes** (unlike the web form) - only an explicit `slug`
        changes it, and it must be free (409 otherwise); old URLs of the event get no
        redirect. The slug cannot be cleared (400). `maintainerIds` replaces the whole
        list (`null` keeps it). `"isOnline": true` clears location and dates.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionFields"
      responses:
        "200":
          description: The competition after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/approve:
    post:
      summary: Approve a pending competition
      operationId: approveCompetition
      description: |
        Like the admin approval queue: the competition becomes public, its creator
        is e-mailed (unless the creator is the reviewer player). Refused (409) for an
        approved or rejected competition and for an edition (its series is approved).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/puzzles:
    put:
      summary: Set the competition's own puzzles
      operationId: setCompetitionPuzzles
      description: |
        "Competition puzzles" on the standalone event page are the puzzles of the
        competition's tag. They become exactly `puzzleIds`; a competition without a
        tag gets a new one named like its badge (shortcut, else name, else
        "name (2)" … - never the name of an existing tag). Refused (409) when other
        competitions or series carry the same tag - changing it would change theirs.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleIdList"
      responses:
        "200":
          description: The competition after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/rounds:
    post:
      summary: Add a round
      operationId: createCompetitionRound
      description: |
        Its slug is generated from the name and never changes. With `puzzleIds` the
        puzzles are attached right away, like `PUT /internal-api/rounds/{roundId}/puzzles`.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RoundFields"
                - type: object
                  required: [name, startsAt, minutesLimit]
                  properties:
                    puzzleIds:
                      type: array
                      items:
                        type: string
                        format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/rounds/{roundId}:
    patch:
      summary: Update the fields of a round sent
      operationId: updateCompetitionRound
      description: |
        The slug never changes. A category change that would put one of the round's
        puzzles into two rounds of one category of the competition is refused (409).
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundFields"
      responses:
        "200":
          description: The round after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a round without results
      operationId: deleteCompetitionRound
      description: With its puzzle assignments, teams and seating. Refused (409) while any solving time belongs to it.
      parameters:
        - $ref: "#/components/parameters/RoundId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/rounds/{roundId}/puzzles:
    put:
      summary: Set the round's puzzles
      operationId: setRoundPuzzles
      description: |
        The round's puzzles become exactly `puzzleIds` (`[]` removes all); puzzles
        kept keep their "hide until the round starts" setting, new ones are not
        hidden. A puzzle is in only one round per category of a competition - a
        list breaking that is refused (409) and nothing changes. Solving times are
        re-linked to rounds right after (round results).
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleIdList"
      responses:
        "200":
          description: The round after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/puzzles:
    get:
      summary: Search puzzles
      operationId: searchPuzzles
      description: |
        The site's own search (names in every language, EANs with or without
        leading zeros, brand codes), approved or not. Secret competition puzzles
        (`hide_until` in the future) are not found, like on the site.
      parameters:
        - name: q
          in: query
          required: false
          description: Name, EAN or brand code. Send `q` or `ean`, not both.
          schema:
            type: string
        - name: ean
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          description: Brand id, or a brand's exact name (any letter case). An unknown name finds nothing.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of puzzles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleSearchResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an approved puzzle without a photo
      operationId: createPuzzle
      description: |
        For a competition puzzle the site does not know yet. Approved at once,
        recorded as a `puzzle_approved` decision (`source = internal_api`). The brand
        is `manufacturerId` or `brand` (a name: an existing brand of that name, any
        letter case, else a new unapproved brand - see `brandCreated`). An EAN another
        puzzle carries is refused (409) unless `allowDuplicateEan` is true.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleCreation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminPuzzle"
                  - type: object
                    properties:
                      brandCreated:
                        type: boolean
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    InternalApiBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Static token from the `INTERNAL_API_TOKEN` env var.

  parameters:
    CompetitionId:
      name: competitionId
      in: path
      required: true
      description: UUID of the competition (an edition of a series is a competition too).
      schema:
        type: string
        format: uuid

    RoundId:
      name: roundId
      in: path
      required: true
      description: UUID of the competition round.
      schema:
        type: string
        format: uuid

    FeatureRequestId:
      name: featureRequestId
      in: path
      required: true
      description: UUID (v7) of the feature request.
      schema:
        type: string
        format: uuid

    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      description: UUID of the brand (manufacturer).
      schema:
        type: string
        format: uuid

    MergeRequestId:
      name: mergeRequestId
      in: path
      required: true
      description: UUID (v7) of the puzzle merge request.
      schema:
        type: string
        format: uuid

    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      description: UUID (v7) of the puzzle change request.
      schema:
        type: string
        format: uuid

  schemas:
    CompetitionFields:
      type: object
      additionalProperties: false
      description: |
        Validated by the web form's rules: name required; an in-person event
        (`isOnline` false) needs `location`, `dateFrom` and `dateTo` (an edition of
        a series needs neither); `dateTo` not before `dateFrom`, at most 30 days apart;
        links must be URLs. `null` or `""` clears a field. An unknown field is a 400.
      properties:
        name:
          type: string
          maxLength: 250
        shortcut:
          type: [string, "null"]
          maxLength: 250
        description:
          type: [string, "null"]
        location:
          type: [string, "null"]
          maxLength: 250
        locationCountryCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2, any letter case (stored lower case).
          example: cz
        dateFrom:
          type: [string, "null"]
          description: ISO 8601 day (`2026-11-14`); a date-time counts by its day.
        dateTo:
          type: [string, "null"]
        link:
          type: [string, "null"]
          format: uri
          description: The event's website.
        registrationLink:
          type: [string, "null"]
          format: uri
        resultsLink:
          type: [string, "null"]
          format: uri
        isOnline:
          type: boolean
          description: An online event has no place and no dates - true clears `location`, `dateFrom` and `dateTo`, like the web form.
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Explicit URL slug - unique (409 otherwise). Left out, create generates it from the name and update keeps it. A change breaks the old URLs (no redirect); it cannot be cleared.
        maintainerIds:
          type: array
          description: Player ids who may manage the event - replaces the list, `[]` empties it, `null` or left out keeps it.
          items:
            type: string
            format: uuid

    Competition:
      type: object
      properties:
        competitionId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: [string, "null"] }
        shortcut: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        locationCountryCode: { type: [string, "null"] }
        dateFrom: { type: [string, "null"], example: "2026-11-14" }
        dateTo: { type: [string, "null"] }
        link: { type: [string, "null"] }
        registrationLink: { type: [string, "null"] }
        resultsLink: { type: [string, "null"] }
        isOnline: { type: boolean }
        isRecurring:
          type: boolean
          description: True for an edition of a series (`series`) - recurring events are series of editions.
        series:
          type: [object, "null"]
          properties:
            seriesId: { type: string, format: uuid }
            name: { type: string }
            slug: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        tagId: { type: [string, "null"] }
        tagName: { type: [string, "null"] }
        status:
          type: string
          enum: [approved, pending, rejected]
        approvedAt: { type: [string, "null"], format: date-time }
        approvedByPlayerId: { type: [string, "null"] }
        rejectedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        publiclyVisible: { type: boolean }
        createdAt: { type: [string, "null"], format: date-time }
        addedByPlayerId: { type: [string, "null"] }
        addedByPlayerName: { type: [string, "null"] }
        roundsCount: { type: integer }

    CompetitionList:
      type: object
      required: [total, limit, offset, competitions]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        competitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"

    CompetitionDetail:
      allOf:
        - $ref: "#/components/schemas/Competition"
        - type: object
          properties:
            maintainers:
              type: array
              items:
                type: object
                properties:
                  playerId: { type: string, format: uuid }
                  name: { type: [string, "null"] }
                  code: { type: string }
            rounds:
              type: array
              items:
                $ref: "#/components/schemas/Round"
            puzzles:
              type: array
              description: The competition's own (tagged) puzzles.
              items:
                $ref: "#/components/schemas/AdminPuzzle"

    RoundFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 250
        category:
          type: string
          enum: [solo, duo, team]
          default: solo
        startsAt:
          type: string
          description: |
            ISO 8601 date-time. With an offset it is that moment; without one a
            wall-clock time in `timezone`. Stored and answered in UTC.
          example: "2026-11-14T10:00:00+01:00"
        timezone:
          type: string
          description: IANA time zone for a `startsAt` without an offset - by default the time zone of the competition's country (else Europe/Prague). Only together with `startsAt`.
          example: Europe/Prague
        minutesLimit:
          type: integer
          minimum: 1
        badgeBackgroundColor:
          type: [string, "null"]
          example: "#fe696a"
        badgeTextColor:
          type: [string, "null"]
          example: "#ffffff"
        resultsLink:
          type: [string, "null"]
          format: uri

    Round:
      type: object
      properties:
        roundId: { type: string, format: uuid }
        competitionId: { type: string, format: uuid }
        slug: { type: [string, "null"] }
        name: { type: string }
        category: { type: string, enum: [solo, duo, team] }
        startsAt: { type: string, format: date-time, example: "2026-11-14T09:00:00+00:00" }
        minutesLimit: { type: integer }
        badgeBackgroundColor: { type: [string, "null"] }
        badgeTextColor: { type: [string, "null"] }
        resultsLink: { type: [string, "null"] }
        resultsCount:
          type: integer
          description: Solving times that belong to the round.
        puzzles:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdminPuzzle"
              - type: object
                properties:
                  roundPuzzleId: { type: string, format: uuid }
                  hideUntilRoundStarts: { type: boolean }
                  hideMode: { type: [string, "null"], enum: [image_only, entirely, null] }

    PuzzleIdList:
      type: object
      additionalProperties: false
      required: [puzzleIds]
      properties:
        puzzleIds:
          type: array
          description: The whole list as it should end up - `[]` removes every puzzle.
          items:
            type: string
            format: uuid

    AdminPuzzle:
      type: object
      properties:
        puzzleId: { type: string, format: uuid }
        name: { type: string }
        piecesCount: { type: integer }
        manufacturerId: { type: [string, "null"] }
        manufacturerName: { type: [string, "null"] }
        ean: { type: [string, "null"], description: "Comma-separated when the puzzle has several" }
        identificationNumber: { type: [string, "null"], description: Brand code(s) }
        approved: { type: boolean }

    PuzzleSearchResult:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        puzzles:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdminPuzzle"
              - type: object
                properties:
                  alternativeNames:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleName"
                  solvedTimes: { type: integer }

    PuzzleCreation:
      type: object
      additionalProperties: false
      required: [name, piecesCount]
      properties:
        name:
          type: string
          description: Main title - the English title of the box when it has one.
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 tag of the main title when it is not English.
        alternativeNames:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleName"
        brand:
          type: string
          description: Brand name - send this or `manufacturerId`.
        manufacturerId:
          type: string
          format: uuid
        piecesCount:
          type: integer
          minimum: 10
          maximum: 25000
        ean:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: One code, a comma-separated string or a list - every one a valid EAN/UPC.
        identificationNumber:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        allowDuplicateEan:
          type: boolean
          default: false

    FeatureRequestStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        githubUrl:
          type: string
          format: uri
          description: Optional link to the GitHub issue or PR.
          example: https://github.com/janmikes/speedpuzzling.cz/pull/123
        adminComment:
          type: string
          description: Optional admin-facing comment attached to the transition.
          example: Shipped in v2.4.

    PuzzleMergeReviewQueue:
      type: object
      required: [totalPending, limit, offset, mergeRequests]
      properties:
        totalPending:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        mergeRequests:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleMergeReviewItem"

    PuzzleMergeReviewItem:
      type: object
      properties:
        mergeRequestId:
          type: string
          format: uuid
        submittedAt:
          type: string
        reporterName:
          type: [string, "null"]
        reporterCode:
          type: [string, "null"]
        sourcePuzzleId:
          type: [string, "null"]
        sourcePuzzleName:
          type: string
        actionable:
          type: boolean
          description: False when fewer than two reported puzzles still exist; such a request can only be rejected.
        missingPuzzleIds:
          type: array
          description: Reported puzzles already deleted by an earlier merge.
          items:
            type: string
            format: uuid
        reportedNameLanguages:
          type: object
          description: What the reporter said each reported puzzle's name is in - puzzle id => base language (cs, de). An empty object when nothing was said.
          additionalProperties:
            type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleMergeCandidate"

    PuzzleMergeCandidate:
      type: object
      properties:
        puzzleId:
          type: string
          format: uuid
        name:
          type: string
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when it is not English, null = English or not known.
        alternativeName:
          type: [string, "null"]
          description: The one other name of old - the first Czech name of alternativeNames, else its first name. Kept for existing callers; read alternativeNames.
        alternativeNames:
          type: array
          description: Every other name of the puzzle in order (the box titles it is also sold under), with the BCP 47 language of each when it is known.
          items:
            type: object
            required: [name, language]
            properties:
              name:
                type: string
              language:
                type: [string, "null"]
                description: Normalised BCP 47 tag (cs, de, pt-BR, zh-Hant), null when not known.
        piecesCount:
          type: integer
        ean:
          type: [string, "null"]
        identificationNumber:
          type: [string, "null"]
        manufacturerId:
          type: [string, "null"]
        manufacturerName:
          type: [string, "null"]
        image:
          type: [string, "null"]
          description: Storage path.
        imageUrl:
          type: [string, "null"]
          description: Fetchable thumbnail URL - the decisive signal when judging a duplicate.
        approved:
          type: boolean
        addedAt:
          type: [string, "null"]
        solvedTimesCount:
          type: integer
        collectionItemsCount:
          type: integer
        wishListItemsCount:
          type: integer
        sellSwapItemsCount:
          type: integer
        recordVersion:
          type: string
          description: Fingerprint of the record (names, brand, pieces, codes, image) - send it back on approve in recordVersions.

    PuzzleMergeApproval:
      type: object
      additionalProperties: false
      required: [survivorPuzzleId, mergedName, mergedPiecesCount]
      properties:
        survivorPuzzleId:
          type: string
          format: uuid
          description: The puzzle that stays; every other reported puzzle is deleted. Must be one of the request's reported puzzles (any letter case) - another id is a 400.
        mergedName:
          type: string
          description: The survivor's main title - the English one when the box has one.
        mergedNameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when it is not English (cs); an explicit null = English or not known. Left out, the main title keeps the language the puzzles know for mergedName (the reporter's language, else the puzzle's own, else the language of the other name it is) - with or without mergedAlternativeNames.
        mergedAlternativeNames:
          type: [array, "null"]
          description: The survivor's other names in order - replaces the union of every name, so list every name to keep. Omit or null for the union. At most 20 unless the union already holds more.
          items:
            $ref: "#/components/schemas/PuzzleName"
        mergedPiecesCount:
          type: integer
          minimum: 1
        mergedEan:
          description: Omit or blank to keep the survivor's own - a list of codes or one comma-separated string. The merged puzzles' codes are added either way.
          oneOf:
            - type: [string, "null"]
            - type: array
              items:
                type: string
        mergedIdentificationNumber:
          description: As mergedEan, for the brand codes.
          oneOf:
            - type: [string, "null"]
            - type: array
              items:
                type: string
        mergedManufacturerId:
          type: [string, "null"]
        selectedImagePuzzleId:
          type: [string, "null"]
          format: uuid
          description: Take the cover image from this puzzle.
        decisionConfidence:
          type: [string, "null"]
          enum: [high, medium, low, null]
          description: Stored on the audit row so weakly-evidenced merges can be re-examined first.
        decisionNote:
          type: [string, "null"]
          description: Why. Stored on the audit row; never shown to players.
        recordVersions:
          type: [object, "null"]
          description: Every candidate's recordVersion as read from the queue, puzzle id => version. A puzzle changed since answers 409; a puzzle left out is not checked.
          additionalProperties:
            type: string

    PuzzleMergeSubmission:
      type: object
      additionalProperties: false
      required: [puzzleIds]
      properties:
        puzzleIds:
          type: array
          minItems: 2
          description: At least two distinct puzzle ids; the first is the request's source puzzle.
          items:
            type: string
            format: uuid
        reportedNameLanguages:
          type: object
          description: Optional - the language a reported puzzle's name is in, puzzle id => BCP 47 tag (null = not known). Stored as the base language; a puzzle outside puzzleIds is a 400.
          additionalProperties:
            type: [string, "null"]

    ManufacturerMerge:
      type: object
      additionalProperties: false
      required: [mergedManufacturerIds]
      properties:
        mergedManufacturerIds:
          type: array
          minItems: 1
          description: Brands to fold into the survivor, approved or not.
          items:
            type: string
            format: uuid
        name:
          type: [string, "null"]
          description: The survivor's name as the brand writes it. Omit or blank to keep it.
        decisionConfidence:
          type: [string, "null"]
          enum: [high, medium, low, null]
        decisionNote:
          type: [string, "null"]
          description: Why. Stored as the decision's note.

    ManufacturerApproval:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          description: Fix the spelling on the way. Omit or blank to keep it.
        decisionNote:
          type: [string, "null"]

    ManufacturerDeletion:
      type: object
      additionalProperties: false
      properties:
        decisionNote:
          type: [string, "null"]

    PuzzleMergeRejection:
      type: object
      additionalProperties: false
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          description: Shown to the player who reported the duplicate, as a notification.

    PuzzleChangeProposal:
      type: object
      additionalProperties: false
      required: [puzzleId]
      properties:
        puzzleId:
          type: string
          format: uuid
        name:
          type: string
        manufacturerId:
          type: string
          format: uuid
        piecesCount:
          type: integer
          minimum: 10
          maximum: 25000
        ean:
          description: Every EAN as it should end up - a list, one code per entry (`[]` removes every code), or one comma-separated string.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        identificationNumber:
          description: Every brand code as it should end up - like `ean`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when the box has no English title (`cs`, `pt-BR`); null = English or not known.
        alternativeNames:
          type: array
          description: The whole list of the other names as it should end up, in order. At most 20 when it grows.
          items:
            $ref: "#/components/schemas/PuzzleName"

    PuzzleName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        language:
          type: [string, "null"]
          description: BCP 47 language tag of the box it is printed on; null = not known.

    PuzzleChangeApproval:
      type: object
      additionalProperties: false
      required: [selectedFields]
      properties:
        selectedFields:
          type: array
          description: Fields to apply to the puzzle; [] applies nothing. Required on purpose - never implied.
          items:
            type: string
            enum: [name, nameLanguage, alternativeNames, manufacturer, piecesCount, ean, identificationNumber, image]
        decisionNote:
          type: [string, "null"]
          description: Stored as the decision's note.
        alternativeNames:
          type: array
          description: Corrects the proposed other names (requires `alternativeNames` in selectedFields) - the list as it should end up, applied as a diff against the names when the request was filed.
          items:
            $ref: "#/components/schemas/PuzzleName"
        nameLanguage:
          type: [string, "null"]
          description: Corrects the proposed language of the main title (requires `nameLanguage` in selectedFields).
        recordVersion:
          type: [string, "null"]
          description: The puzzle's record as read before deciding (the filing's 201 answer) - a puzzle changed since answers 409. Omit to check nothing.

    PuzzleChangeRejection:
      type: object
      additionalProperties: false
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          description: Shown to the player who proposed the change, as a notification.

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
        errors:
          type: object
          description: Invalid fields (field => what is wrong) - only for a request with invalid fields.
          additionalProperties:
            type: string

  responses:
    InvalidJson:
      description: Request body was present but not a valid JSON object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, wrong, or unconfigured bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Malformed JSON, a missing or invalid field, or no reviewer configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state (taken slug, round invariant, results in a round, shared tag, already approved, known EAN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown feature request, merge request, brand, puzzle, competition or round ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
