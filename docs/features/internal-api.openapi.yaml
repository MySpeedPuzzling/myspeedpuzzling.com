openapi: 3.1.0
info:
  title: MySpeedPuzzling Internal Admin API
  version: "1.0.0"
  description: |
    Admin-only API for triggering privileged operations from outside the shell
    (Claude Code, curl, phone). Completely separate from the public
    `/api/v1/*` OAuth2 API — uses a single static bearer token.

    Closed-by-default: if `INTERNAL_API_TOKEN` env var is empty,
    all endpoints return 401.

    Not wired into Swagger UI at `/api/docs` on purpose. Render this spec
    manually in Swagger Editor / Redoc / an IDE plugin.
servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: https
      host:
        default: localhost:8080

security:
  - InternalApiBearer: []

paths:
  /internal-api/feature-requests/{featureRequestId}/mark-in-progress:
    post:
      summary: Mark feature request as in_progress
      operationId: markFeatureRequestInProgress
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/feature-requests/{featureRequestId}/mark-completed:
    post:
      summary: Mark feature request as completed
      operationId: markFeatureRequestCompleted
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/feature-requests/{featureRequestId}/mark-declined:
    post:
      summary: Mark feature request as declined
      operationId: markFeatureRequestDeclined
      parameters:
        - $ref: "#/components/parameters/FeatureRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequestStatusUpdate"
      responses:
        "204":
          description: Status updated successfully
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-merge-requests:
    get:
      summary: Review queue of pending puzzle merge requests
      operationId: listPuzzleMergeRequests
      description: |
        Every pending duplicate report with all the puzzles it proposes to merge.

        Each candidate carries a ready-to-fetch `imageUrl`: whether two puzzles are
        really the same product is normally settled by comparing the artwork, not the
        names. The history counts (`solvedTimesCount` and friends) say which record
        should survive - normally the heaviest one.
      parameters:
        - name: limit
          in: query
          required: false
          description: Requests per page (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The pending queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleMergeReviewQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: File a puzzle duplicate report
      operationId: submitPuzzleMergeRequest
      description: |
        Files a merge request for puzzles no player reported - e.g. the same puzzle
        left twice under one brand after a brand merge. The reviewer player is the
        reporter, so nobody is notified. Settle it with the approve/reject endpoints.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeSubmission"
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequestId]
                properties:
                  mergeRequestId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-merge-requests/{mergeRequestId}/approve:
    post:
      summary: Approve a puzzle merge
      operationId: approvePuzzleMergeRequest
      description: |
        Destructive. The merged puzzles are deleted and their solving times,
        collection items, wish-list/sell-swap entries and lendings move onto the
        survivor. A `puzzle_merge_audit` row records the full before/after state
        first, so the merge can be reviewed and unpicked by hand.

        Anything omitted keeps the survivor's own value, and any EAN, catalogue
        number, alternative name, cover image or manufacturer held **only** by a
        puzzle about to be deleted is carried over rather than lost.

        Names: without `mergedAlternativeNames` every name of every puzzle stays
        (each main title in the language the reporter gave it, else its own
        `nameLanguage`); with it, that list is the survivor's other names.

        Send every candidate's `recordVersion` from the queue as `recordVersions`:
        a puzzle saved since answers 409 and nothing is merged.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/MergeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeApproval"
      responses:
        "204":
          description: Puzzles merged
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A puzzle changed since the recordVersions were read - nothing is merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal-api/puzzle-merge-requests/{mergeRequestId}/reject:
    post:
      summary: Reject a puzzle merge request
      operationId: rejectPuzzleMergeRequest
      description: |
        Declines the duplicate report. The reason is delivered to the player who
        reported it, as a notification, so it should be written for them.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/MergeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleMergeRejection"
      responses:
        "204":
          description: Request rejected
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-change-requests:
    post:
      summary: File a puzzle change proposal
      operationId: submitPuzzleChangeRequest
      description: |
        Files the same review item a player's "Suggest a change" creates, as the reviewer
        player. A field left out keeps the puzzle's current value. `ean` and
        `identificationNumber` are each the whole list of codes as it should end up - a
        list (one code per entry, `[]` removes every code; a list of blank entries only is a
        400, so is anything longer than 255 characters) or one comma-separated string;
        every EAN not already on the puzzle must be a valid EAN/UPC. `alternativeNames` is the whole list of the other names
        as it should end up (re-read the puzzle's names first); it is proposed together
        with `nameLanguage` and applied as a diff against the names when filed.

        `image` (base64 JPEG/PNG/WebP, at most 15 MB decoded) proposes a new picture, checked and
        stored like the web form's photo; a proposal of the picture only is valid. The image
        pipeline sends `source: image_pipeline` with `tags` (at least one), `confidence`,
        `modelVersion` and `sourceImageFingerprint` (required): one proposal per puzzle, picture
        and tag, ever (409 `already_proposed`, rejected ones included); a picture the puzzle no
        longer has is a 409 `image_changed`; a puzzle with a hidden picture answers 404 (also to
        any request with an `image`).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeProposal"
      responses:
        "201":
          description: Proposal filed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changeRequestId, recordVersion]
                properties:
                  changeRequestId:
                    type: string
                    format: uuid
                  recordVersion:
                    type: string
                    description: The puzzle's record the proposal was filed against - send it back on approve.
                  nameLanguage:
                    type: [string, "null"]
                    description: The main title's language as filed - only when the names are part of the proposal.
                  alternativeNames:
                    type: array
                    description: The other names as filed (cleaned like the puzzle stores them) - only when the names are part of the proposal.
                    items:
                      $ref: "#/components/schemas/PuzzleName"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `pending_proposal` - the puzzle already has a pending merge request or a pending change request of
            more than its names (a proposal of the names only is never refused for this; an `image` is more);
            `already_proposed` - the image pipeline proposed this picture with this tag already, in any status;
            `image_changed` - `sourceImageFingerprint` is not the puzzle's picture now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The `image` is no JPEG / PNG / WebP of at most 15 MB (`errors.image`) - nothing is filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List puzzle change requests
      operationId: listPuzzleChangeRequests
      description: |
        Every change request in id order (= filing order), keyset paged, with the image pipeline's
        metadata, its latest decision from the decision log and fetchable full-size URLs of the
        original and the proposed picture. Requests of a puzzle whose picture is hidden now are
        never listed. Feeds the pipeline's auto-resolve and its precision calibration.
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [player, internal_api, image_pipeline]
        - name: tag
          in: query
          schema:
            type: string
            pattern: "^[A-Za-z0-9_.:-]{1,50}$"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, outdated, all]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: after
          in: query
          description: The `nextCursor` of the previous page (a change request id).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of change requests
          content:
            application/json:
              schema:
                type: object
                required: [changeRequests, nextCursor]
                properties:
                  changeRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleChangeRequestListItem"
                  nextCursor:
                    type: [string, "null"]
                    description: The next page's `after`, null on the last page.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzle-change-requests/{changeRequestId}/reject:
    post:
      summary: Reject a puzzle change request
      operationId: rejectPuzzleChangeRequest
      description: |
        Declines a "suggest a change" proposal. The reason is delivered to the player
        who proposed it, as a notification, so it should be written for them. An optional
        `decisionNote` stays in the decision log only (`details.decisionNote`). The decision
        is logged with `source = internal_api`. Only a pending request is rejected - one decided
        already answers 409 and nothing changes.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeRejection"
      responses:
        "204":
          description: Request rejected
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already approved, rejected or closed - nothing changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal-api/puzzle-change-requests/{changeRequestId}/approve:
    post:
      summary: Approve a puzzle change request
      operationId: approvePuzzleChangeRequest
      description: |
        Approves a "suggest a change" proposal, applying only the fields listed in
        `selectedFields` - like the admin review, where unticked fields stay unchanged.
        `[]` approves a proposal that is already satisfied (e.g. a brand fix a brand
        merge made) without touching the puzzle. `alternativeNames` and `nameLanguage`
        correct the proposal before it is applied (selected fields only); the other
        names are always applied as a diff against the names when the request was filed.
        `recordVersion` refuses the approval (409) when the puzzle changed since it was
        read. A different main title needs `name`, `nameLanguage` and `alternativeNames`
        selected together. The player who proposed it is notified; the decision is
        logged with `source = internal_api`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ChangeRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleChangeApproval"
      responses:
        "204":
          description: Request approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The request was already approved or rejected, or the puzzle changed since `recordVersion`, or
            (`image_changed`) an `image_pipeline` picture change of a picture the puzzle no longer has, or
            (`original_not_archived`) the puzzle's picture could not be copied to
            `originals/<puzzleId>/<fingerprint>.<ext>` before an `image_pipeline` picture replaces it - nothing is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The result breaks a rule of the record (e.g. more than 20 other names) - nothing is changed.

  /internal-api/manufacturers/{manufacturerId}/merge:
    post:
      summary: Merge duplicate brands into this one
      operationId: mergeManufacturers
      description: |
        Destructive. Every merged brand is deleted after its puzzles and the change
        requests proposing it move to the survivor (the brand in the path). The
        survivor keeps the logo and EAN prefixes only a merged brand had, becomes
        approved if a merged brand was, and every merged slug answers 301 to the
        survivor's brand pages. One `brand_merged` row per merged brand is written
        to `puzzle_moderation_decision`.

        The survivor's slug never changes - prefer a survivor without a `-2` suffix.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerMerge"
      responses:
        "204":
          description: Brands merged
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An approved brand outside the merge already has the survivor's final name - merge it in the same request.
        "422":
          description: The survivor is in its own merge list.

  /internal-api/manufacturers/{manufacturerId}/approve:
    post:
      summary: Approve a new brand
      operationId: approveManufacturer
      description: |
        For brands whose puzzles were approved without them - the approval queue
        only shows brands with a pending puzzle. Writes a `brand_approved` row to
        `puzzle_moderation_decision`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerApproval"
      responses:
        "204":
          description: Brand approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already approved, or an approved brand of that name exists (case-insensitive) - merge instead.

  /internal-api/manufacturers/{manufacturerId}/delete:
    post:
      summary: Delete a brand nothing uses any more
      operationId: deleteManufacturer
      description: |
        For an empty brand, e.g. a copy whose only puzzle was moved or merged away.
        Refused while a puzzle uses it, a change request proposes it or a merged
        brand's slug redirects to it - merge it into the right brand instead. Its
        slug gets no redirect. Writes a `brand_deleted` row to
        `puzzle_moderation_decision` (name, slug, approval, added_at).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/ManufacturerId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerDeletion"
      responses:
        "204":
          description: Brand deleted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Still in use (puzzles, change requests proposing it, merged slugs redirecting to it) - merge instead.

  /internal-api/competitions:
    get:
      summary: List or search competitions
      operationId: listCompetitions
      description: |
        Every competition - approved, pending, rejected or a draft, standalone or an
        edition of a series - newest first (by the event's date, undated ones by when
        they were added).
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name, slug or shortcut of the competition or of its series (accents and letter case ignored).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: The approval state (`approved` / `pending` / `rejected` - an approved draft is approved and not pending), or `draft` - the competition or its series is a draft.
          schema:
            type: string
            enum: [all, approved, pending, rejected, draft]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of competitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a competition
      operationId: createCompetition
      description: |
        A standalone competition (past or upcoming), added by the reviewer player,
        validated by the rules of the web form (`CompetitionFormData`). With
        `"approve": true` it is approved right away. Under an approved organization
        (`organizationId`) it is approved at once anyway - the reviewer player is an
        admin (`OrganizationApprovalPolicy`). `"draft": true` creates it as a draft:
        only its team sees it until it is published. Rounds and puzzles follow
        through their own endpoints. No e-mail is sent.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/CompetitionFields"
                - type: object
                  required: [name]
                  properties:
                    approve:
                      type: boolean
                      default: false
                    organizationId:
                      type: [string, "null"]
                      format: uuid
                      description: An existing organization (400 otherwise) - the one-time event is under it.
                    draft:
                      type: boolean
                      default: false
      responses:
        "201":
          description: Created - the competition as `GET /internal-api/competitions/{competitionId}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # One path item for both: GET also takes a slug in place of the id, PATCH only the id
  /internal-api/competitions/{competitionId}:
    get:
      summary: One competition with its rounds, puzzles and maintainers
      operationId: getCompetition
      parameters:
        - name: competitionId
          in: path
          required: true
          description: The competition's id, or its slug (a standalone competition's first; an edition's slug is unique only within its series - several editions sharing it answer 409).
          schema:
            type: string
      responses:
        "200":
          description: The competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Update the fields sent
      operationId: updateCompetition
      description: |
        Only the fields sent change; `null` or `""` clears a field. **The slug is
        kept when the name changes** (like the web forms) - only an explicit `slug`
        changes it, and it must be free (409 otherwise); old URLs of the event get no
        redirect. The slug cannot be cleared (400). `maintainerIds` replaces the whole
        list (`null` keeps it). `"isOnline": true` clears the location; dates stay.
        A PATCH holding any competition field (even one sent with its stored value)
        validates the whole record as it would be stored (a stored span over 30 days
        must be fixed in the same PATCH); a PATCH of only `organizationId` / `draft`
        validates nothing else.

        `organizationId` moves a one-time event into an organization or out of it
        (`null`, `AssignEventToOrganization`; a pending event under an approved
        organization is approved at once) - an edition refuses one (409, it is its
        series'); it needs `INTERNAL_API_REVIEWER_PLAYER_ID` (403 when that player is
        neither an admin nor on the organization's team). `draft` publishes (false) or
        takes it back to draft (true - 409 while people joined it or results / solving
        times are linked to it) and needs no reviewer player. Everything is checked
        before anything is written.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/CompetitionFields"
                - type: object
                  properties:
                    organizationId:
                      type: [string, "null"]
                      format: uuid
                    draft:
                      type: boolean
      responses:
        "200":
          description: The competition after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a competition without results
      operationId: deleteCompetition
      description: |
        An event or a series edition, with its rounds, puzzle assignments, teams
        and participants. Refused (409) while any solving time belongs to it or to
        one of its rounds. For empty leftovers, e.g. an edition created twice.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/approve:
    post:
      summary: Approve a pending competition
      operationId: approveCompetition
      description: |
        Like the admin approval queue: the competition becomes public, its creator
        is e-mailed (unless the creator is the reviewer player). Refused (409) for an
        approved or rejected competition and for an edition (its series is approved).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/puzzles:
    put:
      summary: Set the competition's own puzzles
      operationId: setCompetitionPuzzles
      description: |
        "Competition puzzles" on the standalone event page are the puzzles of the
        competition's tag. They become exactly `puzzleIds`; a competition without a
        tag gets a new one named like its badge (shortcut, else name, else
        "name (2)" … - never the name of an existing tag). Refused (409) when other
        competitions or series carry the same tag - changing it would change theirs.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/PuzzleIdList"
      responses:
        "200":
          description: The competition after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/rounds:
    post:
      summary: Add a round
      operationId: createCompetitionRound
      description: |
        Its slug is generated from the name and never changes. With `puzzleIds` the
        puzzles are attached right away, like `PUT /internal-api/rounds/{roundId}/puzzles`.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/RoundFields"
                - type: object
                  required: [name, startsAt, minutesLimit]
                  properties:
                    puzzleIds:
                      type: array
                      items:
                        type: string
                        format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/rounds/{roundId}:
    patch:
      summary: Update the fields of a round sent
      operationId: updateCompetitionRound
      description: |
        The slug never changes. A category change that would put one of the round's
        puzzles into two rounds of one category of the competition is refused (409).
        A field left out keeps its value - `startsAt` and `revealDelayMinutes` too.

        A change that moves the round's automatic reveal (`startsAt` +
        `revealDelayMinutes`) EARLIER is refused (409, `revealedPuzzles`) unless
        `confirmReveal` is true. That means an earlier start, a shorter delay or both;
        the net moment decides. It applies even when the new moment is still in the
        future. Each listed puzzle says when it would come out (`rightAway`,
        `revealsAt`) and how far (`scope`). A later moment needs no yes and keeps the
        puzzles hidden longer on the whole site too.
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/RoundFields"
                - $ref: "#/components/schemas/ConfirmReveal"
      responses:
        "200":
          description: The round after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a round without results
      operationId: deleteCompetitionRound
      description: |
        With its puzzle assignments, teams and seating. Refused (409) while any
        solving time belongs to it, and (409, `revealedPuzzles`) when that reveals
        a secret puzzle right away (another round revealed it already) - unless
        `confirmReveal` is true. A secret puzzle no other round holds stays hidden
        (its hide dates are kept) - not refused.
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReveal"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/rounds/{roundId}/puzzles:
    put:
      summary: Set the round's puzzles
      operationId: setRoundPuzzles
      description: |
        The round's puzzles become exactly `puzzleIds` (`[]` removes all); puzzles
        kept keep their secret reveal, new ones are not hidden - so a hidden puzzle
        (a competition's secret one, a placeholder) is refused (409). A puzzle is in
        only one round per category of a competition - a list breaking that is
        refused (409). Removing a secret puzzle that comes out right away by it
        (another round revealed it already) is refused (409, `revealedPuzzles`)
        unless `confirmReveal` is true; one no other round holds stays hidden. A refusal
        changes nothing. Solving times are re-linked to rounds right after (round
        results).
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/PuzzleIdList"
                - $ref: "#/components/schemas/ConfirmReveal"
      responses:
        "200":
          description: The round after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/organization:
    put:
      summary: Move a one-time event into an organization or out of it
      operationId: assignCompetitionOrganization
      description: |
        `AssignEventToOrganization` as the reviewer player (an admin): a pending
        event moved under an approved organization is approved at once
        (`OrganizationApprovalPolicy`); moving out (`null`) keeps its approval. An
        edition refuses an organization (409) - it is its series'.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationAssignment"
      responses:
        "200":
          description: The competition after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/publish:
    post:
      summary: Publish a draft competition
      operationId: publishCompetition
      description: |
        The draft flag of a one-time event or an edition goes off (`PublishCompetition`).
        A pending one-time event enters the approval queue then (nobody is e-mailed -
        an admin acts through this API); official results published while it was
        hidden are told once it is public. An edition of a
        draft series stays hidden until its series is published. Publishing a
        published competition changes nothing.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/competitions/{competitionId}/unpublish:
    post:
      summary: Take a competition back to draft
      operationId: unpublishCompetition
      description: |
        `UnpublishCompetition` - only while nobody joined it and no official result or
        solving time is linked to it (409 naming what blocks it: participants,
        results, solving_times).
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "204":
          description: Back to draft
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/move:
    post:
      summary: Move an edition to another series
      operationId: moveEdition
      description: |
        `MoveEditionToSeries`: the edition moves with its participants, rounds,
        results and solving times. Its slug stays unless an edition of the target
        series or a one-time event holds it (409 - send `slug`). Its place follows the target series where it was the
        old series' (a place changed for the edition stays); online follows the
        target; its organization and visibility are the target series'. Its old
        address and its rounds' results addresses answer 301 to the new ones
        (`event_url_redirect`). Refused (409) for a one-time event, for the series
        it is in already, and for a draft target series while the edition has
        participants, official results or linked solving times (a draft never holds
        those; an empty edition may move into a draft).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionMove"
      responses:
        "200":
          description: The edition where it is now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/competitions/{competitionId}/duplicate:
    post:
      summary: Copy an event or edition as a draft
      operationId: duplicateCompetition
      description: |
        `DuplicateCompetition` - the organisers' "Duplicate" (docs/features/competitions-management/README.md,
        "Duplicating an event"). A new draft added by the reviewer player: the same name with a fresh slug, the
        details (description, links except the results link, place, online flag, "Who can enter", dates, logo,
        organization, maintainers, managed-registration settings), every round's settings and the event's own page
        content sections. Never participants, entries, teams, results, results links, referees, round puzzles,
        the event's own puzzles, tables or online timing. An edition's copy is a new edition of the same series.

        The optional body overrides the name, the dates and the place (validated like a PATCH). A new `dateFrom`
        moves `dateTo` (unless sent), every round's start and the registration window by the same number of days.
        A one-time event's copy under an approved organization is approved at once; otherwise it waits for
        approval. Publish it with `POST /internal-api/competitions/{competitionId}/publish`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured. The audit log's `createdId` is the copy.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionDuplicate"
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/competitions/{competitionId}/convert-to-series:
    post:
      summary: Turn a one-time event into a series
      operationId: convertCompetitionToSeries
      description: |
        `ConvertCompetitionToSeries` (docs/features/events-page/high-frequency-series.md, "The conversion
        tool"). The series is created from the event like the web's "Convert to series" button does (name,
        slug when free, logo, description, website, place, shortcut, tag, maintainers, creator, approval or
        rejection, draft state, organization, "Who can enter"; the followers follow the series).

        `keepAsEdition: true` (default): the event becomes the series' first edition with its rounds,
        participants and solving times. `keepAsEdition: false`: the event becomes the series - its solving
        times become series-level results of the new series, its old address (and every old address that
        led to it) answers 301 to the series page, the competition is deleted. Refused (409, nothing changes)
        while the event has rounds, official results, referees, page sections, marketplace marks or
        participants (participants only without `dropParticipants: true`, which deletes them). 409 for an
        edition. No reviewer player needed. The audit log's `createdId` is the new series.
      parameters:
        - $ref: "#/components/parameters/CompetitionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionToSeriesConversion"
      responses:
        "201":
          description: The new series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/rounds/{roundId}/move:
    post:
      summary: Move a round to another one-time event or edition
      operationId: moveRound
      description: |
        `MoveRoundToCompetition`: the round moves with its puzzles (and their reveal
        settings), its table layout and every **explicit** solving time that belongs
        to it - linked to it, or (not linked yet) of the old competition on one of its
        puzzles in its category. Their `competition_id` changes, their round stays;
        both competitions' round results are reconciled. Series picks matched to the
        old edition (automatic links) do not move with the round: the series
        reconcile both competitions get matches them again by the series' rule
        (high-frequency-series.md P29). The round keeps its slug
        (`-2`, `-3`, … when the target has it) and the wall-clock zone it is shown in.
        Its old results address answers 301 to the new one.

        Refused (409, nothing changes): the same competition, participants entered in
        the round (round entries or pairs/teams), its stopwatch running, a puzzle of
        the round already in a round of the same category in the target, a target
        hidden as a draft (a draft event, or an edition of a draft series) while the
        round has solving times (an empty round may move there), or the round moved
        meanwhile.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/RoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundMove"
      responses:
        "200":
          description: The round where it is now (`competitionId`, `slug`, `resultsCount`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/organizations:
    get:
      summary: List or search organizations
      operationId: listOrganizations
      description: Every organization - approved, pending, rejected or a draft - by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name, short name or slug (accents and letter case ignored).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: The approval state (an approved draft is `approved`), or `draft` - drafts, whatever their approval.
          schema:
            type: string
            enum: [all, approved, pending, rejected, draft]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an organization (approved)
      operationId: createOrganization
      description: |
        Like "Add organization", created by the reviewer player and **approved at
        once** (an admin creates it; no e-mail). `"draft": true` keeps it a draft (its
        page answers 404 to everyone but its team). Validated by the web form's rules
        (`OrganizationFormData`). The logo comes from an event or a series
        (`logoFromCompetitionId` / `logoFromSeriesId`) or as `logoBase64`.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/OrganizationFields"
                - type: object
                  required: [name]
                  properties:
                    draft:
                      type: boolean
                      default: false
            example:
              name: Riverbend Jigsaw Association
              shortName: RJA
              kind: association
              countryCode: us
              region: Riverbend Valley
              website: https://riverbend-jigsaw.example
              socialLinks:
                - https://www.instagram.com/riverbendjigsaw
                - https://discord.gg/riverbendjigsaw
      responses:
        "201":
          description: Created - as `GET /internal-api/organizations/{organizationId}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # One path item for GET (id or slug), PATCH and DELETE (id only)
  /internal-api/organizations/{organizationId}:
    get:
      summary: One organization with its team, series and one-time events
      operationId: getOrganization
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The organization's id, or its slug (unique among organizations).
          schema:
            type: string
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update the fields sent
      operationId: updateOrganization
      description: |
        `EditOrganization` - only the fields sent change; `null` or `""` clears a
        field; `socialLinks` replaces the whole list (`[]` / `null` removes every
        link); `maintainerIds` replaces the team besides the creator (left out or
        `null` keeps it). **A rename keeps the slug**; only an explicit `slug` changes
        it (unique, else 409; no redirect from the old one; cannot be cleared - 400).
        `draft` publishes (false) or takes it back to draft (true - always allowed).
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/OrganizationFields"
                - type: object
                  properties:
                    draft:
                      type: boolean
      responses:
        "200":
          description: The organization after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete an empty organization
      operationId: deleteOrganization
      description: |
        Only while no series and no one-time event is under it (409 otherwise). Its
        follows, team and redirect rows go with it.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/organizations/{organizationId}/approve:
    post:
      summary: Approve a pending organization and its pending items
      operationId: approveOrganization
      description: |
        Like the admin approval queue, credited to the reviewer player - and with it
        its pending series and one-time events (not the rejected ones). Its creator is
        e-mailed unless that is the reviewer. Refused (409) for an approved or rejected
        organization.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/organizations/{organizationId}/publish:
    post:
      summary: Publish a draft organization
      operationId: publishOrganization
      description: The draft flag goes off - one still waiting for approval enters the approval queue then.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/organizations/{organizationId}/unpublish:
    post:
      summary: Take an organization back to draft
      operationId: unpublishOrganization
      description: Always allowed - a draft organization hides only its own page, directory entry and "Organized by" links, never its series or events.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Back to draft
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/organizations/{organizationId}/maintainers:
    post:
      summary: Add a player to the organization's team
      operationId: addOrganizationMaintainer
      description: Idempotent. The creator is on the team as its creator and never gets a maintainer row. A team has at most 10 members besides its creator - an 11th is refused (409).
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [playerId]
              properties:
                playerId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: On the team
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/organizations/{organizationId}/maintainers/{playerId}:
    delete:
      summary: Remove a player from the organization's team
      operationId: removeOrganizationMaintainer
      description: Idempotent (a player not on the team is a 204 too). The creator is no maintainer row and stays on the team.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "204":
          description: Not on the team
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/series:
    get:
      summary: List or search series
      operationId: listSeries
      description: Every series - approved, pending, rejected or a draft - by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name, slug or shortcut (letter case ignored; accents ignored in the name).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: The approval state (an approved draft is `approved`), or `draft` - drafts, whatever their approval.
          schema:
            type: string
            enum: [all, approved, pending, rejected, draft]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a series
      operationId: createSeries
      description: |
        Like "Add event" with "Recurring" ticked, added by the reviewer player and
        validated by the form's rules (`CompetitionFormData` with `isRecurring`). Under
        an approved organization (`organizationId`) it is approved at once - the
        reviewer player is an admin (`OrganizationApprovalPolicy`); elsewhere
        `"approve": true` approves it. Nobody is e-mailed. `"draft": true` creates it
        as a draft (it and its editions hidden until it is published).

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/SeriesFields"
                - type: object
                  required: [name]
                  properties:
                    organizationId:
                      type: [string, "null"]
                      format: uuid
                      description: An existing organization (400 otherwise).
                    draft:
                      type: boolean
                      default: false
                    approve:
                      type: boolean
                      default: false
            example:
              name: Copper Kettle Puzzle Night
              organizationId: 0199b000-0000-7000-8000-000000000001
              isOnline: false
              location: Copper Kettle Brewing, Millbrook
              locationCountryCode: us
              link: https://riverbend-jigsaw.example/nights
              eligibility: 18+
              schedule: Second Thursday of the month, 7:30 pm
              description: Casual puzzle nights - no results kept.
      responses:
        "201":
          description: Created - as `GET /internal-api/series/{seriesId}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # One path item for GET (id or slug) and PATCH (id only)
  /internal-api/series/{seriesId}:
    get:
      summary: One series with its editions
      operationId: getSeries
      parameters:
        - name: seriesId
          in: path
          required: true
          description: The series' id, or its slug (unique among series).
          schema:
            type: string
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update the fields sent
      operationId: updateSeries
      description: |
        `EditCompetitionSeries` - only the fields sent change; `null` or `""` clears a
        field; `maintainerIds` replaces the list (left out or `null` keeps it). **A
        rename keeps the slug**; only an explicit `slug` changes it (unique among
        series, else 409; no redirect; cannot be cleared - 400). `organizationId`
        moves the series into an organization or out of it (`null`,
        `AssignEventToOrganization` - needs `INTERNAL_API_REVIEWER_PLAYER_ID`, 403 when
        that player is neither an admin nor on the organization's team); `draft`
        publishes (false) or takes it back to draft (true - 409 while an edition has
        participants, official results or linked solving times). Both are checked
        before anything is written. A PATCH holding any series field validates the
        whole record as it would be stored.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              allOf:
                - $ref: "#/components/schemas/SeriesFields"
                - type: object
                  properties:
                    organizationId:
                      type: [string, "null"]
                      format: uuid
                    draft:
                      type: boolean
      responses:
        "200":
          description: The series after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/series/{seriesId}/publish:
    post:
      summary: Publish a draft series
      operationId: publishSeries
      description: |
        The series' draft flag goes off - its editions keep their own flags; a series
        still waiting for approval enters the approval queue then.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/series/{seriesId}/unpublish:
    post:
      summary: Take a series back to draft
      operationId: unpublishSeries
      description: Only while none of its editions has participants, official results or linked solving times (409 naming them otherwise). A draft series hides its editions too.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "204":
          description: Back to draft
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/series/{seriesId}/editions:
    post:
      summary: Add an edition to a series
      operationId: createEdition
      description: |
        Like "Add edition" (`AddEdition`), validated by the form's rules
        (`EditionFormData`: name and both dates required, `dateTo` not before
        `dateFrom`, links that are URLs, `eligibility` ≤ 120 characters). At the
        series' place, online like the series, approved through its series. `slug`
        must be free in the series and among one-time events (409) - else generated
        from the name. `"draft": true` creates it as a draft. Its rounds follow
        through `POST /internal-api/competitions/{competitionId}/rounds`.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionCreation"
      responses:
        "201":
          description: Created - the edition as `GET /internal-api/competitions/{competitionId}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/series/{seriesId}/organization:
    put:
      summary: Move a series into an organization or out of it
      operationId: assignSeriesOrganization
      description: |
        `AssignEventToOrganization` as the reviewer player (an admin): a pending series
        moved under an approved organization is approved at once; moving out (`null`)
        keeps its approval. Its editions belong to its organization with it.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationAssignment"
      responses:
        "200":
          description: The series after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/series/{seriesId}/create-organization:
    post:
      summary: Turn a series into an organization
      operationId: createOrganizationFromSeries
      description: |
        `CreateOrganizationFromSeries` - **approved at once** (the reviewer player is an
        admin), created by the series' creator. Copied from the series: logo, about
        (its description), website (its link), country and region (its location)
        unless sent (`null` = none), the team (its maintainers). The series' follows
        **move** to the organization (the followers no longer follow the series
        itself; a player following both keeps one row); the series is attached to it
        (a pending series is approved by the policy) - with `newSeriesName` / `newSeriesSlug` renamed, and with a new
        slug its old address answers 301 to the organization and its editions' and
        rounds' old addresses to where they are now. The organization may take the
        series' old slug (`slug`) - organizations and series have separate addresses.
        Social links and the rest follow with `PATCH /internal-api/organizations/{organizationId}`.
        Refused (409) for a series that belongs to an organization already, and for a
        taken slug.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationFromSeries"
      responses:
        "201":
          description: Created - the organization as `GET /internal-api/organizations/{organizationId}` shows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/puzzles:
    get:
      summary: Search puzzles
      operationId: searchPuzzles
      description: |
        The site's own search (names in every language, EANs with or without
        leading zeros, brand codes), approved or not. Secret competition puzzles
        (`hide_until` in the future) are not found, like on the site.
      parameters:
        - name: q
          in: query
          required: false
          description: Name, EAN or brand code. Send `q` or `ean`, not both.
          schema:
            type: string
        - name: ean
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          description: Brand id, or a brand's exact name (any letter case). An unknown name finds nothing.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of puzzles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleSearchResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an approved puzzle without a photo
      operationId: createPuzzle
      description: |
        For a competition puzzle the site does not know yet. Approved at once,
        recorded as a `puzzle_approved` decision (`source = internal_api`). The brand
        is `manufacturerId` or `brand` (a name: an existing brand of that name, any
        letter case, else a new unapproved brand - see `brandCreated`). An EAN another
        puzzle carries is refused (409) unless `allowDuplicateEan` is true.

        Requires `INTERNAL_API_REVIEWER_PLAYER_ID` to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleCreation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminPuzzle"
                  - type: object
                    properties:
                      brandCreated:
                        type: boolean
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/solving-times/{timeId}/verification:
    parameters:
      - $ref: "#/components/parameters/SolvingTimeId"
    get:
      summary: Read a solving time's verification state
      operationId: getSolvingTimeVerification
      description: |
        Whether the time is flagged ("needs verification" - counted nowhere), its
        case in the time verification queue and the notices of the current mark.
        See suspicious-time-review.md.
      responses:
        "200":
          description: The verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolvingTimeVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/solving-times/{timeId}/mark-suspicious:
    parameters:
      - $ref: "#/components/parameters/SolvingTimeId"
    post:
      summary: Mark a solving time "needs verification"
      operationId: markSolvingTimeSuspicious
      description: |
        The queue's "Needs verification" without its card, on any time - one the
        scan never raised gets a case of its own (origin `moderator`, no reasons).
        The time stops counting at once; the player is told by the next notice run
        (the scan, 04:19 / 16:19) unless `toldByHand` is true. One `marked`
        decision, credited to `INTERNAL_API_REVIEWER_PLAYER_ID`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 1000
                  description: The player reads it with the mark.
                reasonCodes:
                  type: array
                  items:
                    type: string
                  description: |
                    Which of the scan's reasons the player reads (default: every one a
                    player may read). Only reasons the case has count, and only while
                    they are about this very entry.
                toldByHand:
                  type: boolean
                  default: false
                  description: |
                    The player is e-mailed by hand - the notices are recorded as sent
                    (`manual_email`), so the banner and the "Your results" e-mail never
                    repeat it.
      responses:
        "200":
          description: Marked - the verification state now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolvingTimeVerification"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/solving-times/{timeId}/unmark-suspicious:
    parameters:
      - $ref: "#/components/parameters/SolvingTimeId"
    post:
      summary: Unmark a solving time ("looks fine")
      operationId: unmarkSolvingTimeSuspicious
      description: |
        The queue's "Looks fine" without its card: a flagged time is unmarked (a flag
        set by SQL that the scan has not reconciled yet too) and counts again, the
        player's open reply is answered "Your time counts again"; a pending case is
        trusted. Either way this entry is never raised again - an edit lapses that.
        409 when the time is neither flagged nor pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 1000
                  description: The player reads it with the answer to their reply.
      responses:
        "200":
          description: Unmarked / trusted - the verification state now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolvingTimeVerification"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal-api/puzzle-images:
    get:
      summary: The image analysis pipeline's work list
      operationId: listPuzzleImages
      description: |
        Puzzles with an image that is shown now (never one hidden by `hide_until` /
        `hide_image_until`), in puzzle id order, a page at a time (keyset: `after` =
        the previous page's `nextCursor`). See internal-api.md "Puzzle image analysis".
      parameters:
        - name: analyzer
          in: query
          required: false
          description: Required for `missing` and `stale`.
          schema:
            $ref: "#/components/schemas/ImageAnalyzer"
        - name: version
          in: query
          required: false
          description: For `stale` - an analysis of another analyzerVersion is stale too.
          schema:
            type: string
            maxLength: 50
        - name: status
          in: query
          required: false
          description: |
            `missing` = no analysis of the analyzer; `stale` = none, or one of another
            picture (imageFingerprint), or of another version (when `version` is given);
            `all` = every puzzle with a shown image.
          schema:
            type: string
            enum: [missing, stale, all]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: after
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            format: uuid
        - name: requires
          in: query
          required: false
          description: |
            Comma-separated analyzers (e.g. `artwork,ocr`): only puzzles whose current
            picture (imageFingerprint) already has a result of every one of them, any
            analyzerVersion - a result of an older picture does not count. Combines with
            every status. An unknown analyzer, `analyzer` itself or `requires[]=` is a 400.
          schema:
            type: string
          example: artwork,ocr
      responses:
        "200":
          description: A page of puzzles
          content:
            application/json:
              schema:
                type: object
                required: [puzzles, nextCursor]
                properties:
                  puzzles:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleImageForAnalysis"
                  nextCursor:
                    type: [string, "null"]
                    format: uuid
                    description: The `after` of the next page, null on the last one.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzles/{puzzleId}/image-analysis/{analyzer}:
    parameters:
      - $ref: "#/components/parameters/PuzzleImageAnalysisPuzzleId"
      - name: analyzer
        in: path
        required: true
        description: An unknown analyzer is a 422.
        schema:
          $ref: "#/components/schemas/ImageAnalyzer"
    put:
      summary: Store one analysis of a puzzle's box image
      operationId: putPuzzleImageAnalysis
      description: |
        Creates or replaces the puzzle's current analysis by the analyzer. Only for
        the puzzle's current picture (`imageFingerprint` from the list) and never for
        a hidden image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleImageAnalysisBody"
      responses:
        "200":
          description: The stored analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleImageAnalysis"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The puzzle's image changed since it was listed (the error names its current fingerprint) - nothing stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidImageAnalysis"

  /internal-api/puzzle-image-claims:
    post:
      summary: A worker claims its next images (lease)
      operationId: claimPuzzleImages
      description: |
        Takes up to `limit` puzzles still to do for the analyzer (no analysis, another
        picture or another version) that no other worker holds - this worker's own
        claims are taken again and extended - in puzzle id order. Race-safe for several
        machines at once (an advisory lock, the statement's ON CONFLICT guard as backstop).
        Fresh work first; this worker's own unexpired claims only when there is not
        enough fresh work (then extended). `requires` limits the candidates to puzzles
        whose current picture already has results of those analyzers. Storing a result
        deletes its claim; release images a worker failed on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [analyzer, version, worker]
              properties:
                analyzer: { $ref: "#/components/schemas/ImageAnalyzer" }
                version: { type: string, maxLength: 50 }
                worker: { type: string, maxLength: 64 }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                leaseSeconds: { type: integer, minimum: 60, maximum: 7200, default: 1800 }
                requires:
                  type: array
                  description: |
                    Only puzzles whose current picture (imageFingerprint) already has a
                    result of every listed analyzer, any analyzerVersion - a result of an
                    older picture does not count. Absent or empty = no filter. An unknown
                    analyzer or `analyzer` itself is a 400. Which analyzer needs which is
                    the pipeline's business (internal-api.md, "requires").
                  items: { $ref: "#/components/schemas/ImageAnalyzer" }
                  example: [artwork, ocr]
      responses:
        "200":
          description: The claimed puzzles, in the work list's shape
          content:
            application/json:
              schema:
                type: object
                required: [puzzles]
                properties:
                  puzzles:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleImageForAnalysis"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzle-image-claims/release:
    post:
      summary: A worker releases its claims
      operationId: releasePuzzleImageClaims
      description: Only this worker's claims - all, or those of an analyzer and/or of the listed puzzles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker]
              properties:
                worker: { type: string, maxLength: 64 }
                analyzer: { $ref: "#/components/schemas/ImageAnalyzer" }
                puzzleIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: How many claims were released
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { type: integer }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzle-image-analyses:
    get:
      summary: Stored results of one analyzer in bulk
      operationId: listPuzzleImageAnalyses
      description: |
        Every stored analysis of the analyzer, payloads included, in puzzle id order,
        hidden images left out. A page ends after `limit` rows or once its results pass
        ~8 MB (the row crossing it is the last) - follow `nextCursor` until it is null.
      parameters:
        - name: analyzer
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ImageAnalyzer"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: after
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string, format: uuid }
        - name: onlyCurrent
          in: query
          required: false
          description: 1 = only analyses of the picture each puzzle has now.
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: A page of analyses
          content:
            application/json:
              schema:
                type: object
                required: [analyzer, items, nextCursor]
                properties:
                  analyzer: { $ref: "#/components/schemas/ImageAnalyzer" }
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleImageAnalysis"
                  nextCursor:
                    type: [string, "null"]
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Store up to 200 image analyses at once
      operationId: recordPuzzleImageAnalyses
      description: |
        One transaction; a refused item never fails the others - every item gets its
        outcome, in order. The same puzzle and analyzer twice: the later item wins.
        Versions are compared for equality: run one version per analyzer at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    allOf:
                      - $ref: "#/components/schemas/PuzzleImageAnalysisBody"
                      - type: object
                        required: [puzzleId, analyzer]
                        properties:
                          puzzleId: { type: string, format: uuid }
                          analyzer: { $ref: "#/components/schemas/ImageAnalyzer" }
      responses:
        "200":
          description: Every item's outcome
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [stored, stale_fingerprint, not_found, invalid]
                    additionalProperties:
                      type: integer
                  items:
                    type: array
                    items:
                      type: object
                      required: [index, status]
                      properties:
                        index: { type: integer, description: The item's position in the request }
                        puzzleId: { type: string }
                        analyzer: { type: string }
                        status:
                          type: string
                          enum: [stored, stale_fingerprint, not_found, invalid]
                        message: { type: string }
                        currentFingerprint:
                          type: string
                          description: stale_fingerprint only - the puzzle's picture now (absent when it has none)
                        errors:
                          type: object
                          description: invalid only - field => what is wrong
                          additionalProperties: { type: string }
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidImageAnalysis"

  /internal-api/puzzles/{puzzleId}/image-analysis:
    parameters:
      - $ref: "#/components/parameters/PuzzleImageAnalysisPuzzleId"
    get:
      summary: Every stored analysis of a puzzle's box image (debugging)
      operationId: getPuzzleImageAnalyses
      responses:
        "200":
          description: The analyses, keyed by analyzer
          content:
            application/json:
              schema:
                type: object
                required: [puzzleId, analyses]
                properties:
                  puzzleId: { type: string, format: uuid }
                  analyses:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PuzzleImageAnalysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/finished-photos:
    get:
      summary: The finished-photo work list - players' photos of the finished puzzle, by fingerprint only
      operationId: listFinishedPhotos
      description: |
        Puzzles with a shown image and at least one finished-puzzle photo of a public player, in
        puzzle id order: the catalogue picture (what a photo is matched against) and up to
        `perPuzzle` photos (the oldest results first), each known only by `photoFingerprint` -
        never a player, a solving time or the stored path. `status` filters the photos; a
        puzzle with none left is skipped but scanned, so a page may hold fewer puzzles than
        `limit`, even none - follow `nextCursor` until it is null.
      parameters:
        - name: analyzer
          in: query
          required: false
          schema: { type: string, enum: [finished_photo], default: finished_photo }
        - name: version
          in: query
          required: false
          description: For `stale` - an analysis of another version is to do as well.
          schema: { type: string, maxLength: 50 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [missing, stale, all], default: all }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: perPuzzle
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 4 }
        - name: after
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of puzzles with photos
          content:
            application/json:
              schema:
                type: object
                required: [analyzer, puzzles, nextCursor]
                properties:
                  analyzer: { type: string }
                  puzzles:
                    type: array
                    items:
                      type: object
                      required: [puzzleId, piecesCount, imageUrl, imageFingerprint, photos]
                      properties:
                        puzzleId: { type: string, format: uuid }
                        piecesCount: { type: integer }
                        imageUrl: { type: string, description: The catalogue picture (full-size original) }
                        imageFingerprint: { type: string }
                        photos:
                          type: array
                          items:
                            type: object
                            required: [photoFingerprint, photoUrl, analysis]
                            properties:
                              photoFingerprint: { type: string }
                              photoUrl: { type: string, description: "GET it with the same token (the endpoint below)" }
                              analysis:
                                type: [object, "null"]
                                properties:
                                  analyzerVersion: { type: string }
                                  photoFingerprint: { type: string }
                                  imageFingerprint: { type: string }
                                  analyzedAt: { type: [string, "null"], format: date-time }
                                  receivedAt: { type: string, format: date-time }
                  nextCursor:
                    type: [string, "null"]
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzles/{puzzleId}/finished-photos/{photoFingerprint}:
    get:
      summary: One finished-puzzle photo - the image proxy's 1200 px JPEG, metadata stripped
      operationId: getFinishedPhoto
      description: |
        Read through the app, so the stored path (it names the player) never leaves it. 404 when
        the fingerprint is not one of the puzzle's current photos of a public player or the
        puzzle is hidden; 503 (+ Retry-After) when the image proxy fails.
      parameters:
        - name: puzzleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: photoFingerprint
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{16}$" }
      responses:
        "200":
          description: The photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The image proxy failed - try again after Retry-After seconds

  /internal-api/finished-photo-analyses:
    get:
      summary: The stored finished-photo analyses in bulk
      operationId: listFinishedPhotoAnalyses
      description: |
        Payloads included, in analysis order; puzzles hidden now left out. Each item names the
        puzzle and the photo's fingerprint, never a player or a solving time; `current` = still
        one of the puzzle's photos of a public player, matched against its current catalogue
        picture.
      parameters:
        - name: analyzer
          in: query
          required: false
          schema: { type: string, enum: [finished_photo], default: finished_photo }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: after
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string, format: uuid }
        - name: onlyCurrent
          in: query
          required: false
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: A page of analyses
          content:
            application/json:
              schema:
                type: object
                required: [analyzer, items, nextCursor]
                properties:
                  analyzer: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [puzzleId, analyzer, analyzerVersion, photoFingerprint, imageFingerprint, analyzedAt, receivedAt, current, result]
                      properties:
                        puzzleId: { type: string, format: uuid }
                        analyzer: { type: string }
                        analyzerVersion: { type: string }
                        photoFingerprint: { type: string }
                        imageFingerprint: { type: string }
                        analyzedAt: { type: [string, "null"], format: date-time }
                        receivedAt: { type: string, format: date-time }
                        current: { type: boolean }
                        result: { type: object }
                  nextCursor:
                    type: [string, "null"]
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Store up to 200 finished-photo analyses at once
      operationId: recordFinishedPhotoAnalyses
      description: |
        One transaction; a refused item never fails the others - every item gets its outcome,
        in order. The same photo twice: the later item wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [puzzleId, analyzer, analyzerVersion, photoFingerprint, imageFingerprint, result]
                    properties:
                      puzzleId: { type: string, format: uuid }
                      analyzer: { type: string, enum: [finished_photo] }
                      analyzerVersion: { type: string, maxLength: 50 }
                      photoFingerprint: { type: string, maxLength: 64 }
                      imageFingerprint: { type: string, maxLength: 64, description: The catalogue picture the photo was matched against }
                      analyzedAt: { type: [string, "null"], format: date-time }
                      result: { type: object, description: "At most 64 KB of JSON (docs/features/insights/finished-photos.md)" }
      responses:
        "200":
          description: Every item's outcome
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [stored, stale_fingerprint, not_found, invalid]
                    additionalProperties:
                      type: integer
                  items:
                    type: array
                    items:
                      type: object
                      required: [index, status]
                      properties:
                        index: { type: integer }
                        puzzleId: { type: string }
                        photoFingerprint: { type: string }
                        status:
                          type: string
                          enum: [stored, stale_fingerprint, not_found, invalid]
                        message: { type: string }
                        currentFingerprint: { type: string }
                        errors:
                          type: object
                          additionalProperties: { type: string }
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidImageAnalysis"

  /internal-api/puzzles/{puzzleId}/tags:
    parameters:
      - $ref: "#/components/parameters/PuzzleImageAnalysisPuzzleId"
    get:
      summary: A puzzle's stored picture tags and the corrections applied to them
      description: |
        `tags` = puzzle_tag as the tag writer last wrote it (docs/features/insights/tags.md): the keys the `tags`
        analysis of the puzzle's current picture assigned, minus the keys a correction removes, plus the keys a
        correction adds. Written daily by `myspeedpuzzling:refresh-puzzle-tags`, and for the puzzle at once after a
        correction.
      operationId: getPuzzleTags
      responses:
        "200":
          description: The tags and the corrections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzles/{puzzleId}/tag-corrections/{tagKey}:
    parameters:
      - $ref: "#/components/parameters/PuzzleImageAnalysisPuzzleId"
      - name: tagKey
        in: path
        required: true
        description: A taxonomy key `<facet>.<key>` (`trait.dark`, `theme.pets.cats`) - one that cannot be in the taxonomy is a 422.
        schema:
          type: string
          pattern: "^[a-z0-9_.]{1,100}$"
    put:
      summary: Correct one tag of a puzzle (admin / moderator word, survives every re-run)
      description: |
        Replaces an earlier correction of the same key. `add` = the puzzle has the tag whatever the analysis says
        (on an assigned tag: a confirmation, the analysis' score is kept), `remove` = it does not. Credited to
        `INTERNAL_API_REVIEWER_PLAYER_ID` (empty = 400). The puzzle's tags are rewritten at once.
      operationId: putPuzzleTagCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict: { type: string, enum: [add, remove] }
                note: { type: [string, "null"], maxLength: 500, description: Internal note - why }
      responses:
        "200":
          description: The puzzle's tags and corrections after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleTags"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidTagKey"
    delete:
      summary: Remove the correction of one tag - the analysis decides that key again
      description: Idempotent - no correction is fine. The puzzle's tags are rewritten at once.
      operationId: deletePuzzleTagCorrection
      responses:
        "200":
          description: The puzzle's tags and remaining corrections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal-api/puzzle-difficulty-labels:
    get:
      summary: Training labels for the image pipeline's difficulty model (as-of, aggregates only)
      operationId: listPuzzleDifficultyLabels
      description: |
        Every puzzle with at least one as-of difficulty index (each index = a solver's first attempt ÷ that solver's
        pace just before it), in puzzle id order. Secret puzzles (`hide_until` / `hide_image_until` ahead) are never
        listed. Aggregates of the puzzle only - nothing of any player. `logDifficulty` = ln of the stored median index
        where the batch keeps one (≥ 5 indices, `labelSource: median`), else the mean ln index (1-4 indices,
        `labelSource: mean_log`).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
        - name: after
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of labels
          content:
            application/json:
              schema:
                type: object
                required: [labels, nextCursor]
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleDifficultyLabel"
                  nextCursor:
                    type: [string, "null"]
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal-api/puzzle-difficulty-estimates:
    put:
      summary: Store up to 500 picture-based difficulty estimates (the current value per puzzle)
      operationId: recordPuzzleDifficultyEstimates
      description: |
        One transaction; a refused item never fails the others - every item gets its outcome, in order. An estimate
        replaces the puzzle's stored one whole (idempotent: the same batch again stores the same values). Refused:
        secret puzzles / pictures (`hidden`), another picture than the puzzle's current one (`stale_fingerprint`),
        unknown puzzles (`unknown_puzzle`), invalid items (`invalid` with `errors`). The same puzzle twice: the later
        item wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/PuzzleDifficultyEstimateBody"
      responses:
        "200":
          description: Every item's outcome
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: object
                    required: [stored, stale_fingerprint, hidden, unknown_puzzle, invalid]
                    additionalProperties:
                      type: integer
                  items:
                    type: array
                    items:
                      type: object
                      required: [index, status]
                      properties:
                        index: { type: integer, description: The item's position in the request }
                        puzzleId: { type: string }
                        status:
                          type: string
                          enum: [stored, stale_fingerprint, hidden, unknown_puzzle, invalid]
                        message: { type: string }
                        currentFingerprint:
                          type: string
                          description: stale_fingerprint only - the puzzle's picture now (absent when it has none)
                        errors:
                          type: object
                          description: invalid only - field => what is wrong
                          additionalProperties: { type: string }
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidDifficultyEstimate"

  /internal-api/puzzle-difficulty-estimates/model:
    get:
      summary: The current model record (the latest run) - the Mac's push guard compares with it
      operationId: getPuzzleDifficultyEstimateModel
      parameters:
        - name: model
          in: query
          required: false
          description: Only runs of this model name.
          schema: { type: string, maxLength: 50 }
      responses:
        "200":
          description: The latest recorded run, null before the first one
          content:
            application/json:
              schema:
                type: object
                required: [current]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/PuzzleDifficultyEstimateModel"
                      - type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Record a run of the difficulty model with its evaluation (becomes the current record, history kept)
      operationId: recordPuzzleDifficultyEstimateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuzzleDifficultyEstimateModelBody"
      responses:
        "201":
          description: The stored record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleDifficultyEstimateModel"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidDifficultyEstimate"

components:
  securitySchemes:
    InternalApiBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Static token from the `INTERNAL_API_TOKEN` env var.

  parameters:
    CompetitionId:
      name: competitionId
      in: path
      required: true
      description: UUID of the competition (an edition of a series is a competition too).
      schema:
        type: string
        format: uuid

    RoundId:
      name: roundId
      in: path
      required: true
      description: UUID of the competition round.
      schema:
        type: string
        format: uuid

    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: UUID of the organization.
      schema:
        type: string
        format: uuid

    SeriesId:
      name: seriesId
      in: path
      required: true
      description: UUID of the series (a recurring event; its editions are competitions).
      schema:
        type: string
        format: uuid

    PlayerId:
      name: playerId
      in: path
      required: true
      description: UUID of the player.
      schema:
        type: string
        format: uuid

    FeatureRequestId:
      name: featureRequestId
      in: path
      required: true
      description: UUID (v7) of the feature request.
      schema:
        type: string
        format: uuid

    ManufacturerId:
      name: manufacturerId
      in: path
      required: true
      description: UUID of the brand (manufacturer).
      schema:
        type: string
        format: uuid

    MergeRequestId:
      name: mergeRequestId
      in: path
      required: true
      description: UUID (v7) of the puzzle merge request.
      schema:
        type: string
        format: uuid

    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      description: UUID (v7) of the puzzle change request.
      schema:
        type: string
        format: uuid

    PuzzleImageAnalysisPuzzleId:
      name: puzzleId
      in: path
      required: true
      description: UUID of the puzzle. Unknown, or with its image hidden now, is a 404.
      schema:
        type: string
        format: uuid
    SolvingTimeId:
      name: timeId
      in: path
      required: true
      description: UUID of the solving time (the id in /en/result/{timeId}).
      schema:
        type: string
        format: uuid

  schemas:
    PuzzleTags:
      type: object
      required: [puzzleId, taxonomyVersion, tags, corrections]
      properties:
        puzzleId: { type: string, format: uuid }
        taxonomyVersion: { type: string, description: The taxonomy version the app's registry follows, e.g. "1.0.0" }
        tags:
          type: array
          items:
            type: object
            required: [key, score, uncertain, source, analysisVersion, taxonomyVersion, labelKey, updatedAt]
            properties:
              key: { type: string, example: trait.large_uniform_areas }
              score: { type: [number, "null"], description: The analysis' confidence 0..1 (traits - the corpus percentile); null for a tag only a correction gives }
              uncertain: { type: boolean, description: Assigned although the analysis' sources disagree }
              source: { type: string, enum: [analysis, correction] }
              analysisVersion: { type: [string, "null"] }
              taxonomyVersion: { type: [string, "null"] }
              labelKey: { type: [string, "null"], description: Translation key of the label - null for a key no page shows yet }
              updatedAt: { type: string, format: date-time }
        corrections:
          type: array
          items:
            type: object
            required: [key, verdict, note, decidedById, decidedAt, taxonomyVersion]
            properties:
              key: { type: string }
              verdict: { type: string, enum: [add, remove] }
              note: { type: [string, "null"] }
              decidedById: { type: [string, "null"], format: uuid, description: Null once that player's account is deleted }
              decidedAt: { type: string, format: date-time }
              taxonomyVersion: { type: string }
    CompetitionFields:
      type: object
      # No additionalProperties here - it would not see the create bodies' own fields (allOf); the request
      # bodies close themselves with unevaluatedProperties: false (an unknown field is a 400)
      description: |
        Validated by the web form's rules: name required; an in-person event
        (`isOnline` false) needs `location`, `dateFrom` and `dateTo` (an edition of
        a series needs neither); `dateTo` not before `dateFrom`, at most 30 days apart;
        links must be URLs. `null` or `""` clears a field. An unknown field is a 400.
      properties:
        name:
          type: string
          maxLength: 250
        shortcut:
          type: [string, "null"]
          maxLength: 250
        description:
          type: [string, "null"]
        location:
          type: [string, "null"]
          maxLength: 250
        locationCountryCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2, any letter case (stored lower case).
          example: cz
        dateFrom:
          type: [string, "null"]
          description: ISO 8601 day (`2026-11-14`); a date-time counts by its day.
        dateTo:
          type: [string, "null"]
        link:
          type: [string, "null"]
          format: uri
          description: The event's website.
        registrationLink:
          type: [string, "null"]
          format: uri
        resultsLink:
          type: [string, "null"]
          format: uri
        isOnline:
          type: boolean
          description: An online event has no place - true clears `location`, like the web form. Its dates stay (optional for an online event - empty = ongoing).
        eligibility:
          type: [string, "null"]
          maxLength: 120
          description: '"Who can enter" ("Members of the club", "18+") - an edition without its own shows its series''.'
        eventTypes:
          type: array
          items: { type: string, enum: [competition, marathon, workshop, casual_puzzling, puzzle_swap] }
          description: 'What kind of event, optional (docs/features/events-page/event-types.md) - each once, answered in this order; `[]` = not set, an edition''s equal to its series'' follows the series. Left out = unchanged.'
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Explicit URL slug - unique (409 otherwise). Left out, create generates it from the name and update keeps it. A change breaks the old URLs (no redirect); it cannot be cleared.
        maintainerIds:
          type: array
          description: Player ids who may manage the event - replaces the list, `[]` empties it, `null` or left out keeps it.
          items:
            type: string
            format: uuid

    Competition:
      type: object
      properties:
        competitionId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: [string, "null"] }
        shortcut: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        locationCountryCode: { type: [string, "null"] }
        dateFrom: { type: [string, "null"], example: "2026-11-14" }
        dateTo: { type: [string, "null"] }
        link: { type: [string, "null"] }
        registrationLink: { type: [string, "null"] }
        resultsLink: { type: [string, "null"] }
        isOnline: { type: boolean }
        isRecurring:
          type: boolean
          description: True for an edition of a series (`series`) - recurring events are series of editions.
        series:
          type: [object, "null"]
          properties:
            seriesId: { type: string, format: uuid }
            name: { type: string }
            slug: { type: [string, "null"] }
            organizationId:
              type: [string, "null"]
              format: uuid
              description: The series' organization - an edition's organization is always its series'.
            draft: { type: boolean, description: The series is a draft (it hides this edition too) }
        organizationId:
          type: [string, "null"]
          format: uuid
          description: A one-time event's own organization - always null for an edition (see `series.organizationId`).
        organization:
          type: [object, "null"]
          properties:
            organizationId: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        eligibility: { type: [string, "null"], description: '"Who can enter" - its own; an edition without one shows its series''' }
        eventTypes: { type: array, items: { type: string, enum: [competition, marathon, workshop, casual_puzzling, puzzle_swap] }, description: 'Its own kinds of event, `[]` = not set (an edition: its series'')' }
        logo: { type: [string, "null"] }
        tagId: { type: [string, "null"] }
        tagName: { type: [string, "null"] }
        status:
          type: string
          enum: [approved, pending, rejected]
          description: The approval state (`IsCompetitionPubliclyVisible::SQL_APPROVED`) - an approved draft is `approved`; an edition is approved through its series.
        draft: { type: boolean, description: The competition's own draft flag }
        hiddenAsDraft: { type: boolean, description: It or its series is a draft }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedByPlayerId: { type: [string, "null"] }
        rejectedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        publiclyVisible:
          type: boolean
          description: The whole visibility rule (`IsCompetitionPubliclyVisible`) - approval and drafts.
        createdAt: { type: [string, "null"], format: date-time }
        addedByPlayerId: { type: [string, "null"] }
        addedByPlayerName: { type: [string, "null"] }
        roundsCount: { type: integer }
        resultsCount: { type: integer, description: Solving times linked to the competition (suspicious ones included) - explicit links and series picks matched to this edition }
        resultsWithoutRoundCount: { type: integer, description: Of those, the ones in no round (their puzzle is in none of its rounds of their category) }
        seriesPickResultsCount:
          type: integer
          description: Of those, the series picks MySpeedPuzzling matched to this edition (docs/features/events-page/high-frequency-series.md) - always 0 for a one-time event
        participantsCount: { type: integer, description: Participants who joined (not removed) }

    CompetitionList:
      type: object
      required: [total, limit, offset, competitions]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        competitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"

    CompetitionDetail:
      allOf:
        - $ref: "#/components/schemas/Competition"
        - type: object
          properties:
            maintainers:
              type: array
              items:
                type: object
                properties:
                  playerId: { type: string, format: uuid }
                  name: { type: [string, "null"] }
                  code: { type: string }
            rounds:
              type: array
              items:
                $ref: "#/components/schemas/Round"
            puzzles:
              type: array
              description: The competition's own (tagged) puzzles.
              items:
                $ref: "#/components/schemas/AdminPuzzle"

    Maintainer:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        name: { type: [string, "null"] }
        code: { type: string }

    OrganizationFields:
      type: object
      # No additionalProperties here - the request bodies close themselves with unevaluatedProperties: false
      description: |
        Validated by the web form's rules (`OrganizationFormData`): name required,
        1-120 characters; short name ≤ 30; about ≤ 5,000; website and social links
        http(s) URLs ≤ 255; at most 10 social links (after duplicates are dropped);
        region ≤ 120; at most 10 team members besides the creator. `null` or `""`
        clears a field. An unknown field is a 400.
      properties:
        name:
          type: string
          maxLength: 120
        shortName:
          type: [string, "null"]
          maxLength: 30
          example: RJA
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Explicit URL slug (`/en/organizations/{slug}`) - unique among organizations (409 otherwise). Left out, create generates it from the name and update keeps it. A change breaks the old URL (no redirect); it cannot be cleared.
        about:
          type: [string, "null"]
          maxLength: 5000
        website:
          type: [string, "null"]
          format: uri
          maxLength: 255
        socialLinks:
          type: [array, "null"]
          description: The other links as plain URLs (Instagram, Discord, …) - the icon comes from the host. Each trimmed, empty ones dropped, each URL once; at most 10 once duplicates are dropped. Replaces the whole list; `[]` or `null` removes every link.
          items:
            type: string
            format: uri
        countryCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2, any letter case (stored lower case).
          example: us
        region:
          type: [string, "null"]
          maxLength: 120
          description: Free text - a state, a region or a city.
        kind:
          type: [string, "null"]
          enum: [association, club, organizer, shop, venue, community, other, null]
        maintainerIds:
          type: [array, "null"]
          maxItems: 10
          description: The team besides its creator, at most 10 - replaces the list, `[]` empties it, `null` or left out keeps it. An unknown player id is a 404.
          items:
            type: string
            format: uuid
        logoFromCompetitionId:
          type: string
          format: uuid
          description: The organization shows the logo this event or edition has (its stored file is shared, nothing is copied). An event without a logo or an unknown id is a 400. Only one of the three logo fields per request; left out, the logo stays.
        logoFromSeriesId:
          type: string
          format: uuid
          description: As `logoFromCompetitionId`, the logo of a series.
        logoBase64:
          type: string
          description: The image itself, base64-encoded (a `data:image/...;base64,` prefix is allowed) - JPEG, PNG, GIF or WebP, at most 5 MB, the web form's rule. Stored like an upload in the UI (`organizations/{id}-{timestamp}.{ext}`).

    Organization:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, example: Riverbend Jigsaw Association }
        shortName: { type: [string, "null"] }
        slug: { type: string, example: riverbend-jigsaw-association }
        logo: { type: [string, "null"] }
        about: { type: [string, "null"] }
        website: { type: [string, "null"] }
        socialLinks:
          type: array
          items: { type: string }
        countryCode: { type: [string, "null"] }
        region: { type: [string, "null"] }
        kind: { type: [string, "null"], enum: [association, club, organizer, shop, venue, community, other, null] }
        status:
          type: string
          enum: [approved, pending, rejected]
          description: The approval state - an approved draft is `approved` with `draft` true.
        draft: { type: boolean }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedByPlayerId: { type: [string, "null"] }
        rejectedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        publiclyVisible:
          type: boolean
          description: Approved, not rejected, not a draft (`IsOrganizationPubliclyVisible`) - its page is indexable and in the directory.
        createdAt: { type: string, format: date-time }
        addedByPlayerId: { type: [string, "null"], description: Its creator - on the team with the maintainers }
        addedByPlayerName: { type: [string, "null"] }
        seriesCount: { type: integer }
        eventsCount: { type: integer, description: Its one-time events }

    OrganizationList:
      type: object
      required: [total, limit, offset, organizations]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"

    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          properties:
            maintainers:
              type: array
              description: The team besides its creator.
              items:
                $ref: "#/components/schemas/Maintainer"
            series:
              type: array
              description: Its series (their editions - `GET /internal-api/series/{seriesId}`).
              items:
                $ref: "#/components/schemas/Series"
            events:
              type: array
              description: Its one-time events.
              items:
                $ref: "#/components/schemas/Competition"

    OrganizationAssignment:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: [string, "null"]
          format: uuid
          description: An existing organization (400 otherwise), or `null` to take the item out of its organization.

    SeriesFields:
      type: object
      # No additionalProperties here - the request bodies close themselves with unevaluatedProperties: false
      description: |
        Validated by the rules of "Add event" with "Recurring" ticked
        (`CompetitionFormData`, `isRecurring`): name required; an in-person series
        (`isOnline` false) needs a location; links must be URLs. `null` or `""`
        clears a field. An unknown field is a 400.
      properties:
        name:
          type: string
          maxLength: 250
        shortcut:
          type: [string, "null"]
          maxLength: 250
        description:
          type: [string, "null"]
        link:
          type: [string, "null"]
          format: uri
        isOnline:
          type: boolean
          description: An online series has no place - true clears `location`.
        location:
          type: [string, "null"]
          maxLength: 250
        locationCountryCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2, any letter case (stored lower case).
        eligibility:
          type: [string, "null"]
          maxLength: 120
          description: '"Who can enter" - editions without their own show it.'
        eventTypes:
          type: array
          items: { type: string, enum: [competition, marathon, workshop, casual_puzzling, puzzle_swap] }
          description: 'What kind of events, optional - editions without their own show them; `[]` = not set. Left out = unchanged.'
          example: 18+
        schedule:
          type: [string, "null"]
          maxLength: 160
          description: '"When it happens" - free text; each date is still its own edition.'
          example: Second Thursday of the month, 7:30 pm
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Explicit URL slug (`/en/series/{slug}`) - unique among series (409 otherwise). Left out, create generates it and update keeps it. A change breaks the old URLs (no redirect); it cannot be cleared.
        maintainerIds:
          type: [array, "null"]
          description: Player ids who may manage the series - replaces the list, `[]` empties it, `null` or left out keeps it.
          items:
            type: string
            format: uuid

    Series:
      type: object
      properties:
        seriesId: { type: string, format: uuid }
        name: { type: string, example: Lantern Brewing Puzzle Night }
        slug: { type: [string, "null"], example: lantern-brewing-puzzle-night }
        shortcut: { type: [string, "null"] }
        description: { type: [string, "null"] }
        link: { type: [string, "null"] }
        isOnline: { type: boolean }
        location: { type: [string, "null"] }
        locationCountryCode: { type: [string, "null"] }
        logo: { type: [string, "null"] }
        organizationId: { type: [string, "null"], format: uuid }
        organization:
          type: [object, "null"]
          properties:
            organizationId: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        eligibility: { type: [string, "null"] }
        schedule: { type: [string, "null"] }
        eventTypes: { type: array, items: { type: string, enum: [competition, marathon, workshop, casual_puzzling, puzzle_swap] }, description: '`[]` = not set' }
        status:
          type: string
          enum: [approved, pending, rejected]
          description: The approval state - an approved draft is `approved` with `draft` true.
        draft: { type: boolean }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedByPlayerId: { type: [string, "null"] }
        rejectedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        publiclyVisible:
          type: boolean
          description: Approved, not rejected, not a draft (`IsSeriesPubliclyVisible`).
        createdAt: { type: [string, "null"], format: date-time }
        addedByPlayerId: { type: [string, "null"] }
        addedByPlayerName: { type: [string, "null"] }
        editionsCount: { type: integer }
        resultsCount:
          type: integer
          description: The series' results, each time once - linked to one of its editions (explicitly or matched) or a series pick without an edition
        resultsWithoutEditionCount:
          type: integer
          description: Of those, the series picks no edition was found for (yet) - a normal, permanent state (docs/features/events-page/high-frequency-series.md)

    SeriesList:
      type: object
      required: [total, limit, offset, series]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"

    SeriesDetail:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          properties:
            maintainers:
              type: array
              items:
                $ref: "#/components/schemas/Maintainer"
            editions:
              type: array
              description: Every edition with the competition list's fields (ids, slugs, dates, state, round / result / participant counts) - its rounds through `GET /internal-api/competitions/{competitionId}`.
              items:
                $ref: "#/components/schemas/Competition"

    EditionCreation:
      type: object
      additionalProperties: false
      required: [name, dateFrom, dateTo]
      properties:
        name:
          type: string
          maxLength: 250
          example: Copper Kettle Puzzle Night - November
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Free in the series and among one-time events (409 otherwise) - left out, generated from the name.
        dateFrom:
          type: string
          description: ISO 8601 day (`2026-11-02`).
        dateTo:
          type: string
          description: ISO 8601 day, not before `dateFrom`.
        link: { type: [string, "null"], format: uri, description: "The edition's own website" }
        registrationLink: { type: [string, "null"], format: uri }
        resultsLink: { type: [string, "null"], format: uri }
        description: { type: [string, "null"] }
        eligibility:
          type: [string, "null"]
          maxLength: 120
          description: '"Who can enter" - empty shows the series''.'
        eventTypes:
          type: array
          items: { type: string, enum: [competition, marathon, workshop, casual_puzzling, puzzle_swap] }
          description: 'What kind of event - left out = its series''.'
        draft:
          type: boolean
          default: false

    EditionMove:
      type: object
      additionalProperties: false
      required: [seriesId]
      properties:
        seriesId:
          type: string
          format: uuid
          description: The target series (an existing one, 400 otherwise; the series the edition is in already is a 409).
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: A new slug for the edition - only needed when its own is taken in the target series (409 otherwise).

    CompetitionDuplicate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The copy's name - left out, the source's.
        dateFrom:
          type: string
          format: date
          description: The copy's first day - moves dateTo (unless sent), the rounds and the registration window by the same number of days.
        dateTo:
          type: string
          format: date
        location:
          type: string
          description: The copy's place (in-person events only - 400 for an online one).

    CompetitionToSeriesConversion:
      type: object
      additionalProperties: false
      properties:
        keepAsEdition:
          type: boolean
          default: true
          description: true = the event becomes the series' first edition (the web button); false = the event becomes the series itself, its solving times series-level results of it, the competition is deleted.
        dropParticipants:
          type: boolean
          default: false
          description: With keepAsEdition false - delete the event's participants instead of refusing (409).

    RoundMove:
      type: object
      additionalProperties: false
      required: [competitionId]
      properties:
        competitionId:
          type: string
          format: uuid
          description: The target one-time event or edition (404 for an unknown one).

    OrganizationFromSeries:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
          example: Riverbend Jigsaw Association
        shortName:
          type: [string, "null"]
          maxLength: 30
        slug:
          type: [string, "null"]
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: The organization's slug - free among organizations (409 otherwise); may be the series' current slug. Left out, generated from the name.
        kind:
          type: [string, "null"]
          enum: [association, club, organizer, shop, venue, community, other, null]
        countryCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2 - left out, the series' country.
        region:
          type: [string, "null"]
          maxLength: 120
          description: Left out, the series' location.
        newSeriesName:
          type: [string, "null"]
          maxLength: 250
          description: The series' new name - left out keeps it.
        newSeriesSlug:
          type: [string, "null"]
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: The series' new slug - free among series (409 otherwise). With it, the old series address redirects to the organization and every old edition and round results address to where it is now.

    RoundFields:
      type: object
      # No additionalProperties here - it would not see the create bodies' own fields (allOf); the request
      # bodies close themselves with unevaluatedProperties: false (an unknown field is a 400)
      properties:
        name:
          type: string
          maxLength: 250
        category:
          type: string
          enum: [solo, duo, team]
          default: solo
        startsAt:
          type: string
          description: |
            ISO 8601 date-time. With an offset it is that moment; without one a
            wall-clock time in the round's zone (the `timezone` sent along, else the
            round's own) - refused (400) when a daylight-saving change skips or
            repeats it there. Stored and answered in UTC.
          example: "2026-11-14T10:00:00+01:00"
        timezone:
          type: string
          description: |
            The round's own IANA time zone - its times are typed and shown in it. A
            new round gets the zone of the event's other rounds, else of its (or its
            series') country, else Europe/Prague. Only together with `startsAt`;
            `null` is a 400.
          example: America/Chicago
        minutesLimit:
          type: integer
          minimum: 1
        revealDelayMinutes:
          type: integer
          minimum: 0
          maximum: 240
          description: |
            When the round's secret puzzles with an automatic reveal come out, in whole
            minutes after `startsAt`. 0 means when the round starts. Anything later than
            240 is an own reveal time, set in the UI. Not a whole number from 0 to 240,
            or `null`, is a 400. Left out on create, the round gets 10; left out on a
            PATCH, the round keeps its value. Moving the automatic reveal earlier needs
            `confirmReveal` (409 otherwise).
          example: 15
        teamSize:
          type: [integer, "null"]
          minimum: 2
          maximum: 20
          description: |
            Team rounds: how many people a team is expected to have - a hint for the
            participants sheet ("3/4 - incomplete"), never a limit. Ignored for solo and
            pair rounds (a pair always has 2) - a round changed to one loses it. `null`
            takes it away; left out on a PATCH, the round keeps its value. For a team
            round, not a whole number from 2 to 20 is a 400.
          example: 4
        badgeBackgroundColor:
          type: [string, "null"]
          example: "#1e88e5"
        badgeTextColor:
          type: [string, "null"]
          example: "#000000"
        resultsLink:
          type: [string, "null"]
          format: uri

    Round:
      type: object
      properties:
        roundId: { type: string, format: uuid }
        competitionId: { type: string, format: uuid }
        slug: { type: [string, "null"] }
        name: { type: string }
        category: { type: string, enum: [solo, duo, team] }
        startsAt: { type: string, format: date-time, example: "2026-11-14T09:00:00+00:00" }
        timezone: { type: string, example: Europe/Prague, description: The round's own zone }
        minutesLimit: { type: integer }
        revealDelayMinutes:
          type: integer
          minimum: 0
          maximum: 240
          example: 10
          description: Minutes after the start when the round's secret puzzles with an automatic reveal come out
        teamSize:
          type: [integer, "null"]
          example: 4
          description: Team rounds - how many people a team is expected to have (null = not set)
        badgeBackgroundColor: { type: [string, "null"] }
        badgeTextColor: { type: [string, "null"] }
        resultsLink: { type: [string, "null"] }
        resultsCount:
          type: integer
          description: Solving times that belong to the round.
        puzzles:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdminPuzzle"
              - type: object
                properties:
                  roundPuzzleId: { type: string, format: uuid }
                  hideUntilRoundStarts: { type: boolean, description: Secret until its reveal }
                  hideMode: { type: [string, "null"], enum: [image_only, entirely, null] }
                  revealMode:
                    type: string
                    enum: [automatic, scheduled, manual]
                    description: automatic = the round's `revealDelayMinutes` after it starts (follows its start and delay); scheduled = the organiser's own moment; manual = when the organiser clicks "Reveal now"
                  revealsAt:
                    type: [string, "null"]
                    format: date-time
                    description: The reveal moment (UTC) of a secret row - null when not secret, or manual and not revealed yet
                  hidesEverywhere:
                    type: boolean
                    description: The round keeps the puzzle secret on the whole site, not only on its event pages

    ConfirmReveal:
      type: object
      properties:
        confirmReveal:
          type: boolean
          default: false
          description: Yes to revealing the secret puzzles a 409 listed (`revealedPuzzles`).

    PuzzleIdList:
      type: object
      required: [puzzleIds]
      properties:
        puzzleIds:
          type: array
          description: The whole list as it should end up - `[]` removes every puzzle.
          items:
            type: string
            format: uuid

    AdminPuzzle:
      type: object
      properties:
        puzzleId: { type: string, format: uuid }
        name: { type: string }
        piecesCount: { type: integer }
        manufacturerId: { type: [string, "null"] }
        manufacturerName: { type: [string, "null"] }
        ean: { type: [string, "null"], description: "Comma-separated when the puzzle has several" }
        identificationNumber: { type: [string, "null"], description: Brand code(s) }
        approved: { type: boolean }
        hiddenUntil: { type: [string, "null"], format: date-time, description: "The site-wide hide of the name (a secret competition puzzle, a placeholder)" }
        imageHiddenUntil: { type: [string, "null"], format: date-time, description: The site-wide hide of the picture }

    PuzzleSearchResult:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        puzzles:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdminPuzzle"
              - type: object
                properties:
                  alternativeNames:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuzzleName"
                  solvedTimes: { type: integer }

    PuzzleCreation:
      type: object
      additionalProperties: false
      required: [name, piecesCount]
      properties:
        name:
          type: string
          description: Main title - the English title of the box when it has one.
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 tag of the main title when it is not English.
        alternativeNames:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleName"
        brand:
          type: string
          description: Brand name - send this or `manufacturerId`.
        manufacturerId:
          type: string
          format: uuid
        piecesCount:
          type: integer
          minimum: 10
          maximum: 25000
        ean:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: One code, a comma-separated string or a list - every one a valid EAN/UPC.
        identificationNumber:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        allowDuplicateEan:
          type: boolean
          default: false

    FeatureRequestStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        githubUrl:
          type: string
          format: uri
          description: Optional link to the GitHub issue or PR.
          example: https://github.com/janmikes/speedpuzzling.cz/pull/123
        adminComment:
          type: string
          description: Optional admin-facing comment attached to the transition.
          example: Shipped in v2.4.

    PuzzleMergeReviewQueue:
      type: object
      required: [totalPending, limit, offset, mergeRequests]
      properties:
        totalPending:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        mergeRequests:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleMergeReviewItem"

    PuzzleMergeReviewItem:
      type: object
      properties:
        mergeRequestId:
          type: string
          format: uuid
        submittedAt:
          type: string
        reporterName:
          type: [string, "null"]
        reporterCode:
          type: [string, "null"]
        sourcePuzzleId:
          type: [string, "null"]
        sourcePuzzleName:
          type: string
        actionable:
          type: boolean
          description: False when fewer than two puzzles are left; such a request closes as already done by itself, or can be rejected.
        missingPuzzleIds:
          type: array
          description: Reported puzzles deleted without a merge.
          items:
            type: string
            format: uuid
        mergedMeanwhile:
          type: object
          description: Reported puzzle id => the puzzle it was merged into since the report - that puzzle is a candidate in its place. An empty object when none.
          additionalProperties:
            type: string
            format: uuid
        reportedNameLanguages:
          type: object
          description: What the reporter said each reported puzzle's name is in - puzzle id => base language (cs, de). An empty object when nothing was said.
          additionalProperties:
            type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PuzzleMergeCandidate"

    PuzzleMergeCandidate:
      type: object
      properties:
        puzzleId:
          type: string
          format: uuid
        name:
          type: string
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when it is not English, null = English or not known.
        alternativeName:
          type: [string, "null"]
          description: The one other name of old - the first Czech name of alternativeNames, else its first name. Kept for existing callers; read alternativeNames.
        alternativeNames:
          type: array
          description: Every other name of the puzzle in order (the box titles it is also sold under), with the BCP 47 language of each when it is known.
          items:
            type: object
            required: [name, language]
            properties:
              name:
                type: string
              language:
                type: [string, "null"]
                description: Normalised BCP 47 tag (cs, de, pt-BR, zh-Hant), null when not known.
        piecesCount:
          type: integer
        ean:
          type: [string, "null"]
        identificationNumber:
          type: [string, "null"]
        manufacturerId:
          type: [string, "null"]
        manufacturerName:
          type: [string, "null"]
        image:
          type: [string, "null"]
          description: Storage path.
        imageUrl:
          type: [string, "null"]
          description: Fetchable thumbnail URL - the decisive signal when judging a duplicate.
        approved:
          type: boolean
        addedAt:
          type: [string, "null"]
        solvedTimesCount:
          type: integer
        collectionItemsCount:
          type: integer
        wishListItemsCount:
          type: integer
        sellSwapItemsCount:
          type: integer
        recordVersion:
          type: string
          description: Fingerprint of the record (names, brand, pieces, codes, image) - send it back on approve in recordVersions.

    PuzzleMergeApproval:
      type: object
      additionalProperties: false
      required: [survivorPuzzleId, mergedName, mergedPiecesCount]
      properties:
        survivorPuzzleId:
          type: string
          format: uuid
          description: The puzzle that stays; every other reported puzzle is deleted. Must be one of the request's reported puzzles (any letter case) - another id is a 400.
        mergedName:
          type: string
          description: The survivor's main title - the English one when the box has one.
        mergedNameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when it is not English (cs); an explicit null = English or not known. Left out, the main title keeps the language the puzzles know for mergedName (the reporter's language, else the puzzle's own, else the language of the other name it is) - with or without mergedAlternativeNames.
        mergedAlternativeNames:
          type: [array, "null"]
          description: The survivor's other names in order - replaces the union of every name, so list every name to keep. Omit or null for the union. At most 20 unless the union already holds more.
          items:
            $ref: "#/components/schemas/PuzzleName"
        mergedPiecesCount:
          type: integer
          minimum: 1
        mergedEan:
          description: Omit or blank to keep the survivor's own - a list of codes or one comma-separated string. The merged puzzles' codes are added either way.
          oneOf:
            - type: [string, "null"]
            - type: array
              items:
                type: string
        mergedIdentificationNumber:
          description: As mergedEan, for the brand codes.
          oneOf:
            - type: [string, "null"]
            - type: array
              items:
                type: string
        mergedManufacturerId:
          type: [string, "null"]
        selectedImagePuzzleId:
          type: [string, "null"]
          format: uuid
          description: Take the cover image from this puzzle.
        decisionConfidence:
          type: [string, "null"]
          enum: [high, medium, low, null]
          description: Stored on the audit row so weakly-evidenced merges can be re-examined first.
        decisionNote:
          type: [string, "null"]
          description: Why. Stored on the audit row; never shown to players.
        recordVersions:
          type: [object, "null"]
          description: Every candidate's recordVersion as read from the queue, puzzle id => version. A puzzle changed since answers 409; a puzzle left out is not checked.
          additionalProperties:
            type: string

    PuzzleMergeSubmission:
      type: object
      additionalProperties: false
      required: [puzzleIds]
      properties:
        puzzleIds:
          type: array
          minItems: 2
          description: At least two distinct puzzle ids; the first is the request's source puzzle.
          items:
            type: string
            format: uuid
        reportedNameLanguages:
          type: object
          description: Optional - the language a reported puzzle's name is in, puzzle id => BCP 47 tag (null = not known). Stored as the base language; a puzzle outside puzzleIds is a 400.
          additionalProperties:
            type: [string, "null"]

    ManufacturerMerge:
      type: object
      additionalProperties: false
      required: [mergedManufacturerIds]
      properties:
        mergedManufacturerIds:
          type: array
          minItems: 1
          description: Brands to fold into the survivor, approved or not.
          items:
            type: string
            format: uuid
        name:
          type: [string, "null"]
          description: The survivor's name as the brand writes it. Omit or blank to keep it.
        decisionConfidence:
          type: [string, "null"]
          enum: [high, medium, low, null]
        decisionNote:
          type: [string, "null"]
          description: Why. Stored as the decision's note.

    ManufacturerApproval:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          description: Fix the spelling on the way. Omit or blank to keep it.
        decisionNote:
          type: [string, "null"]

    ManufacturerDeletion:
      type: object
      additionalProperties: false
      properties:
        decisionNote:
          type: [string, "null"]

    PuzzleMergeRejection:
      type: object
      additionalProperties: false
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          description: Shown to the player who reported the duplicate, as a notification.

    PuzzleChangeProposal:
      type: object
      additionalProperties: false
      required: [puzzleId]
      properties:
        puzzleId:
          type: string
          format: uuid
        name:
          type: string
        manufacturerId:
          type: string
          format: uuid
        piecesCount:
          type: integer
          minimum: 10
          maximum: 25000
        ean:
          description: Every EAN as it should end up - a list, one code per entry (`[]` removes every code), or one comma-separated string.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        identificationNumber:
          description: Every brand code as it should end up - like `ean`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        nameLanguage:
          type: [string, "null"]
          description: BCP 47 language of the main title when the box has no English title (`cs`, `pt-BR`); null = English or not known.
        alternativeNames:
          type: array
          description: The whole list of the other names as it should end up, in order. At most 20 when it grows.
          items:
            $ref: "#/components/schemas/PuzzleName"
        image:
          type: string
          description: The proposed picture - base64 of a JPEG, PNG or WebP (a `data:image/...;base64,` prefix is allowed), at most 15 MB decoded. Checked and stored like the web form's proposed photo.
        source:
          type: string
          enum: [internal_api, image_pipeline]
          default: internal_api
        tags:
          type: array
          maxItems: 10
          description: What kind of proposal it is, e.g. ["artwork_crop"]. At least one for `image_pipeline`.
          items:
            type: string
            pattern: "^[A-Za-z0-9_.:-]{1,50}$"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          maxLength: 100
        sourceImageFingerprint:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: The `imageFingerprint` (image list) of the picture the proposal was made from. Required for `image_pipeline`.

    PuzzleName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        language:
          type: [string, "null"]
          description: BCP 47 language tag of the box it is printed on; null = not known.

    PuzzleChangeApproval:
      type: object
      additionalProperties: false
      required: [selectedFields]
      properties:
        selectedFields:
          type: array
          description: Fields to apply to the puzzle; [] applies nothing. Required on purpose - never implied.
          items:
            type: string
            enum: [name, nameLanguage, alternativeNames, manufacturer, piecesCount, ean, identificationNumber, image]
        decisionNote:
          type: [string, "null"]
          maxLength: 500
          description: Stored as the decision's note (e.g. why an automated review approved it).
        alternativeNames:
          type: array
          description: Corrects the proposed other names (requires `alternativeNames` in selectedFields) - the list as it should end up, applied as a diff against the names when the request was filed.
          items:
            $ref: "#/components/schemas/PuzzleName"
        nameLanguage:
          type: [string, "null"]
          description: Corrects the proposed language of the main title (requires `nameLanguage` in selectedFields).
        recordVersion:
          type: [string, "null"]
          description: The puzzle's record as read before deciding (the filing's 201 answer) - a puzzle changed since answers 409. Omit to check nothing.

    PuzzleChangeRejection:
      type: object
      additionalProperties: false
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          description: Shown to the player who proposed the change, as a notification.
        decisionNote:
          type: [string, "null"]
          maxLength: 500
          description: An internal note kept in the decision log only (`details.decisionNote`), never shown to the player.

    PuzzleChangeRequestListItem:
      type: object
      required: [id, puzzleId, puzzleName, status, source, tags, confidence, modelVersion, sourceImageFingerprint, originalImageUrl, proposedImageUrl, originalArchiveUrl, createdAt, decision]
      properties:
        id: { type: string, format: uuid }
        puzzleId: { type: string, format: uuid }
        puzzleName: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, outdated]
        source:
          type: string
          enum: [player, internal_api, image_pipeline]
        tags:
          type: array
          items: { type: string }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        modelVersion: { type: [string, "null"] }
        sourceImageFingerprint: { type: [string, "null"] }
        originalImageUrl:
          type: [string, "null"]
          description: The puzzle's picture when the request was filed, full size.
        proposedImageUrl:
          type: [string, "null"]
          description: The proposal's file while pending; once approved with the picture, the puzzle's new picture; null once rejected or when no picture is proposed.
        originalArchiveUrl:
          type: [string, "null"]
          description: The archive copy (`originals/…`) made before an approved image pipeline picture replaced the original.
        createdAt: { type: string, format: date-time }
        decision:
          type: [object, "null"]
          description: Null while pending.
          required: [outcome, decidedAt, decidedBy, source, note, rejectionReason, image]
          properties:
            outcome:
              type: string
              enum: [approved, rejected, outdated]
            decidedAt: { type: string, format: date-time }
            decidedBy:
              type: [object, "null"]
              description: Null for what the application closed by itself.
              properties:
                playerId: { type: string, format: uuid }
                name: { type: [string, "null"] }
            source:
              type: [string, "null"]
              enum: [admin_ui, internal_api, automatic, null]
            note:
              type: [string, "null"]
              description: The decision's internal note (an approval's `decisionNote`, a rejection's `details.decisionNote`).
            rejectionReason:
              type: [string, "null"]
              description: The reason the player read - rejections only.
            image:
              type: [string, "null"]
              enum: [proposed, keep, upload, null]
              description: An approval's picture choice - `proposed` = the proposed picture was taken; `keep` / `upload` = approved without it. Null for rejections, closures and approvals logged before the decision log existed.

    ImageAnalyzer:
      type: string
      enum: [artwork, colors, traits, ocr, barcode, vision_labels, embed_siglip2, embed_siglip2_full, embed_dinov2, embed_dinov2_patches, segmentation, describe, piece_scale, box_text, zeroshot, neighbours, tags, crop_trust, finished_photo]
      description: What an image analysis is about (ImageAnalyzer - one new case per new kind of analysis; payload schemas in docs/features/insights/image-taxonomy.md section 11). `finished_photo` analyses players' finished-puzzle photos (/internal-api/finished-photo*), every other one the catalogue picture - the catalogue endpoints refuse it.

    PuzzleImageAnalysisBody:
      type: object
      required: [analyzerVersion, imageFingerprint, result]
      properties:
        analyzerVersion:
          type: string
          maxLength: 50
        imageFingerprint:
          type: string
          maxLength: 64
          description: Exactly the `imageFingerprint` the list gave for the picture analysed.
        analyzedAt:
          type: [string, "null"]
          format: date-time
          description: ISO 8601; without an offset it is UTC. Stored in UTC.
        result:
          type: object
          minProperties: 1
          description: |
            The analyzer's payload, at most 64 KB JSON-encoded (per analyzer). Stored as
            jsonb: key order is not kept, an empty nested object reads back as []. For
            `artwork`, `bbox` {x, y, w, h} and `corners` (4 points {x, y} or [x, y]), when
            present, are fractions 0..1 of the image with x + w <= 1, y + h <= 1.

    PuzzleImageAnalysis:
      type: object
      required: [puzzleId, analyzer, analyzerVersion, imageFingerprint, current, analyzedAt, receivedAt, result]
      properties:
        puzzleId: { type: string, format: uuid }
        analyzer: { $ref: "#/components/schemas/ImageAnalyzer" }
        analyzerVersion: { type: string }
        imageFingerprint: { type: string }
        current:
          type: boolean
          description: It describes the picture the puzzle has now.
        analyzedAt: { type: [string, "null"], format: date-time }
        receivedAt: { type: string, format: date-time }
        result: { type: object }

    UploadedImageMetadata:
      type: object
      required: [version, source, bytes, format, width, height, exif, cameraExif, capturedAt, capturedAtOffset, software, make, orientation]
      properties:
        version: { type: integer, description: The summariser's version (UploadedImageMetadata::VERSION). }
        source:
          type: string
          enum: [server, browser]
          description: 'Who read it: server = from the file that arrived; browser = by the page from the photo as picked, before it shrank it (the canvas drops EXIF) - self-reported, stored only when the file that arrived had no EXIF. Summaries stored before this field existed (2026-10-21) are reported as server.'
        bytes: { type: integer, description: The file's size as uploaded - before any resize or re-encode. }
        format: { type: string, description: 'ImageMagick''s format name: JPEG, PNG, WEBP, HEIC, GIF, TIFF, ...' }
        width: { type: integer, description: Stored pixels as uploaded, before the EXIF orientation. }
        height: { type: integer }
        exif: { type: boolean, description: Any EXIF block at all. }
        cameraExif: { type: boolean, description: 'EXIF a camera writes: make or model, capture time, exposure, aperture, ISO or focal length.' }
        capturedAt: { type: [string, "null"], description: 'DateTimeOriginal as found, the camera''s local wall-clock time (Y-m-d\THH:mm:ss, no zone).' }
        capturedAtOffset: { type: [string, "null"], description: 'OffsetTimeOriginal as found (+02:00), only when the camera wrote one.' }
        software:
          type: [string, "null"]
          enum: [camera, phone, editor, screenshot, unknown, null]
          description: The family of the Software tag (the tag itself is never stored); null without one.
        make: { type: [string, "null"], description: 'The camera brand (Apple, Samsung, Canon, ...), "Other" for an unknown one - never the model.' }
        orientation: { type: [integer, "null"], minimum: 1, maximum: 8 }

    PuzzleImageForAnalysis:
      type: object
      required: [puzzleId, name, piecesCount, manufacturer, imageUrl, imageFingerprint, imageRatio, solvedCount, uploadMetadata, analyses, claims]
      properties:
        puzzleId: { type: string, format: uuid }
        name: { type: string }
        piecesCount: { type: integer }
        manufacturer:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        imageUrl:
          type: string
          description: The full-size original, downloadable from anywhere.
        imageFingerprint:
          type: string
          description: Which picture it is - the first 16 hex characters of md5 of the stored image path.
        imageRatio: { type: [number, "null"] }
        solvedCount:
          type: integer
          minimum: 0
          description: Every counted result of the puzzle (solo, pairs and teams; suspicious ones left out - puzzle_statistics.solved_times_count), 0 when nobody solved it.
        uploadMetadata:
          description: What the picture's file carried when it was uploaded, read before its metadata was stripped (docs/features/upload-image-metadata.md) - null when not known (pictures stored before 2026-10, an unreadable file).
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/UploadedImageMetadata'
        analyses:
          type: object
          description: What is stored per analyzer (an object, {} when nothing).
          additionalProperties:
            type: object
            required: [analyzerVersion, imageFingerprint, analyzedAt, receivedAt]
            properties:
              analyzerVersion: { type: string }
              imageFingerprint: { type: string }
              analyzedAt: { type: [string, "null"], format: date-time }
              receivedAt: { type: string, format: date-time }
        claims:
          type: object
          description: The claims held now (not expired), per analyzer ({} when none).
          additionalProperties:
            type: object
            required: [worker, expiresAt]
            properties:
              worker: { type: string }
              expiresAt: { type: string, format: date-time }

    PuzzleDifficultyLabel:
      type: object
      required: [puzzleId, logDifficulty, labelSource, meanLogIndex, indexCount, piecesCount, manufacturerId, addedAt, imageFingerprint]
      properties:
        puzzleId: { type: string, format: uuid }
        logDifficulty:
          type: number
          description: ln of the as-of difficulty (0 = average) - the training label
        labelSource:
          type: string
          enum: [median, mean_log]
          description: median = ln of the stored median index (≥ 5 indices); mean_log = the mean ln index (1-4)
        meanLogIndex:
          type: number
          description: sum_log_indices ÷ indexCount - for every puzzle
        indexCount: { type: integer, minimum: 1, description: Solvers' first attempts behind the label (k) }
        piecesCount: { type: integer }
        manufacturerId: { type: [string, "null"], format: uuid }
        addedAt: { type: [string, "null"], format: date-time }
        imageFingerprint:
          type: [string, "null"]
          description: The puzzle's current picture (PuzzleImageFingerprint) - join embeddings on it; null = no picture
    PuzzleDifficultyEstimateBody:
      type: object
      additionalProperties: false
      required: [puzzleId, model, modelVersion, logDifficulty, logP10, logP90, outOfFold, trainingSize, imageFingerprint]
      properties:
        puzzleId: { type: string, format: uuid }
        model: { type: string, maxLength: 50 }
        modelVersion: { type: string, maxLength: 50 }
        logDifficulty: { type: number, minimum: -5, maximum: 5 }
        logP10: { type: number, minimum: -5, maximum: 5, description: At most logDifficulty }
        logP90: { type: number, minimum: -5, maximum: 5, description: At least logDifficulty, and at most 1.5 above logP10 }
        outOfFold:
          type: boolean
          description: A labelled puzzle estimated by a model that did not see it (cross-fitted) - the only kind a reconstructed prediction uses
        trainingSize: { type: integer, minimum: 1 }
        imageFingerprint: { type: string, maxLength: 64, description: The picture it was made from - exactly as the lists gave it }
        computedAt:
          type: [string, "null"]
          format: date-time
          description: The pipeline's clock (UTC without an offset); absent = the moment of the push
        logP25:
          type: [number, "null"]
          minimum: -5
          maximum: 5
          description: "Since difficulty_prior 1.2.0, with logP75 (both or neither): logP10 <= logP25 <= logDifficulty"
        logP75:
          type: [number, "null"]
          minimum: -5
          maximum: 5
          description: "With logP25: logDifficulty <= logP75 <= logP90 - the pipeline's own 50 % interval"
        pixelsPerPiece:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
          description: The side of one piece in pixels of the original picture - sqrt(artwork width x height / pieces)
        cropTrust:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: The crop_trust analyzer's trust in the artwork crop of the same picture; null = no such analysis
        pictureFactors:
          type: [array, "null"]
          minItems: 16
          maxItems: 16
          items: { type: number, minimum: -100, maximum: 100 }
          description: The SigLIP 2 crop vector on a frozen, whitened PCA basis (unit variance over the catalogue) - needs pictureFactorsVersion
        pictureFactorsVersion:
          type: [string, "null"]
          maxLength: 50
          description: The version of the picture-factor basis - required with pictureFactors, refused without them
    PuzzleDifficultyEstimateModelBody:
      type: object
      additionalProperties: false
      required: [model, modelVersion, trainingSize, holdoutSpearman, evaluation]
      properties:
        model: { type: string, maxLength: 50 }
        modelVersion: { type: string, maxLength: 50 }
        trainingSize: { type: integer, minimum: 1 }
        holdoutSpearman:
          type: number
          minimum: -1
          maximum: 1
          description: Spearman on the newer-from-older holdout - the push guard's number
        evaluation:
          type: object
          minProperties: 1
          description: |
            The run's numbers as the pipeline sends them (≤ 256 KB JSON), stored as they came. Recommended shape:
            `overall` {spearman, mae, tierExact, tierWithinOne, window50Hit, window80Hit, count}, `groups`
            [{sizeGroup, imageKind, …the same numbers}], `holdouts` {brands, newerFromOlder: {…}}.
        createdAt:
          type: [string, "null"]
          format: date-time
          description: The pipeline's clock; absent = the moment of the push
    PuzzleDifficultyEstimateModel:
      allOf:
        - $ref: "#/components/schemas/PuzzleDifficultyEstimateModelBody"
        - type: object
          required: [id, createdAt, receivedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            receivedAt: { type: string, format: date-time }

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            A stable word for the refusals a script branches on (never renamed): `already_proposed`,
            `image_changed`, `pending_proposal`, `original_not_archived`.
        errors:
          type: object
          description: Invalid fields (field => what is wrong) - only for a request with invalid fields.
          additionalProperties:
            type: string
        revealedPuzzles:
          type: array
          description: |
            Only present when a round change, a round delete or a puzzle removal would
            reveal secret puzzles earlier than planned. It lists what
            `"confirmReveal": true` would let out. A round PATCH that moves the
            automatic reveal earlier lists them at the new moment, or right away when
            that moment is already over.
          items:
            type: object
            required: [puzzleId, name, rightAway, revealsAt, previousRevealsAt, scope, revealedEverywhere, stillHiddenElsewhereUntil]
            properties:
              puzzleId: { type: string, format: uuid }
              name: { type: string }
              rightAway:
                type: boolean
                description: true = out the moment the request is applied (`revealsAt` is null)
              revealsAt:
                type: [string, "null"]
                format: date-time
                description: When it would come out (UTC) - the new automatic reveal moment; null = right away
              previousRevealsAt:
                type: [string, "null"]
                format: date-time
                description: |
                  The moment it moves from (UTC): for a round PATCH, the round's automatic
                  reveal as it is now. Null for a removal or a deleted round (the puzzle
                  leaves the round).
              scope:
                type: string
                enum: [everywhere, name_everywhere, event]
                description: |
                  How far it would come out:
                  - `everywhere`: everything the round hid, on the whole site.
                  - `name_everywhere`: its name on the whole site; its picture stays
                    hidden elsewhere until `stillHiddenElsewhereUntil`.
                  - `event`: on this event only; another round keeps it hidden
                    elsewhere until `stillHiddenElsewhereUntil` - or, when that is null,
                    it was public elsewhere all along (a public catalogue puzzle the
                    round keeps secret on its event pages only).
              revealedEverywhere:
                type: boolean
                description: true when `scope` is `everywhere` (it existed before `scope` and stays)
              stillHiddenElsewhereUntil:
                type: [string, "null"]
                format: date-time
                description: |
                  For `name_everywhere` and `event`, until when the rest stays hidden
                  elsewhere (UTC); null for `everywhere`, and for `event` when the puzzle
                  was public elsewhere all along. `9999-12-31T00:00:00+00:00` = until a
                  manual reveal ("Reveal now" in another round) is made.

    SolvingTimeVerification:
      type: object
      properties:
        timeId: { type: string, format: uuid }
        suspicious:
          type: boolean
          description: Flagged - the time is counted nowhere.
        playerId: { type: string, format: uuid, description: Who tracked the time }
        puzzleId: { type: string, format: uuid }
        puzzleName: { type: string }
        piecesCount: { type: integer }
        seconds: { type: [integer, "null"] }
        puzzlingType: { type: string, enum: [solo, duo, team] }
        case:
          type: [object, "null"]
          description: The time's case in the queue - null when it never had one.
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [pending, marked, trusted, corrected, gone] }
            origin: { type: string, enum: [detector, manual, moderator] }
            direction: { type: [string, "null"], enum: [fast, slow, null] }
            reasons: { type: array, items: { type: string }, description: The scan's reason codes }
            reasonsShown: { type: array, items: { type: string }, description: The reasons the player reads }
            moderatorNote: { type: [string, "null"] }
            markedAt: { type: [string, "null"], format: date-time }
            decidedAt: { type: [string, "null"], format: date-time }
        notices:
          type: array
          description: Who was told about the current mark (empty unless marked).
          items:
            type: object
            properties:
              playerId: { type: string, format: uuid }
              via: { type: string, enum: [run, manual_email] }
              notifiedAt: { type: string, format: date-time }
              response: { type: [string, "null"], description: What the player did (fixed, says_correct, left_as_is) }
              responseText: { type: [string, "null"] }
              answer: { type: [string, "null"], description: The moderators' answer to it }

  responses:
    InvalidDifficultyEstimate:
      description: An invalid model record, or an estimate batch that is no list of 1-500 items (an invalid single estimate is its item's `invalid` outcome)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidTagKey:
      description: A tag key that cannot be in the taxonomy - `<facet>.<key>` of a known facet, at most 100 characters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidJson:
      description: Request body was present but not a valid JSON object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidImageAnalysis:
      description: An invalid image analysis (unknown analyzer, a result that is no object or too big, a bad bbox/corners, unknown fields) or a batch that is no list of 1-200 items
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, wrong, or unconfigured bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Malformed JSON, a missing or invalid field, or no reviewer configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state (taken slug, round invariant, results in a round, secret puzzles a round change would reveal, a hidden puzzle attached unhidden, shared tag, already approved, known EAN, an organization on an edition, a move that cannot be made, cannot go back to draft, an organization that is not empty, a full organization team)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The reviewer player may not put items under this organization - neither an admin nor on its team (`OrganizationNotManaged`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown feature request, merge request, brand, puzzle, competition, round, series, organization or player ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
