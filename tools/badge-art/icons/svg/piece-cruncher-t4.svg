<!-- MSP illustrated icon "piece-cruncher" (Piece Cruncher - a 2x2 jigsaw) - T4 Platinum (lavender pearl). Own work (badge lab IK1), free to use. Layers: face (constant), accent (tier tint), outline (navy #2b3445, 4.5/100, round). four interlocked die-cut pieces - a complete 2x2 jigsaw: one knob or socket on every inner side, the outer sides are the straight border of the puzzle with big rounded corners; checkerboard: two pieces in the tier colour, two in sky and lavender. Not mirror-symmetric inside: an interlock always points one way -->
