    pending_requests_only: "Někdo se vám snaží napsat! Máte %count% nových žádostí o konverzaci čekajících na vaše schválení."
    pending_requests_context: "Může jít o puzzle z tržiště, dotaz ohledně vaší sbírky, nebo jen pozdrav od puzzlera."
    view_requests: "Zobrazit žádosti o konverzaci"
