account_deletion:
    subject: "Potvrďte smazání svého účtu na MySpeedPuzzling"
    preheader: "Pokud si chcete data ponechat, nejdřív si je exportujte. Odkaz platí %minutes% minut."
    title: "Mrzí nás, že odcházíte"
    content: |
        <p>Někdo — doufejme, že vy — nás požádal o smazání účtu MySpeedPuzzling registrovaného na <b>%email%</b>.</p>
        <p>Mrzí nás to, ale chápeme — to se stává. Doufáme, že jste si čas s MySpeedPuzzling užili a že se jednoho dne, až budete mít zase chuť sledovat své časy, vrátíte. Dveře zůstávají otevřené.</p>
    export_hint: |
        <p><b>Než odejdete:</b> exportujte si prosím nejdřív svá data. Jakmile bude účet smazaný, vaše časy skládání už nepůjde obnovit — s exportem si je ale můžete vzít s sebou a jednou se s nimi vrátit.</p>
    export_button: "Exportovat moje data"
    confirm_hint: |
        <p>Pokud chcete pokračovat, klikněte na tlačítko níže. Stránka, která se otevře, požádá o poslední potvrzení — poté bude váš účet se všemi daty trvale smazán a cesta zpět neexistuje.</p>
    button: "Smazat můj účet"
    expires: "Odkaz platí %minutes% minut."
    not_requested: "Nežádali jste o to? Tento e-mail můžete v klidu ignorovat — nic se nestane a váš účet zůstane, jak je. Pokud máte obavu, že má k vašemu účtu přístup někdo jiný, změňte si heslo."

newsletter_confirmation:
    subject: "Jedno kliknutí a puzzle novinky jsou vaše 🧩"
    preheader: "Potvrďte odběr: novinky z MySpeedPuzzling, maximálně jednou měsíčně."
    title: "Potvrďte odběr newsletteru"
    content: |
        <p>Ahoj! Někdo — doufejme, že vy — se přihlásil k odběru newsletteru MySpeedPuzzling na tuto adresu.</p>
        <p>Potvrďte odběr tlačítkem níže a budeme vám dávat vědět, co je na platformě nového — nové funkce, vylepšení a novinky z komunity. Žádný marketing, žádná reklama — jen novinky, maximálně jednou měsíčně.</p>
    button: "Potvrdit odběr"
    expires: "Odkaz platí %hours% hodin. Pokud jste o odběr nežádali, tento e-mail klidně ignorujte a nic vám chodit nebude."

free_trial_started:
    subject: "Tvoje zkušební období členství na MySpeedPuzzling začalo"
    preheader: "Do %trialEndsAt% máš odemčené všechno, co mají členové – bez karty, nic se neruší."
    title: "Zkušební období běží!"
    content: |
        <p>Do <b>%trialEndsAt%</b> máš odemčeno všechno, co mají členové. Bez karty, nic se neruší - skončí samo.</p>
        <p>Kam se podívat nejdřív:</p>
        <ul>
            <li><a href="%profileUrl%">Přehledy na tvém profilu</a> - tvoje výkonnostní úroveň, obtížnost puzzle a předpovědi časů</li>
            <li><a href="%statisticsUrl%">Podrobné statistiky a grafy</a> - jak se tvoje časy vyvíjejí</li>
            <li><a href="%pickerUrl%">Co mám skládat příště?</a> - s filtry pro členy</li>
            <li><a href="%collectionsUrl%">Vlastní kolekce</a> - s tvými časy a předpověďmi</li>
        </ul>
        <p>Když se ti členství zalíbí, můžeš se kdykoli stát členem na <a href="%membershipUrl%">stránce členství</a> - zbytek zkušebního období ti zůstane.</p>
free_trial_ending:
    subject: "Tvoje zkušební období členství na MySpeedPuzzling brzy končí"
    preheader: "Nemusíš nic dělat – skončí samo a nic ti nestrhneme."
    title: "Zkušební období končí %trialEndsAt%"
    content: |
        <p>Tvoje zkušební období členství končí <b>%trialEndsAt%</b>. Nemusíš nic dělat - skončí samo a nic ti nestrhneme.</p>
        <p>Pokud se ti osvědčilo, můžeš se stát členem na <a href="%membershipUrl%">stránce členství</a>. Když si členství předplatíš před koncem zkušebního období, zbývající dny ti zůstanou - první platba přijde až po nich.</p>
        <p>Ať se rozhodneš jakkoli - díky, že jsi to vyzkoušel/a, a ať se ti dobře skládá!</p>

