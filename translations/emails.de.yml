        <p><b>Bevor du gehst:</b> exportiere bitte zuerst deine Daten. Sobald das Konto gelöscht ist, lassen sich deine Legezeiten nicht mehr wiederherstellen — mit einem Export kannst du sie aber mitnehmen und eines Tages wieder mitbringen.</p>
    export_button: "Meine Daten exportieren"
