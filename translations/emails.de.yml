    content: |
        <p>Jemand — hoffentlich du — hat uns gebeten, das MySpeedPuzzling-Konto zu löschen, das auf <b>%email%</b> registriert ist.</p>
        <p>Schade, dass du gehst, aber so etwas passiert. Wir hoffen, du hattest eine schöne Zeit mit MySpeedPuzzling — und dass du eines Tages zurückkommst, wenn du wieder Lust hast, deine Zeiten zu erfassen. Die Tür bleibt offen.</p>
