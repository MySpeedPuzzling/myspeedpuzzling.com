free_trial_started:
    subject: "Dein kostenloser Test der MySpeedPuzzling-Mitgliedschaft hat begonnen"
    preheader: "Bis zum %trialEndsAt% ist alles für Mitglieder freigeschaltet – keine Karte, nichts zu kündigen."
    title: "Dein kostenloser Test läuft!"
    content: |
        <p>Bis zum <b>%trialEndsAt%</b> ist alles für dich freigeschaltet, was Mitglieder haben. Keine Karte, nichts zu kündigen - er endet von selbst.</p>
        <p>Wo du zuerst hinschauen solltest:</p>
        <ul>
            <li><a href="%profileUrl%">Einblicke in deinem Profil</a> - deine Leistungsstufe, Puzzle-Schwierigkeit und Zeitprognosen</li>
            <li><a href="%statisticsUrl%">Detaillierte Statistiken und Diagramme</a> - wie sich deine Zeiten entwickeln</li>
            <li><a href="%pickerUrl%">Was puzzle ich als Nächstes?</a> - mit Filtern für Mitglieder</li>
            <li><a href="%collectionsUrl%">Eigene Sammlungen</a> - mit deinen Zeiten und Prognosen</li>
        </ul>
        <p>Wenn es dir gefällt, kannst du jederzeit auf der <a href="%membershipUrl%">Mitgliedschaftsseite</a> Mitglied werden - der Rest deines Tests bleibt dir erhalten.</p>
free_trial_ending:
    subject: "Dein kostenloser Test der MySpeedPuzzling-Mitgliedschaft endet bald"
    preheader: "Du musst nichts tun – er endet von selbst und dir wird nichts berechnet."
    title: "Dein kostenloser Test endet am %trialEndsAt%"
    content: |
        <p>Dein kostenloser Test der Mitgliedschaft endet am <b>%trialEndsAt%</b>. Du musst nichts tun - er endet von selbst und dir wird nichts berechnet.</p>
        <p>Wenn er sich als nützlich erwiesen hat, kannst du auf der <a href="%membershipUrl%">Mitgliedschaftsseite</a> Mitglied werden. Abonniere vor dem Ende des Tests und die verbleibenden Tage bleiben dir erhalten - deine erste Zahlung kommt erst danach.</p>
        <p>Wie auch immer du dich entscheidest - danke fürs Ausprobieren und viel Spaß beim Puzzeln!</p>

oauth_identity_linked:
    subject: "Die Anmeldung mit %provider% wurde mit deinem MySpeedPuzzling-Konto verbunden"
    preheader: "Du kannst dich jetzt mit %provider% anmelden. Das warst nicht du? So gehst du vor."
    title: "Anmeldung mit %provider% verbunden"
    content: |
        <p>Soeben wurde ein %provider%-Konto mit deinem MySpeedPuzzling-Konto <strong>%email%</strong> verbunden (%linkedAt%). Ab jetzt kannst du dich damit anmelden.</p>
        <p>Wenn du das warst, musst du nichts weiter tun.</p>
    not_you_title: "Das warst nicht du?"
    not_you: |
        <p>Dann kann sich möglicherweise jemand anderes in dein Konto einloggen. Melde dich an, öffne deine Profileinstellungen und trenne %provider% unter „Connected sign-in methods" – und <a href="%resetPasswordUrl%">ändere sicherheitshalber dein Passwort</a>.</p>
    button: "Meine Anmeldemethoden prüfen"

result_review:
