        <p>Tolle Neuigkeiten! Ihre Organisation <strong>%organizationName%</strong> wurde genehmigt.</p>
        <p>Serien und Veranstaltungen, die Ihr Team ihr hinzufügt, brauchen keine weitere Genehmigung – sie erscheinen, sobald Sie sie veröffentlichen.</p>
