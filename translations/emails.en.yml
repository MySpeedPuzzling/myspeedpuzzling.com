            <p>You get this because you follow every feature request.</p>
        admin_comment: |
            <p><strong>Comment from the team:</strong> %adminComment%</p>

sign_in_link:
    subject: "%code% is your MySpeedPuzzling sign-in code"
    preheader: "Enter %code% where you asked for it, or sign in with one tap. Valid for %minutes% minutes."
    title: "Your sign-in code"
    content: |
        <p>Enter this code on the MySpeedPuzzling page where you asked for it:</p>
    or_link: "Or sign in with one tap:"
    button: "Sign in"
    expires: "The code and the link work once, together: whichever you use first. Both expire in %minutes% minutes."
    not_requested: "Did not request this? You can safely ignore this email — nobody can sign in without the code or the link."

verify_email:
    subject: "Confirm your email address for MySpeedPuzzling.com"
    preheader: "One click confirms your email address – then you're all set."
    title: "Confirm your email address"
    content: |
        <p>Welcome to MySpeedPuzzling — you are in good company of over 10,000 other puzzlers!</p>
        <p>Just confirm your email address and you are all set: time your solves, compare your results with the community and watch your personal bests fall.</p>
    button: "Confirm my email address"
    expires: "The link is valid for %hours% hours."
    not_requested: "Did not create this account? You can safely ignore this email."

password_reset:
    subject: "Reset your MySpeedPuzzling.com password"
    preheader: "Choose a new password with the button inside. The link works once, for %minutes% minutes."
    title: "Choose a new password"
    content: |
        <p>Somebody — hopefully you — asked to reset the password for your MySpeedPuzzling.com account. Click the button below to choose a new one.</p>
    button: "Choose a new password"
    expires: "The link works once and expires in %minutes% minutes."
    not_requested: "Did not request this? You can safely ignore this email — your password stays as it is."

account_deletion:
    subject: "Confirm the deletion of your MySpeedPuzzling account"
    preheader: "Export your data first if you want to keep it. The link is valid for %minutes% minutes."
    title: "Sorry to see you go"
    content: |
        <p>Somebody — hopefully you — asked us to delete the MySpeedPuzzling account registered to <b>%email%</b>.</p>
        <p>We're sorry to see you go, but that happens. We hope you enjoyed your time with MySpeedPuzzling — and that one day, when you feel like tracking your times again, you'll come back. The door stays open.</p>
    export_hint: |
        <p><b>Before you go:</b> please export your data first. Once the account is gone, your solving times cannot be recovered — but with an export you can bring them back with you if you ever return.</p>
    export_button: "Export my data"
    confirm_hint: |
        <p>To go ahead, click the button below. The page it opens asks for one final confirmation — after that, your account and all its data are deleted permanently and there is no way back.</p>
    button: "Delete my account"
    expires: "The link is valid for %minutes% minutes."
    not_requested: "Did not request this? You can safely ignore this email — nothing will happen and your account stays as it is. If you are worried somebody else has access to your account, change your password."

newsletter_confirmation:
    subject: "One click and the puzzle news is yours 🧩"
    preheader: "Confirm your subscription: what's new on MySpeedPuzzling, at most once a month."
    title: "Confirm your subscription"
    content: |
        <p>Hi! Somebody — hopefully you — asked to receive the MySpeedPuzzling newsletter at this address.</p>
        <p>Confirm below and we'll let you know what's new on the platform — new features, improvements and community news. No marketing, no promotions — just what's new, at most once a month.</p>
    button: "Confirm my subscription"
    expires: "The link is valid for %hours% hours. If you didn't request this, simply ignore this e-mail and nothing will be sent."

free_trial_started:
    subject: "Your free trial of MySpeedPuzzling membership has started"
    preheader: "All member features are unlocked until %trialEndsAt% – no card, nothing to cancel."
    title: "Your free trial is on!"
    content: |
        <p>Everything members have is unlocked for you until <b>%trialEndsAt%</b>. No card, nothing to cancel - it ends by itself.</p>
        <p>Where to look first:</p>
        <ul>
            <li><a href="%profileUrl%">Insights on your profile</a> - your skill tier, puzzle difficulty and time predictions</li>
            <li><a href="%statisticsUrl%">Detailed statistics and charts</a> - how your times develop</li>
            <li><a href="%pickerUrl%">What should I solve next?</a> - with member filters</li>
            <li><a href="%collectionsUrl%">Your own collections</a> - with your times and predictions</li>
        </ul>
        <p>If you like it, you can become a member any time on the <a href="%membershipUrl%">membership page</a> - the rest of your trial stays yours.</p>

free_trial_ending:
    subject: "Your free trial of MySpeedPuzzling membership ends soon"
    preheader: "Nothing to do – it ends by itself and you won't be charged."
    title: "Your free trial ends on %trialEndsAt%"
    content: |
        <p>Your free trial of membership ends on <b>%trialEndsAt%</b>. You do not have to do anything - it ends by itself and you will not be charged.</p>
        <p>If it turned out useful, you can become a member on the <a href="%membershipUrl%">membership page</a>. Subscribe before the trial ends and the remaining days stay yours - your first payment comes only after them.</p>
        <p>Whatever you decide - thank you for giving it a try, and happy puzzling!</p>

oauth_identity_linked:
    subject: "%provider% sign-in was connected to your MySpeedPuzzling account"
    preheader: "You can now sign in with %provider%. Wasn't you? Here is what to do."
    title: "%provider% sign-in connected"
    content: |
        <p>A %provider% account was just connected to your MySpeedPuzzling account <strong>%email%</strong> (%linkedAt%). From now on you can use it to sign in.</p>
        <p>If this was you, there is nothing else to do.</p>
    not_you_title: "Wasn't you?"
    not_you: |
        <p>Then someone else may be able to sign in to your account. Sign in, open your profile settings and disconnect %provider% under "Connected sign-in methods" - and <a href="%resetPasswordUrl%">change your password</a> to be safe.</p>
    button: "Review my sign-in methods"

result_review:
    subject_first: "Could you check a few of your results?"
    subject_weekly: "A few more results to check"
    subject_removed: "We removed results that showed up twice"
    preheader_removed: "The extra copies of results that showed up twice are gone – each solve counts once."
    preheader_weekly: "A few more results may show up twice – a quick check keeps your statistics right."
    preheader_first: "A few of your results may show up twice – checking them takes just a moment."
    title_first: "Could you check a few of your results?"
    title_weekly: "A few more results to check"
    title_removed: "We removed results that showed up twice"
    greeting: "Hi %playerName%,"
    intro_first: "We want the results on MySpeedPuzzling to be as precise as possible, so we went through all of them and found a few of yours that show up twice. That can happen because of a technical hiccup – for example a save that reached us twice."
    intro_weekly: "Thank you for checking your results last time! Since then we found a few more that may show up twice."
    intro_removed: "Some of your results showed up twice because of a technical hiccup, so we removed the extra copies – we want the results on MySpeedPuzzling to be as precise as possible."
    check_heading: "Please check – we weren't sure"
    check_text: "Each of these may be one solve recorded twice – then it counts twice in your statistics – or two real solves with exactly the same time. We'd rather ask you than delete a real solve."
    check_action: "On the review page it takes a moment: keep one copy, or tell us both are real."
    removed_heading: "Already fixed – we were sure"
    removed_text: "These reached us twice within a few seconds, identical in every detail – one save that came through twice. We removed the extra copy, so each counts once. If we got it wrong, you can bring it back on the review page."
    case_line: "%puzzleName% – %time%, %date%"
    kind_saved_twice: "the same time recorded twice"
    kind_teammate_copy: "your teammate saved it too"
    kind_solo_and_group: "saved as a solo and as a pair/team result"
    more: "…and %count% more"
    button: "Check my results"
    thanks: "Thank you for helping us keep the results precise – and happy puzzling!"
    signature: "Your MySpeedPuzzling team"
    opt_out: "You get this e-mail because of your results on MySpeedPuzzling. <a href=\"%settingsUrl%\">E-mail settings</a> · <a href=\"%unsubscribeUrl%\">Stop e-mails about my results</a>"
    # Time verification: times set aside until they are checked and the moderators' answers to "The time is correct".
    # The *_verification* variants are used when the e-mail has nothing else; %count% picks "a result" / "results".
    subject_verification: "{1}One of your results is awaiting verification|[0,Inf[Some of your results are awaiting verification"
    title_verification: "{1}One of your results is awaiting verification|[0,Inf[Some of your results are awaiting verification"
    preheader_verification: "Often it's just a typo – fixing it, or telling us it's right, takes a moment."
    intro_verification: "We want the results on MySpeedPuzzling to be as precise as possible, so we take a closer look when a result stands out."
    subject_verification_answered: "{1}Your result was checked|[0,Inf[Your results were checked"
    title_verification_answered: "{1}Your result was checked|[0,Inf[Your results were checked"
    preheader_verification_answered: "Thank you for getting back to us – here is what we found."
    intro_verification_answered: "Thank you for getting back to us. We had another look – here is what we found."
    verification_heading: "Awaiting verification"
    verification_text: "A result much faster or much slower than your usual ones is often a typo, so results like that are set aside – out of rankings and statistics – until they're checked."
    verification_action: "On the review page you can fix a time in a moment – or tell us it's right."
    verification_answers_heading: "We had another look"
    verification_answer_trusted: "Your time %time% on %puzzleName% was checked – it counts again."
    verification_answer_kept: "Your time %time% on %puzzleName% was checked – it stays set aside."
    verification_answer_kept_note: "Your time %time% on %puzzleName% was checked – it stays set aside: %note%"

organization_submitted:
    subject: "New organization submitted: %organizationName%"
    title: "New Organization Submission"
    content: |
        <p>A new organization has been submitted for approval.</p>
        <p><strong>Submitted by:</strong> %playerName%<br><strong>Organization:</strong> %organizationName%<br><strong>Region:</strong> %region%</p>
    button: "Review pending organizations in admin"

organization_approved:
    subject: "Your organization has been approved!"
    preheader: "%organizationName% is approved on MySpeedPuzzling."
    title: "Your organization has been approved!"
    content: |
