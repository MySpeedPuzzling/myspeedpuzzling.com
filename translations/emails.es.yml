    view_messages: "Leer tus mensajes"
    pending_requests_also: "También tienes %count% nueva(s) solicitud(es) de conversación — ¡alguien quiere conectar contigo!"
    pending_requests_only: "¡Alguien quiere contactarte! Tienes %count% nueva(s) solicitud(es) de conversación esperando tu aprobación."
    pending_requests_context: "Podrían ser sobre un puzzle del marketplace, una pregunta sobre tu colección, o simplemente un puzzlero saludando."
    view_requests: "Revisar solicitudes de conversación"
