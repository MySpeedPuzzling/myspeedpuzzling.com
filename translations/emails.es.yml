    preheader: "Un clic para confirmar tu dirección de correo y listo."
    title: "Confirma tu dirección de correo electrónico"
    content: |
        <p>¡Bienvenido a MySpeedPuzzling! Estás en buena compañía: ya somos más de 10.000 puzzlers.</p>
        <p>Solo tienes que confirmar tu dirección de correo y listo: cronometra tus montajes, compara tus resultados con la comunidad y mira cómo caen tus récords personales.</p>
    button: "Confirmar mi dirección de correo electrónico"
    expires: "El enlace es válido durante %hours% horas."
    not_requested: "¿No has creado esta cuenta? Puedes ignorar este correo sin problema."

password_reset:
    subject: "Restablece tu contraseña de MySpeedPuzzling.com"
    preheader: "Elige una contraseña nueva con el botón del correo. El enlace sirve una vez, %minutes% minutos."
    title: "Elige una contraseña nueva"
    content: |
        <p>Alguien —esperamos que tú— ha pedido restablecer la contraseña de tu cuenta de MySpeedPuzzling.com. Haz clic en el botón de abajo para elegir una nueva.</p>
    button: "Elegir una contraseña nueva"
    expires: "El enlace funciona una sola vez y caduca en %minutes% minutos."
    not_requested: "¿No lo has solicitado? Puedes ignorar este correo sin problema: tu contraseña seguirá siendo la misma."

account_deletion:
    subject: "Confirma la eliminación de tu cuenta de MySpeedPuzzling"
    preheader: "Si quieres conservar tus datos, expórtalos primero. El enlace es válido durante %minutes% minutos."
    title: "Nos da pena que te vayas"
    content: |
        <p>Alguien —esperamos que tú— nos ha pedido eliminar la cuenta de MySpeedPuzzling registrada con <b>%email%</b>.</p>
        <p>Nos da pena que te vayas, pero son cosas que pasan. Esperamos que hayas disfrutado de tu tiempo en MySpeedPuzzling y que algún día, cuando vuelvas a tener ganas de registrar tus tiempos, regreses. La puerta queda abierta.</p>
    export_hint: |
        <p><b>Antes de irte:</b> exporta primero tus datos. Una vez eliminada la cuenta, tus tiempos no se podrán recuperar; con una exportación, en cambio, podrás llevártelos contigo y traerlos de vuelta si algún día regresas.</p>
    export_button: "Exportar mis datos"
    confirm_hint: |
        <p>Para continuar, haz clic en el botón de abajo. La página que se abre te pedirá una última confirmación; después, tu cuenta y todos sus datos se eliminarán de forma permanente y no habrá vuelta atrás.</p>
    button: "Eliminar mi cuenta"
    expires: "El enlace es válido durante %minutes% minutos."
    not_requested: "¿No lo has solicitado? Puedes ignorar este correo sin problema: no pasará nada y tu cuenta seguirá igual. Si te preocupa que otra persona tenga acceso a tu cuenta, cambia tu contraseña."

newsletter_confirmation:
    subject: "Un clic y las novedades de puzzles son tuyas 🧩"
    preheader: "Confirma tu suscripción: novedades de MySpeedPuzzling, como mucho una vez al mes."
    title: "Confirma tu suscripción"
    content: |
        <p>¡Hola! Alguien —esperamos que tú— ha pedido recibir el newsletter de MySpeedPuzzling en esta dirección.</p>
        <p>Confírmalo abajo y te contaremos las novedades de la plataforma: nuevas funciones, mejoras y noticias de la comunidad. Sin marketing ni promociones — solo novedades, como mucho una vez al mes.</p>
    button: "Confirmar mi suscripción"
    expires: "El enlace es válido durante %hours% horas. Si no lo has solicitado, ignora este correo sin problema y no te enviaremos nada."

free_trial_started:
    subject: "Tu prueba gratuita de la membresía de MySpeedPuzzling ha empezado"
    preheader: "Todo lo de los miembros está desbloqueado hasta el %trialEndsAt%: sin tarjeta, nada que cancelar."
    title: "¡Tu prueba gratuita está en marcha!"
    content: |
        <p>Todo lo que tienen los miembros está desbloqueado para ti hasta el <b>%trialEndsAt%</b>. Sin tarjeta, nada que cancelar - termina sola.</p>
        <p>Por dónde empezar:</p>
        <ul>
            <li><a href="%profileUrl%">Análisis en tu perfil</a> - tu nivel, la dificultad de los puzzles y predicciones de tiempo</li>
            <li><a href="%statisticsUrl%">Estadísticas y gráficos detallados</a> - cómo evolucionan tus tiempos</li>
            <li><a href="%pickerUrl%">¿Qué monto ahora?</a> - con filtros para miembros</li>
            <li><a href="%collectionsUrl%">Tus propias colecciones</a> - con tus tiempos y predicciones</li>
        </ul>
        <p>Si te gusta, puedes hacerte miembro cuando quieras en la <a href="%membershipUrl%">página de membresía</a> - el resto de tu prueba sigue siendo tuyo.</p>
free_trial_ending:
    subject: "Tu prueba gratuita de la membresía de MySpeedPuzzling termina pronto"
    preheader: "No tienes que hacer nada: termina sola y no se te cobrará nada."
    title: "Tu prueba gratuita termina el %trialEndsAt%"
    content: |
        <p>Tu prueba gratuita de la membresía termina el <b>%trialEndsAt%</b>. No tienes que hacer nada - termina sola y no se te cobrará nada.</p>
        <p>Si te ha resultado útil, puedes hacerte miembro en la <a href="%membershipUrl%">página de membresía</a>. Suscríbete antes de que termine la prueba y conservarás los días restantes - tu primer pago llegará después de ellos.</p>
        <p>Decidas lo que decidas - gracias por probarla, ¡y felices puzzles!</p>

oauth_identity_linked:
    subject: "Se ha conectado el inicio de sesión con %provider% a tu cuenta de MySpeedPuzzling"
    preheader: "Ya puedes iniciar sesión con %provider%. ¿No has sido tú? Te explicamos qué hacer."
