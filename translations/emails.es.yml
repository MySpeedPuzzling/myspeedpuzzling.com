footer_tagline: "La comunidad de Speed Puzzling"
footer: 'Gracias por ser parte de <a href="%homepageLink%">MySpeedPuzzling.com</a>.<br>Si tienes alguna pregunta, no dudes en contactarnos en cualquier momento en <a href="mailto:simona@speedpuzzling.cz">simona@speedpuzzling.cz</a>.'

membership_cancelled:
    subject: "La suscripción de membresía en MySpeedPuzzling.com ha sido cancelada"
    preheader: "No se te cobrará nada más. Tu membresía sigue activa hasta el %membershipExpiresAt%."
    title: "¡La suscripción de membresía ha sido cancelada!"
    content: |
        <p>Lamentamos verte partir, pero apreciamos el tiempo que pasaste con MySpeedPuzzling.com.</p>
        <p>No te preocupes, no se te cobrará más. Sin embargo, tu membresía permanecerá activa hasta el final del período de facturación actual, que termina el <b>%membershipExpiresAt%</b>.</p>
        <p>Si cambias de opinión, puedes gestionar tu membresía en cualquier momento en la <a href="%membershipUrl%">página de membresía</a>.</p>
        <p>Estamos trabajando constantemente para mejorar MySpeedPuzzling.com y apreciaríamos mucho cualquier comentario o idea que tengas.</p>
        <p>¡Gracias por ser parte de MySpeedPuzzling.com, y esperamos darte la bienvenida de vuelta algún día! :)</p>

membership_granted:
    subject: "Felicitaciones por tu membresía en MySpeedPuzzling.com"
    preheader: "Un agradecimiento por todo lo que haces por la comunidad: tu membresía está activa."
    title: "¡Tu membresía ahora está activa!"
    content: |
        <p>¡Estamos emocionados de reconocer tu contribución y esfuerzos en la comunidad de Speed Puzzling!</p>
        <p>Como muestra de nuestro aprecio, te hemos otorgado una membresía en MySpeedPuzzling.com. Tu membresía permanecerá activa hasta: <b>%membershipExpiresAt%</b>.</p>
        <p>Puedes verificar y gestionar tu membresía en cualquier momento en la <a href="%membershipUrl%">página de membresía</a>.</p>
        <p>Gracias por ser una parte tan valiosa de la comunidad de Speed Puzzling. ¡Sigue resolviendo rompecabezas e inspirando a otros puzzleros!</p>

membership_subscribed:
    subject: "Felicitaciones por tu membresía en MySpeedPuzzling.com"
    preheader: "Tu membresía ya está activa. Próximo período de facturación: %nextBillingPeriod%."
    title: "¡Gracias por unirte a nosotros!"
    content: |
        <h4>Tu membresía ahora está activa.</h4>
        <p>¡Valoramos profundamente tu apoyo y estamos emocionados de darte la bienvenida como miembro de MySpeedPuzzling.com!</p>
        <p>Tu próximo período de facturación comienza el: <b>%nextBillingPeriod%</b>.</p>
        <p>Puedes gestionar tu suscripción, cancelar la membresía o descargar facturas en cualquier momento en la <a href="%membershipUrl%">página de membresía</a>.</p>
        <p>Gracias por ser parte de MySpeedPuzzling.com y por tu apoyo. ¡Te deseamos mucho speed puzzling rápido y resultados increíbles!</p>

subscription_payment_failed:
    subject: "El pago de membresía en MySpeedPuzzling.com falló"
    preheader: "El pago no se ha completado: tu membresía queda en pausa hasta que se complete."
    title: "¡El pago de membresía falló!"
    content: |
        <p>Tu último pago de membresía no se ha completado. A veces los pagos se rechazan aunque no hayas cambiado nada, por ejemplo cuando el banco ha sustituido la tarjeta o una tarjeta guardada en Apple Pay o Google Pay ha dejado de ser válida allí.</p>
        <p>Tu membresía queda en pausa hasta que se complete un pago. Revisa tu método de pago en el portal de facturación. En cuanto un pago se complete, tu membresía vuelve a estar activa al instante.</p>
        <p>Es posible que volvamos a intentar el pago automáticamente en los próximos días, pero no todos los pagos fallidos se pueden reintentar, así que no esperes a que ocurra. ¡Esperamos que te quedes con MySpeedPuzzling.com!</p>
    button: "Actualizar método de pago"

subscription_renewed:
    subject: "El pago de membresía en MySpeedPuzzling.com fue exitoso"
    preheader: "Tu membresía se ha renovado. Próximo período de facturación: %nextBillingPeriod%."
    title: "¡Pago exitoso, gracias!"
    content: |
        <p>¡Muchas gracias por quedarte con nosotros y ser parte de MySpeedPuzzling.com!</p>
        <p>Estamos emocionados de informarte que tu membresía ha sido renovada exitosamente. Tu próximo período de facturación comienza el: <b>%nextBillingPeriod%</b>.</p>
        <p>Si deseas actualizar o revisar los detalles de tu suscripción, puedes hacerlo en la <a href="%membershipUrl%">página de membresía</a>.</p>
        <p>Estamos trabajando constantemente en mejorar y añadir nuevas características para nuestros miembros. Si hay algo que podemos hacer mejor, háznos saber.</p>
        <p>Una vez más, gracias por tu apoyo. ¡Te deseamos mucho speed puzzling rápido y resultados increíbles!</p>

