verify_email:
    subject: "Confirmez votre adresse e-mail pour MySpeedPuzzling.com"
    preheader: "Un clic pour confirmer votre adresse e-mail – et tout est prêt."
    title: "Confirmez votre adresse e-mail"
    content: |
        <p>Bienvenue sur MySpeedPuzzling ! Vous êtes en bonne compagnie : nous sommes déjà plus de 10 000 puzzleurs.</p>
        <p>Il ne reste qu'à confirmer votre adresse e-mail et tout est prêt : chronométrez vos puzzles, comparez vos résultats avec la communauté et regardez tomber vos records personnels.</p>
    button: "Confirmer mon adresse e-mail"
    expires: "Le lien est valable %hours% heures."
