    not_requested: "Vous n'êtes pas à l'origine de cette demande ? Vous pouvez ignorer cet e-mail sans crainte — votre mot de passe reste inchangé."

account_deletion:
    subject: "Confirmez la suppression de votre compte MySpeedPuzzling"
    preheader: "Exportez d’abord vos données si vous souhaitez les garder. Le lien est valable %minutes% minutes."
    title: "Désolés de vous voir partir"
    content: |
        <p>Quelqu'un — nous espérons que c'est vous — nous a demandé de supprimer le compte MySpeedPuzzling enregistré à l'adresse <b>%email%</b>.</p>
        <p>Nous sommes désolés de vous voir partir, mais cela arrive. Nous espérons que vous avez apprécié votre temps sur MySpeedPuzzling — et qu'un jour, quand l'envie de suivre vos temps vous reprendra, vous reviendrez. La porte reste ouverte.</p>
    export_hint: |
        <p><b>Avant de partir :</b> pensez à exporter vos données d'abord. Une fois le compte supprimé, vos temps de puzzle ne pourront plus être récupérés — mais avec un export, vous pouvez les emporter et les rapporter si vous revenez un jour.</p>
    export_button: "Exporter mes données"
    confirm_hint: |
        <p>Pour continuer, cliquez sur le bouton ci-dessous. La page qui s'ouvre vous demandera une dernière confirmation — ensuite, votre compte et toutes ses données seront supprimés définitivement, sans retour en arrière possible.</p>
    button: "Supprimer mon compte"
    expires: "Le lien est valable %minutes% minutes."
    not_requested: "Vous n'êtes pas à l'origine de cette demande ? Vous pouvez ignorer cet e-mail sans crainte — rien ne se passera et votre compte restera tel quel. Si vous craignez que quelqu'un d'autre ait accès à votre compte, changez votre mot de passe."

newsletter_confirmation:
    subject: "Un clic et les nouveautés puzzle sont à vous 🧩"
    preheader: "Confirmez votre abonnement : les nouveautés de MySpeedPuzzling, au plus une fois par mois."
    title: "Confirmez votre abonnement"
    content: |
        <p>Bonjour ! Quelqu'un — nous espérons que c'est vous — a demandé à recevoir la newsletter MySpeedPuzzling à cette adresse.</p>
        <p>Confirmez ci-dessous et nous vous tiendrons au courant des nouveautés de la plateforme — nouvelles fonctionnalités, améliorations et actualités de la communauté. Pas de marketing, pas de promotions — uniquement les nouveautés, pas plus d'une fois par mois.</p>
    button: "Confirmer mon abonnement"
    expires: "Le lien est valable %hours% heures. Si vous n'êtes pas à l'origine de cette demande, ignorez simplement cet e-mail et rien ne vous sera envoyé."

free_trial_started:
    subject: "Votre essai gratuit de l'adhésion MySpeedPuzzling a commencé"
    preheader: "Tout ce qu’ont les membres est débloqué jusqu’au %trialEndsAt% – sans carte, rien à résilier."
    title: "Votre essai gratuit a commencé !"
    content: |
        <p>Tout ce qu'ont les membres est débloqué pour vous jusqu'au <b>%trialEndsAt%</b>. Sans carte, rien à résilier - il se termine tout seul.</p>
        <p>Par où commencer :</p>
        <ul>
            <li><a href="%profileUrl%">Analyses sur votre profil</a> - votre niveau, la difficulté des puzzles et les prévisions de temps</li>
            <li><a href="%statisticsUrl%">Statistiques et graphiques détaillés</a> - l'évolution de vos temps</li>
            <li><a href="%pickerUrl%">Que faire comme prochain puzzle ?</a> - avec les filtres réservés aux membres</li>
            <li><a href="%collectionsUrl%">Vos propres collections</a> - avec vos temps et prévisions</li>
        </ul>
        <p>Si cela vous plaît, vous pouvez devenir membre à tout moment sur la <a href="%membershipUrl%">page d'adhésion</a> - le reste de votre essai vous reste acquis.</p>
free_trial_ending:
    subject: "Votre essai gratuit de l'adhésion MySpeedPuzzling se termine bientôt"
    preheader: "Vous n’avez rien à faire – il se termine tout seul et rien ne vous sera facturé."
    title: "Votre essai gratuit se termine le %trialEndsAt%"
    content: |
        <p>Votre essai gratuit de l'adhésion se termine le <b>%trialEndsAt%</b>. Vous n'avez rien à faire - il se termine tout seul et rien ne vous sera facturé.</p>
        <p>S'il vous a été utile, vous pouvez devenir membre sur la <a href="%membershipUrl%">page d'adhésion</a>. Abonnez-vous avant la fin de l'essai et les jours restants vous restent acquis - votre premier paiement n'interviendra qu'après.</p>
        <p>Quelle que soit votre décision - merci d'avoir essayé, et bons puzzles !</p>

oauth_identity_linked:
    subject: "La connexion avec %provider% a été associée à votre compte MySpeedPuzzling"
    preheader: "Vous pouvez désormais vous connecter avec %provider%. Ce n’était pas vous ? Voici quoi faire."
    title: "Connexion avec %provider% associée"
    content: |
        <p>Un compte %provider% vient d'être associé à votre compte MySpeedPuzzling <strong>%email%</strong> (%linkedAt%). Vous pouvez désormais l'utiliser pour vous connecter.</p>
        <p>Si c'était vous, vous n'avez rien d'autre à faire.</p>
    not_you_title: "Ce n'était pas vous ?"
    not_you: |
        <p>Dans ce cas, quelqu'un d'autre pourrait se connecter à votre compte. Connectez-vous, ouvrez les paramètres de votre profil et dissociez %provider% dans « Connected sign-in methods », puis, par précaution, <a href="%resetPasswordUrl%">changez votre mot de passe</a>.</p>
    button: "Vérifier mes méthodes de connexion"

result_review:
    subject_first: "Pourriez-vous vérifier quelques-uns de vos résultats ?"
    subject_weekly: "Quelques résultats de plus à vérifier"
    subject_removed: "Nous avons retiré des résultats apparus en double"
    preheader_removed: "Les copies en trop des résultats en double sont retirées – chaque assemblage compte une fois."
    preheader_weekly: "D’autres résultats sont peut-être en double – vérifiez-les vite pour des statistiques justes."
    preheader_first: "Quelques-uns de vos résultats sont peut-être en double – les vérifier ne prend qu’un instant."
    title_first: "Pourriez-vous vérifier quelques-uns de vos résultats ?"
    title_weekly: "Quelques résultats de plus à vérifier"
    title_removed: "Nous avons retiré des résultats apparus en double"
    greeting: "Bonjour %playerName%,"
    intro_first: "Nous voulons que les résultats sur MySpeedPuzzling soient aussi précis que possible, alors nous les avons tous passés en revue et avons trouvé quelques-uns des vôtres en double. Cela peut venir d’un souci technique, par exemple quand un même enregistrement nous parvient deux fois."
    intro_weekly: "Merci d’avoir vérifié vos résultats la dernière fois ! Depuis, nous en avons trouvé quelques autres peut-être en double."
    intro_removed: "Certains de vos résultats apparaissaient en double à cause d’un souci technique, alors nous avons retiré les copies en trop – nous voulons que les résultats sur MySpeedPuzzling soient aussi précis que possible."
    check_heading: "À vérifier – nous n’en étions pas sûrs"
    check_text: "Chacun peut être un même assemblage compté deux fois – il compte alors double dans vos statistiques – ou deux vrais assemblages avec exactement le même temps. Nous préférons vous demander plutôt que de supprimer un vrai assemblage."
    check_action: "Sur la page de vérification, c’est l’affaire d’un instant : gardez une copie, ou dites-nous que les deux sont réels."
    removed_heading: "Déjà corrigé – là, nous en étions sûrs"
