account_deletion:
    subject: "Confirmez la suppression de votre compte MySpeedPuzzling"
    preheader: "Exportez d’abord vos données si vous souhaitez les garder. Le lien est valable %minutes% minutes."
    title: "Désolés de vous voir partir"
    content: |
        <p>Quelqu'un — nous espérons que c'est vous — nous a demandé de supprimer le compte MySpeedPuzzling enregistré à l'adresse <b>%email%</b>.</p>
        <p>Nous sommes désolés de vous voir partir, mais cela arrive. Nous espérons que vous avez apprécié votre temps sur MySpeedPuzzling — et qu'un jour, quand l'envie de suivre vos temps vous reprendra, vous reviendrez. La porte reste ouverte.</p>
    export_hint: |
        <p><b>Avant de partir :</b> pensez à exporter vos données d'abord. Une fois le compte supprimé, vos temps de puzzle ne pourront plus être récupérés — mais avec un export, vous pouvez les emporter et les rapporter si vous revenez un jour.</p>
    export_button: "Exporter mes données"
