footer_tagline: "スピードパズリングコミュニティ"
footer: '<a href="%homepageLink%">MySpeedPuzzling.com</a>の一員でいてくださりありがとうございます。<br>ご質問がございましたら、いつでも<a href="mailto:simona@speedpuzzling.cz">simona@speedpuzzling.cz</a>までお気軽にお問い合わせください。'

membership_cancelled:
    subject: "MySpeedPuzzling.comのメンバーシップ登録がキャンセルされました"
    preheader: "今後の請求はありません。メンバーシップは%membershipExpiresAt%まで有効です。"
    title: "メンバーシップ登録がキャンセルされました！"
    content: |
        <p>お別れは残念ですが、MySpeedPuzzling.comで過ごしていただいた時間に感謝いたします。</p>
        <p>ご心配なく、今後請求されることはありません。ただし、メンバーシップは現在の請求期間の終了まで有効で、<b>%membershipExpiresAt%</b>まで続きます。</p>
        <p>お気が変わりましたら、<a href="%membershipUrl%">メンバーシップページ</a>でいつでもメンバーシップを管理できます。</p>
        <p>私たちはMySpeedPuzzling.comの改善に常に取り組んでおり、フィードバックやアイデアがあればとても嬉しく思います。</p>
        <p>MySpeedPuzzling.comの一員でいてくださりありがとうございました。いつかまたお迎えできることを願っています！ :)</p>

membership_granted:
    subject: "MySpeedPuzzling.comでのメンバーシップおめでとうございます"
    preheader: "コミュニティへのご貢献に感謝して、メンバーシップを有効にしました。"
    title: "メンバーシップがアクティブになりました！"
    content: |
        <p>スピードパズリングコミュニティでのあなたの貢献と努力を認識できて嬉しく思います！</p>
        <p>感謝の気持ちとして、MySpeedPuzzling.comでメンバーシップを付与いたします。メンバーシップは<b>%membershipExpiresAt%</b>まで有効です。</p>
        <p><a href="%membershipUrl%">メンバーシップページ</a>でいつでもメンバーシップを確認・管理できます。</p>
        <p>スピードパズリングコミュニティの貴重な一員でいてくださりありがとうございます。パズルを続けて、他のパズラーにインスピレーションを与えてください！</p>

membership_subscribed:
    subject: "MySpeedPuzzling.comでのメンバーシップおめでとうございます"
    preheader: "メンバーシップが有効になりました。次回請求期間の開始日：%nextBillingPeriod%"
    title: "ご参加いただきありがとうございます！"
    content: |
        <h4>メンバーシップがアクティブになりました。</h4>
        <p>あなたのサポートを深く感謝し、MySpeedPuzzling.comのメンバーとしてお迎えできることを嬉しく思います！</p>
        <p>次回請求期間の開始日: <b>%nextBillingPeriod%</b></p>
        <p><a href="%membershipUrl%">メンバーシップページ</a>で登録管理、メンバーシップキャンセル、請求書ダウンロードがいつでもできます。</p>
        <p>MySpeedPuzzling.comの一員でいてくださり、サポートしてくださりありがとうございます。高速スピードパズリングと素晴らしい結果をお祈りしています！</p>

subscription_payment_failed:
    subject: "MySpeedPuzzling.comのメンバーシップ支払いが失敗しました"
    preheader: "お支払いが完了しませんでした。メンバーシップを続けるには支払い方法をご確認ください。"
    title: "メンバーシップ支払いが失敗しました！"
    content: |
        <p>最近のメンバーシップ支払いが失敗したことを確認いたしました。支払い方法に問題があった可能性があります。</p>
        <p>メンバーシップをアクティブに保ちたい場合は、請求ポータルで支払い方法を確認・更新してください。</p>
        <p>支払いが引き続き失敗する場合、数回の試行後にメンバーシップが無効化されます。MySpeedPuzzling.comに引き続きお付き合いいただけることを願っています！</p>
    button: "支払い方法を更新する"

subscription_renewed:
    subject: "MySpeedPuzzling.comのメンバーシップ支払いが成功しました"
    preheader: "メンバーシップが更新されました。次回請求期間の開始日：%nextBillingPeriod%"
    title: "支払い成功、ありがとうございます！"
    content: |
        <p>引き続きご利用いただき、MySpeedPuzzling.comの一員でいてくださり本当にありがとうございます！</p>
        <p>メンバーシップが正常に更新されたことをお知らせします。次回請求期間の開始日: <b>%nextBillingPeriod%</b></p>
        <p>登録の詳細を更新または確認したい場合は、<a href="%membershipUrl%">メンバーシップページ</a>で行えます。</p>
        <p>私たちはメンバーの皆様のために改善と新機能追加に常に取り組んでいます。改善できることがあればお知らせください。</p>
        <p>再度、サポートしてくださりありがとうございます。高速スピードパズリングと素晴らしい結果をお祈りしています！</p>

unread_messages:
    subject: "MySpeedPuzzlingで誰かからメッセージが届いています"
    preheader: "パズラー仲間からメッセージが届いています。MySpeedPuzzlingでご確認ください。"
    title: "新しいメッセージが届いています"
    greeting: "%playerName%さん、こんにちは"
    intro: "前回の訪問以降、誰かからメッセージが届いています。お待ちしている内容はこちらです："
    message_line: "%senderName%からの新しいメッセージ%count%件"
    message_line_with_puzzle: "%senderName%からの%puzzleName%に関する新しいメッセージ%count%件"
    view_messages: "メッセージを読む"
    pending_requests_also: "%count%件の新しい会話リクエストもあります — 誰かがあなたとつながりたがっています！"
    pending_requests_only: "誰かがあなたに連絡したがっています！承認待ちの新しい会話リクエストが%count%件あります。"
    pending_requests_context: "マーケットプレイスのパズルについて、コレクションへの質問、またはパズラー仲間からの挨拶かもしれません。"
    view_requests: "会話リクエストを確認する"
    opt_out: 'これらのメール通知は<a href="%settingsUrl%">プロフィール設定</a>から管理できます。<a href="%unsubscribeUrl%">新着メッセージのメールを停止する</a>こともできます。'

oauth2_client_request:
    subject: "新しいOAuth2クライアントリクエスト: %clientName%"
    title: "新しいAPIアクセスリクエスト"
    content: |
        <p>新しいOAuth2クライアントアクセスリクエストが送信されました。</p>
        <p><strong>申請者:</strong> %playerName%<br><strong>アプリケーション:</strong> %clientName%</p>
        <p><strong>目的:</strong> %purpose%</p>
    button: "管理画面でこのリクエストを確認する"

oauth2_client_approved:
    subject: "APIアプリケーションが承認されました！"
    preheader: "%clientName%の認証情報を取得してください。リンクの有効期限は7日間です。"
    title: "アプリケーションが承認されました！"
    content: |
        <p>朗報です！OAuth2アプリケーション<strong>%clientName%</strong>が承認されました。</p>
        <p>以下のボタンをクリックして認証情報を取得してください。リンクの有効期限は7日間です。</p>
        <p><strong>重要:</strong> 認証情報は一度しか表示されません。安全な場所に必ず保存してください。</p>
    button: "認証情報を取得する"

oauth2_client_rejected:
    subject: "APIアプリケーションリクエストが承認されませんでした"
    preheader: "%clientName%のリクエストは承認されませんでした。理由はメール本文をご覧ください。"
    title: "アプリケーションが承認されませんでした"
    content: |
        <p>残念ながら、OAuth2アプリケーション<strong>%clientName%</strong>のリクエストは承認されませんでした。</p>
        <p><strong>理由:</strong> %reason%</p>
        <p>ご質問がある場合やさらに詳しく話し合いたい場合は、<a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a>までお問い合わせください。</p>

competition_submitted:
    subject: "新しいイベントが送信されました: %competitionName%"
    title: "新しいイベントの送信"
    content: |
        <p>新しいイベントが承認のために送信されました。</p>
        <p><strong>送信者:</strong> %playerName%<br><strong>イベント:</strong> %competitionName%<br><strong>場所:</strong> %location%</p>
    button: "管理画面で保留中のイベントを確認する"

competition_approved:
    subject: "イベントが承認されました！"
    preheader: "%competitionName%がMySpeedPuzzlingで公開されました。"
    title: "イベントが承認されました！"
    content: |
        <p>素晴らしいニュースです！イベント <strong>%competitionName%</strong> が承認され、MySpeedPuzzlingで公開されました。</p>
        <p><a href="%eventUrl%">イベントページを表示</a></p>

moderator_role_granted:
    subject: "MySpeedPuzzlingのコミュニティモデレーターになりました"
    preheader: "パズルカタログの整理へのご協力に感謝します。進め方をご案内します。"
    title: "モデレーターチームへようこそ！"
    content: |
        <p>%playerName%さん、こんにちは。</p>
        <p>あなたをMySpeedPuzzlingの<strong>コミュニティモデレーター</strong>に任命しました。パズルカタログの整理にご協力いただけるとのこと、ありがとうございます。私たちにとっても、コミュニティ全体にとっても、とてもありがたいことです。</p>
        <p>これからは、他のパズラーからの提案を確認できます：</p>
        <ul>
            <li><a href="%changeRequestsUrl%">パズルの変更リクエスト</a> - 名前、ブランド、ピース数、コード、写真の修正</li>
            <li><a href="%mergeRequestsUrl%">パズルの統合リクエスト</a> - 2つの登録が同じパズルであるという報告</li>
        </ul>
        <p>どちらも、ログイン後に上部バーの鍵アイコンからアクセスできます。</p>
        <p><strong>統合についてのご注意：</strong> 統合を承認すると、重複している登録が削除され、全員のタイムとコレクションが残る方の登録に移されます。元に戻すことはできませんので、ピース数が違う、絵柄が違う、エディションが違うなど、少しでも迷う場合は、そのままにしておくか却下してください。1つのパズルに複数のEANコードがあっても問題ありません。</p>
        <p>ご不明な点がありましたら、ウェブサイト上部のフィードバックリンクからご連絡ください。</p>

competition_rejected:
    subject: "イベントは承認されませんでした"
    preheader: "%competitionName%は承認されませんでした。理由はメール本文をご覧ください。"
    title: "イベント未承認"
    content: |
        <p>残念ながら、イベント <strong>%competitionName%</strong> は承認されませんでした。</p>
        <p><strong>理由:</strong> %reason%</p>
        <p>ご質問がある場合やさらに話し合いたい場合は、<a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a> までご連絡ください。</p>

feature_request_completed:
    subject: "ご提案の機能リクエストがリリースされました: %title%"
    preheader: "ご提案の「%featureRequestTitle%」がMySpeedPuzzlingで公開されました。ありがとうございます！"
    title: "ご提案の機能リクエストが公開されました！"
    content: |
        <p>素晴らしいニュースです！ご提案の機能リクエスト <a href="%featureRequestUrl%" class="link-underline">%featureRequestTitle%</a> がリリースされ、MySpeedPuzzlingで公開されました。</p>
        <p>アイデアをお寄せいただきありがとうございます — 皆様のフィードバックがMySpeedPuzzlingをより良いものにしています！</p>
    admin_comment: |
        <p><strong>チームからのコメント:</strong> %adminComment%</p>
    github_note: |
        <p>私たちは透明性を100%大切にし、オープンに開発を進めています。この変更のコードや技術的な詳細にご興味があれば、<a href="%githubUrl%" class="link-underline">GitHubでご覧いただけます</a>。興味がなければ、どうぞ気にせず無視してください :)</p>
    upvoter:
        subject: "あなたが支持した機能リクエストがリリースされました: %title%"
        preheader: "あなたが支持した「%featureRequestTitle%」がMySpeedPuzzlingで公開されました。"
        title: "あなたが支持した機能が公開されました！"
        content: |
            <p>素晴らしいニュースです！あなたが支持した機能リクエスト <a href="%featureRequestUrl%" class="link-underline">%featureRequestTitle%</a> がリリースされ、MySpeedPuzzlingで公開されました。</p>
            <p>このアイデアを応援してくださりありがとうございます！</p>
        admin_comment: |
            <p><strong>チームからのコメント:</strong> %adminComment%</p>
        github_note: |
            <p>私たちは透明性を100%大切にし、オープンに開発を進めています。この変更のコードや技術的な詳細にご興味があれば、<a href="%githubUrl%" class="link-underline">GitHubでご覧いただけます</a>。興味がなければ、どうぞ気にせず無視してください :)</p>

feature_request_declined:
    subject: "ご提案の機能リクエストは見送られました: %title%"
    preheader: "「%featureRequestTitle%」は見送ることになりました。アイデアをありがとうございました。"
    title: "ご提案の機能リクエストは見送られました"
    content: |
        <p>ご提案の機能リクエスト <a href="%featureRequestUrl%" class="link-underline">%featureRequestTitle%</a> は見送られることとなりました。</p>
        <p>アイデアをお寄せいただくためにお時間を割いてくださり、本当にありがとうございます — 採用に至らない場合でも、皆様のフィードバックはMySpeedPuzzlingの形づくりに役立っています。</p>
    admin_comment: |
        <p><strong>チームからのコメント:</strong> %adminComment%</p>
    upvoter:
        subject: "あなたが支持した機能リクエストは見送られました: %title%"
        preheader: "あなたが支持した「%featureRequestTitle%」は見送りとなりました。応援ありがとうございました。"
        title: "あなたが支持した機能リクエストは見送られました"
        content: |
            <p>あなたが支持した機能リクエスト <a href="%featureRequestUrl%" class="link-underline">%featureRequestTitle%</a> は見送られることとなりました。</p>
            <p>それでも、このアイデアを応援してくださりありがとうございました！皆様のご意見は、コミュニティが何を大切にしているかを理解する助けになっています。</p>
        admin_comment: |
            <p><strong>チームからのコメント:</strong> %adminComment%</p>

sign_in_link:
    subject: "MySpeedPuzzlingのサインインコード: %code%"
    preheader: "%code%を入力するか、ワンタップでサインインしてください。有効期限は%minutes%分です。"
    title: "サインインコード"
    content: |
        <p>コードをリクエストしたMySpeedPuzzlingのページで、このコードを入力してください。</p>
    or_link: "または、ワンタップでサインイン:"
    button: "サインイン"
    expires: "コードとリンクは合わせて1回のみ有効です(先に使った方が有効)。どちらも%minutes%分で期限切れになります。"
    not_requested: "お心当たりがない場合は、このメールは無視していただいて問題ありません。コードまたはリンクがなければ誰もサインインできません。"

verify_email:
    subject: "MySpeedPuzzling.comのメールアドレスを確認してください"
    preheader: "ワンクリックでメールアドレスを確認すれば、準備完了です。"
    title: "メールアドレスを確認してください"
    content: |
        <p>MySpeedPuzzlingへようこそ！10,000人を超えるパズラーの仲間入りです。</p>
        <p>あとはメールアドレスを確認するだけ。タイムを計測し、コミュニティと結果を比べ、自己ベストが更新されていくのをお楽しみください。</p>
    button: "メールアドレスを確認する"
    expires: "リンクの有効期限は%hours%時間です。"
    not_requested: "このアカウントを作成した覚えがない場合は、このメールは無視していただいて問題ありません。"

password_reset:
    subject: "MySpeedPuzzling.comのパスワードをリセット"
    preheader: "メール内のボタンから新しいパスワードを設定できます。リンクは1回のみ、%minutes%分間有効です。"
    title: "新しいパスワードを設定してください"
    content: |
        <p>どなたか — おそらくあなた — が、MySpeedPuzzling.comアカウントのパスワードのリセットをリクエストしました。下のボタンをクリックして、新しいパスワードを設定してください。</p>
    button: "新しいパスワードを設定する"
    expires: "リンクは1回のみ有効で、%minutes%分で期限切れになります。"
    not_requested: "お心当たりがない場合は、このメールは無視していただいて問題ありません。パスワードはそのまま変わりません。"

account_deletion:
    subject: "MySpeedPuzzlingアカウントの削除を確認してください"
    preheader: "データを残したい場合は、先にエクスポートしてください。リンクの有効期限は%minutes%分です。"
    title: "お別れは寂しいですが"
    content: |
        <p>どなたか — おそらくあなた — が、<b>%email%</b> で登録されたMySpeedPuzzlingアカウントの削除をリクエストしました。</p>
        <p>寂しいですが、そういうこともありますよね。MySpeedPuzzlingで過ごした時間を楽しんでいただけていたら嬉しいです。いつかまたタイムを記録したくなったら、ぜひ戻ってきてください。扉はいつでも開いています。</p>
    export_hint: |
        <p><b>退会前に：</b>まずデータをエクスポートしてください。アカウントを削除すると、パズルのタイム記録は復元できません。エクスポートしておけば、いつか戻ってきたときにデータを持ち帰ることができます。</p>
    export_button: "データをエクスポートする"
    confirm_hint: |
        <p>続行するには、下のボタンをクリックしてください。開いたページで最終確認をしていただきます。その後、アカウントとすべてのデータは完全に削除され、元に戻すことはできません。</p>
    button: "アカウントを削除する"
    expires: "リンクの有効期限は%minutes%分です。"
    not_requested: "お心当たりがない場合は、このメールは無視していただいて問題ありません。何も起こらず、アカウントはそのまま残ります。ほかの誰かがアカウントにアクセスしている心配がある場合は、パスワードを変更してください。"

newsletter_confirmation:
    subject: "ワンクリックでパズルの最新情報があなたのものに 🧩"
    preheader: "登録を確認すると、MySpeedPuzzlingの最新情報を多くても月1回お届けします。"
    title: "ニュースレターの登録を確認してください"
    content: |
        <p>こんにちは！どなたか — おそらくあなた — が、このアドレスでのMySpeedPuzzlingニュースレターの受信をリクエストしました。</p>
        <p>下のボタンで確認すると、プラットフォームの最新情報 — 新機能、改善、コミュニティのニュース — をお届けします。マーケティングや宣伝は一切なし。多くても月1回だけです。</p>
    button: "登録を確認する"
    expires: "リンクの有効期限は%hours%時間です。お心当たりがない場合は、このメールは無視していただいて問題ありません。今後何も届きません。"

free_trial_started:
    subject: "MySpeedPuzzlingメンバーシップの無料トライアルが始まりました"
    preheader: "%trialEndsAt%までメンバー向けの全機能をご利用いただけます。カード不要、解約も不要です。"
    title: "無料トライアルが始まりました！"
    content: |
        <p><b>%trialEndsAt%</b>まで、メンバー向けのすべての機能をご利用いただけます。カード不要、解約手続きも不要 - 自動的に終了します。</p>
        <p>まずはここから：</p>
        <ul>
            <li><a href="%profileUrl%">プロフィールのインサイト</a> - スキルレベル、パズルの難易度、タイム予測</li>
            <li><a href="%statisticsUrl%">詳しい統計とグラフ</a> - タイムの推移</li>
            <li><a href="%pickerUrl%">次は何を組む？</a> - メンバー専用フィルター付き</li>
            <li><a href="%collectionsUrl%">自分だけのコレクション</a> - タイムと予測も一緒に</li>
        </ul>
        <p>気に入ったら、<a href="%membershipUrl%">メンバーシップページ</a>からいつでもメンバーになれます。トライアルの残り日数もそのまま引き継がれます。</p>
free_trial_ending:
