    preheader: "あなたの募集はまだ掲載中ですか？パートナー募集を更新しましょう。"
    title: "%name%さんがあなたと組みました"
    greeting: "%name%さん、こんにちは"
    intro: "%name%さんが%event%のパートナー募集を締め切り、組んだ相手としてあなたを指名しました。"
    ask: "あなた自身の募集はまだ掲載中なので、引き続き連絡が来るかもしれません。パートナーが見つかったら締め切り、まだメンバーが必要なら更新してください。"
    update: "自分の募集を更新する"
    not_right: "違う場合は、募集をそのままにしておいてください。あなたが変更しない限り、何も変わりません。"
