    title: "メールアドレスを確認してください"
    content: |
        <p>MySpeedPuzzlingへようこそ！10,000人を超えるパズラーの仲間入りです。</p>
        <p>あとはメールアドレスを確認するだけ。タイムを計測し、コミュニティと結果を比べ、自己ベストが更新されていくのをお楽しみください。</p>
    button: "メールアドレスを確認する"
    expires: "リンクの有効期限は%hours%時間です。"
    not_requested: "このアカウントを作成した覚えがない場合は、このメールは無視していただいて問題ありません。"

password_reset:
    subject: "MySpeedPuzzling.comのパスワードをリセット"
    preheader: "メール内のボタンから新しいパスワードを設定できます。リンクは1回のみ、%minutes%分間有効です。"
    title: "新しいパスワードを設定してください"
    content: |
        <p>どなたか — おそらくあなた — が、MySpeedPuzzling.comアカウントのパスワードのリセットをリクエストしました。下のボタンをクリックして、新しいパスワードを設定してください。</p>
    button: "新しいパスワードを設定する"
    expires: "リンクは1回のみ有効で、%minutes%分で期限切れになります。"
    not_requested: "お心当たりがない場合は、このメールは無視していただいて問題ありません。パスワードはそのまま変わりません。"

account_deletion:
    subject: "MySpeedPuzzlingアカウントの削除を確認してください"
    preheader: "データを残したい場合は、先にエクスポートしてください。リンクの有効期限は%minutes%分です。"
    title: "お別れは寂しいですが"
    content: |
        <p>どなたか — おそらくあなた — が、<b>%email%</b> で登録されたMySpeedPuzzlingアカウントの削除をリクエストしました。</p>
        <p>寂しいですが、そういうこともありますよね。MySpeedPuzzlingで過ごした時間を楽しんでいただけていたら嬉しいです。いつかまたタイムを記録したくなったら、ぜひ戻ってきてください。扉はいつでも開いています。</p>
    export_hint: |
        <p><b>退会前に：</b>まずデータをエクスポートしてください。アカウントを削除すると、パズルのタイム記録は復元できません。エクスポートしておけば、いつか戻ってきたときにデータを持ち帰ることができます。</p>
    export_button: "データをエクスポートする"
    confirm_hint: |
        <p>続行するには、下のボタンをクリックしてください。開いたページで最終確認をしていただきます。その後、アカウントとすべてのデータは完全に削除され、元に戻すことはできません。</p>
    button: "アカウントを削除する"
    expires: "リンクの有効期限は%minutes%分です。"
    not_requested: "お心当たりがない場合は、このメールは無視していただいて問題ありません。何も起こらず、アカウントはそのまま残ります。ほかの誰かがアカウントにアクセスしている心配がある場合は、パスワードを変更してください。"

newsletter_confirmation:
    subject: "ワンクリックでパズルの最新情報があなたのものに 🧩"
    preheader: "登録を確認すると、MySpeedPuzzlingの最新情報を多くても月1回お届けします。"
    title: "ニュースレターの登録を確認してください"
    content: |
        <p>こんにちは！どなたか — おそらくあなた — が、このアドレスでのMySpeedPuzzlingニュースレターの受信をリクエストしました。</p>
        <p>下のボタンで確認すると、プラットフォームの最新情報 — 新機能、改善、コミュニティのニュース — をお届けします。マーケティングや宣伝は一切なし。多くても月1回だけです。</p>
    button: "登録を確認する"
    expires: "リンクの有効期限は%hours%時間です。お心当たりがない場合は、このメールは無視していただいて問題ありません。今後何も届きません。"

free_trial_started:
    subject: "MySpeedPuzzlingメンバーシップの無料トライアルが始まりました"
    preheader: "%trialEndsAt%までメンバー向けの全機能をご利用いただけます。カード不要、解約も不要です。"
    title: "無料トライアルが始まりました！"
    content: |
        <p><b>%trialEndsAt%</b>まで、メンバー向けのすべての機能をご利用いただけます。カード不要、解約手続きも不要 - 自動的に終了します。</p>
        <p>まずはここから：</p>
        <ul>
            <li><a href="%profileUrl%">プロフィールのインサイト</a> - スキルレベル、パズルの難易度、タイム予測</li>
            <li><a href="%statisticsUrl%">詳しい統計とグラフ</a> - タイムの推移</li>
            <li><a href="%pickerUrl%">次は何を組む？</a> - メンバー専用フィルター付き</li>
            <li><a href="%collectionsUrl%">自分だけのコレクション</a> - タイムと予測も一緒に</li>
        </ul>
        <p>気に入ったら、<a href="%membershipUrl%">メンバーシップページ</a>からいつでもメンバーになれます。トライアルの残り日数もそのまま引き継がれます。</p>
free_trial_ending:
    subject: "MySpeedPuzzlingメンバーシップの無料トライアルがまもなく終了します"
    preheader: "お手続きは不要です。自動的に終了し、料金は一切かかりません。"
    title: "無料トライアルは%trialEndsAt%に終了します"
    content: |
        <p>メンバーシップの無料トライアルは<b>%trialEndsAt%</b>に終了します。お手続きは不要です - 自動的に終了し、料金は一切かかりません。</p>
        <p>お役に立ったなら、<a href="%membershipUrl%">メンバーシップページ</a>からメンバーになれます。トライアル終了前に登録すれば残り日数はそのまま引き継がれ、初回のお支払いはその後になります。</p>
        <p>どちらを選ばれても - お試しいただきありがとうございました。楽しいパズルライフを！</p>

oauth_identity_linked:
    subject: "MySpeedPuzzlingアカウントに%provider%でのログインが連携されました"
    preheader: "今後は%provider%でログインできます。心当たりがない場合の対処法もご案内します。"
    title: "%provider%でのログインを連携しました"
    content: |
        <p>MySpeedPuzzlingアカウント <strong>%email%</strong> に%provider%アカウントが連携されました（%linkedAt%）。今後はこちらでもログインできます。</p>
        <p>ご自身で操作された場合は、これ以上の対応は必要ありません。</p>
    not_you_title: "心当たりがない場合"
    not_you: |
        <p>第三者があなたのアカウントにログインできる状態になっている可能性があります。ログインしてプロフィール設定を開き、「Connected sign-in methods」から%provider%の連携を解除してください。念のため<a href="%resetPasswordUrl%">パスワードも変更</a>することをおすすめします。</p>
