moderator_role_granted:
    subject: "MySpeedPuzzlingのコミュニティモデレーターになりました"
    preheader: "パズルカタログの整理へのご協力に感謝します。進め方をご案内します。"
    title: "モデレーターチームへようこそ！"
    content: |
        <p>%playerName%さん、こんにちは。</p>
        <p>招待を承諾していただきありがとうございます。あなたはMySpeedPuzzlingの<strong>コミュニティモデレーター</strong>になりました。パズルカタログの整理にご協力いただけるとのこと、ありがとうございます。私たちにとっても、コミュニティ全体にとっても、とてもありがたいことです。</p>
        <p>これからは、他のパズラーからの提案を確認できます：</p>
        <ul>
            <li><a href="%changeRequestsUrl%">パズルの変更リクエスト</a> - 名前、ブランド、ピース数、コード、写真の修正</li>
            <li><a href="%mergeRequestsUrl%">パズルの統合リクエスト</a> - 2つの登録が同じパズルであるという報告</li>
        </ul>
        <p>どちらも、ログイン後に上部バーの鍵アイコンからアクセスできます。</p>
        <p><strong>統合についてのご注意：</strong> 統合を承認すると、重複している登録が削除され、全員のタイムとコレクションが残る方の登録に移されます。元に戻すことはできませんので、ピース数が違う、絵柄が違う、エディションが違うなど、少しでも迷う場合は、そのままにしておくか却下してください。1つのパズルに複数のEANコードがあっても問題ありません。</p>
        <p>ご不明な点がありましたら、ウェブサイト上部のフィードバックリンクからご連絡ください。</p>
    guide: "<p><a href=\"%guideUrl%\">モデレーターガイド</a>にはいつでも戻れます。鍵アイコンのメニューにもあります。</p>"

moderator_invitation:
    subject: "MySpeedPuzzlingのコミュニティモデレーターへのご招待"
    preheader: "パズルカタログを一緒に整えていただけませんか。その内容をご案内します。"
    title: "モデレーターになりませんか？"
    content: |
        <p>%playerName%さん、こんにちは。</p>
        <p>MySpeedPuzzlingの<strong>コミュニティモデレーター</strong>にご招待したいと思います。モデレーターはみんなのためにパズルカタログを整えます。他のパズラーが送った修正や新しいパズルを確認し、重複を見つけ、ランキングが公平であるよう手助けします。</p>
        <p>決める前に、モデレーターガイドをお読みください。モデレーションの仕組み、お願いしたいこと、どこに何があるかを説明しています。最後に招待を承諾できます。私たちのモットーは<strong>「見つけたときより良くして残そう」</strong>です。</p>
        <p>ガイドはモデレーション用のページと同じく英語です。</p>
    invited_by: "招待者：%name%"
    button: "ガイドを読んで決める"
    no_pressure: "モデレーターは任意の活動で、いつでもやめられます。今は難しい場合は、ガイドの最後で招待を辞退できます。"

