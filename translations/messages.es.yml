"for_developers":
  "meta":
    "title": "Para desarrolladores / API | MySpeedPuzzling"
    "description": "Crea integraciones con MySpeedPuzzling usando nuestra API OAuth2."
  "heading": "Para desarrolladores"
  "subtitle": "Crea integraciones con la plataforma MySpeedPuzzling. Accede a resultados de jugadores, estadísticas, colecciones y más a través de nuestra REST API."
  "card_api_docs_title": "Documentación API"
  "card_api_docs_description": "Interfaz Swagger UI interactiva con todos los endpoints disponibles, parámetros de solicitud y esquemas de respuesta."
  "card_api_docs_button": "Abrir documentación API"
  "card_demo_title": "Demo en vivo"
  "card_demo_description": "Mira una integración OAuth2 funcionando en acción. Autentícate, obtén datos y explora el flujo."
  "card_demo_button": "Probar el demo"
  "card_source_title": "Código fuente"
  "card_source_description": "Aplicación demo PHP completa que muestra el flujo OAuth2 authorization code. Clónala y empieza a construir."
  "card_source_button": "Ver en GitHub"
  "auth_title": "Autenticación"
  "auth_subtitle": "Dos formas de autenticarse con la API, según tu caso de uso."
  "auth_pat_title": "Personal Access Token"
  "auth_pat_description": "Genera un token para acceder a <strong>tus propios datos</strong> programáticamente. Ideal para Home Assistant, scripts personales y automatizaciones."
  "auth_code_title": "OAuth2 — Autenticación de usuario"
  "auth_code_description": "Flujo authorization code para aplicaciones de terceros. Los usuarios autorizan a tu app a acceder a sus datos con scopes detallados. Soporta operaciones de lectura y escritura."
  "auth_client_title": "OAuth2 — Servicio"
  "auth_client_description": "Flujo client credentials para comunicación entre servicios. Acceso de solo lectura a los datos de cualquier jugador público sin interacción del usuario."
  "how_to_auth_title": "Cómo autenticarse"
  "what_is_good_for": "¿Para qué sirve?"
  "pat_good_for": "Cuando quieres acceder solo a tus propios datos. Perfecto para automatizaciones personales — importa tus resultados en Home Assistant, muestra tus estadísticas en un dashboard personal, registra tu progreso en una hoja de cálculo o crea un script de notificaciones personalizado."
  "pat_how_to": "Genera un token desde tu <strong>Configuración de perfil</strong> y úsalo en la cabecera <code>Authorization</code>:"
  "pat_note": "PAT te da acceso completo a todos los endpoints <code>/api/v1/me/*</code>. No se necesitan scopes. No se puede acceder a datos de otros jugadores."
  "auth_code_flow_title": "OAuth2 Authorization Code Flow"
  "auth_code_good_for": "Cuando estás creando una app donde los usuarios inician sesión con su cuenta de MySpeedPuzzling. Tu app puede acceder a sus datos en su nombre — mostrar sus resultados en tu sitio web, permitirles añadir tiempos de resolución a través de tu herramienta de competición o gestionar sus colecciones desde una interfaz personalizada."
  "auth_code_step1": "<strong>Paso 1:</strong> Redirige al usuario para que autorice tu app:"
  "auth_code_step2": "<strong>Paso 2:</strong> Intercambia el código de autorización por tokens:"
  "auth_code_step3": "<strong>Paso 3:</strong> Usa el access token:"
  "auth_code_step4": "<strong>Paso 4:</strong> Cuando el access token expire, usa el refresh token para obtener uno nuevo:"
  "auth_code_note": "El access token expira en 1 hora. Los refresh tokens son válidos durante 1 mes."
  "client_cred_flow_title": "OAuth2 Client Credentials Flow"
  "client_cred_good_for": "Cuando necesitas datos estadísticos o quieres acceder a los resultados públicos de cualquier jugador sin interacción del usuario. Ideal para construir widgets de clasificación, pantallas de resultados de competiciones, dashboards de estadísticas comunitarias o herramientas de análisis de datos."
  "client_cred_step1": "<strong>Paso 1:</strong> Solicita un access token directamente:"
  "client_cred_step2": "<strong>Paso 2:</strong> Usa el access token para leer datos de cualquier jugador público:"
  "client_cred_note": "Acceso de solo lectura. Los endpoints <code>/me</code> no están disponibles. Los jugadores ocultos/privados devuelven resultados vacíos."
  "scopes_title": "Scopes disponibles"
  "scope_default": "predeterminado"
  "scope_auth_code_only": "solo auth code"
  "endpoints_title": "Endpoints disponibles"
  "endpoints_subtitle": "Los endpoints que puedes usar dependen de tu método de autenticación."
  "table_endpoint": "Endpoint"
  "table_section_me": "Tus propios datos (/me)"
  "table_section_players": "Datos públicos de otros jugadores"
  "table_section_puzzles": "Catálogo de puzzles"
  "table_section_library": "Biblioteca de puzzles (collections:read)"
  "summary_pat": "<i class=\"bi bi-key me-1 text-primary\"></i><strong>PAT</strong> — solo tus datos. No se necesitan scopes, acceso completo a todos los endpoints <code>/me</code>."
  "summary_auth_code": "<i class=\"bi bi-person-badge me-1 text-primary\"></i><strong>Auth Code</strong> — todos los endpoints. El acceso depende de los scopes otorgados. Scopes de escritura disponibles."
  "summary_client_cred": "<i class=\"bi bi-hdd-network me-1 text-primary\"></i><strong>Client Credentials</strong> — acceso de solo lectura a cualquier jugador público. Sin endpoints <code>/me</code>."
  "fup_title": "Política de uso justo"
  "fup_description": "Antes de generar tokens o solicitar acceso a la API, por favor lee y acepta nuestra <a href=\"%link%\">Política de uso justo de la API</a>."
  "get_started_title": "Empezar"
  "get_started_personal_title": "Uso personal"
  "get_started_personal_description": "¿Quieres acceder a tus propios datos? Genera un Personal Access Token al instante desde la configuración de tu perfil. No se necesita aprobación."
  "get_started_personal_button": "Ir a configuración"
  "get_started_app_title": "Aplicación de terceros"
