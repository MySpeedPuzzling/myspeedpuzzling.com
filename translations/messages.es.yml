  "seo_sections":
    "what_is":
      "title": "¿Qué es el speed puzzling?"
      "text": "El speed puzzling es el deporte de armar puzzles contrarreloj — en solitario, en parejas o en equipos. Lo que empezó como un pasatiempo tranquilo se ha convertido en una escena competitiva mundial con sus propios campeonatos y una comunidad muy acogedora. ¿Eres nuevo en esto? Lee nuestra <a href=\"%guide_link%\">guía completa de speed puzzling</a> (en inglés) para descubrir cómo funciona y cómo empezar."
    "track":
      "title": "Registra tus tiempos de puzzle"
      "text": "MySpeedPuzzling es una <a href=\"%tracker_link%\">aplicación puzzle tracker</a> gratuita para todo amante de los puzzles. Cronometra tus armados con el <a href=\"%stopwatch_link%\">cronómetro</a> integrado, registra tus puzzles terminados con fotos y mantén toda tu colección organizada en un solo lugar. Cada tiempo registrado alimenta tus estadísticas personales, así verás cómo mejoras puzzle a puzzle."
    "leaderboards":
      "title": "Compite en rankings mundiales"
      "text": "Descubre cómo se comparan tus tiempos con los de speed puzzleros de todo el mundo. El <a href=\"%ladder_link%\">ranking mundial</a> ordena los tiempos más rápidos por número de piezas en solitario, parejas y equipos, mientras que el <a href=\"%rating_link%\">ranking MSP Rating</a> mide tu nivel general. Tanto si persigues récords como si solo tienes curiosidad, hay un ranking para ti."
    "competitions":
      "title": "Campeonatos y concursos de speed puzzling"
      "text": "Desde encuentros locales hasta el World Jigsaw Puzzle Championship, los campeonatos de puzzles contrarreloj se celebran en todo el mundo — presenciales y en línea. Explora el <a href=\"%events_link%\">calendario de eventos</a> para encontrar próximos campeonatos y concursos cerca de ti, seguir los resultados y conocer a puzzleros que disfrutan armar contrarreloj tanto como tú."
    "database":
      "title": "Explora la base de datos de puzzles"
      "text": "Explora miles de puzzles con tiempos reales registrados por la comunidad. Compara los tiempos medianos y más rápidos de puzzles de <a href=\"%ravensburger_link%\">Ravensburger</a>, <a href=\"%schmidt_link%\">Schmidt</a> o <a href=\"%trefl_link%\">Trefl</a>, comprueba la dificultad real de un puzzle antes de comprarlo y elige tu próximo desafío en la <a href=\"%puzzles_link%\">base de datos de puzzles</a> completa."
