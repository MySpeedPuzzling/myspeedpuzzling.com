"for_organizers":
  "meta":
    "title": "Para organizadores — Organiza tu competición de puzzles"
    "description": "Todo lo que necesitas para gestionar competiciones de puzzles: configuración de eventos, rondas, cronómetro en vivo, gestión de participantes, distribución de mesas y más. Gratis y sin publicidad."
  "hero":
    "title": "Organiza tu competición de puzzles con confianza"
    "lead": "MySpeedPuzzling te da todo lo que necesitas para organizar eventos de puzzles — desde la preparación hasta la línea de meta. Creado por puzzlers, para la comunidad."
    "cta_start": "Crear un evento"
    "cta_browse": "Explorar eventos"
    "trust_free": "Gratis para siempre"
    "trust_no_ads": "Sin anuncios, sin tarifas"
  "benefits":
    "title": "Por qué los organizadores eligen MySpeedPuzzling"
    "community":
      "title": "Tu audiencia ya está aquí"
      "description": "Miles de puzzlers ya usan MySpeedPuzzling para registrar sus tiempos, colecciones y estadísticas. Tu evento obtiene visibilidad instantánea en la comunidad."
    "reliability":
      "title": "Diseñado para la fiabilidad"
      "description": "Infraestructura moderna diseñada para manejar picos de tráfico durante eventos en vivo. Funciones en tiempo real con server-sent events — sin necesidad de recargar la página."
    "free":
      "title": "Completamente gratis y sin publicidad"
      "description": "Todas las herramientas de gestión de competiciones son completamente gratuitas — sin muros de pago, sin anuncios, sin tarifas ocultas. Organizar eventos en MySpeedPuzzling siempre será gratis."
  "features":
    "title": "Todo lo que necesitas para un gran evento"
    "subtitle": "Un conjunto de herramientas completo diseñado específicamente para organizadores de competiciones de puzzles."
    "create_event":
      "title": "Crea tu evento"
      "description": "Configura competiciones con todos los detalles — nombre, ubicación, fechas, logo y enlaces. Compatible con eventos online y presenciales."
    "rounds":
      "title": "Gestiona rondas"
      "description": "Configura múltiples rondas con límites de tiempo, horas de inicio e insignias de colores. Perfecto para torneos de varias rondas."
    "puzzles":
      "title": "Asigna puzzles"
      "description": "Añade puzzles a las rondas desde una base de datos de miles. Ocúltalos hasta que comience la ronda para una sorpresa justa."
    "stopwatch":
      "title": "Cronómetro en vivo"
      "description": "Cuenta regresiva en tiempo real sincronizada en todos los navegadores. Proyéctalo en una pantalla grande — los participantes siguen desde sus teléfonos."
    "participants":
      "title": "Gestiona participantes"
      "description": "Los participantes pueden unirse solos, o puedes añadirlos manualmente o importarlos desde Excel. El emparejamiento inteligente los vincula con sus perfiles."
    "tables":
      "title": "Planifica la distribución de mesas"
      "description": "Disposición visual de asientos para eventos presenciales. Asigna lugares a los participantes y luego imprime la distribución."
  "how_it_works":
    "title": "Listo en minutos"
    "step1":
      "title": "Crea"
      "description": "Envía tu evento con todos los detalles. Se publica después de una rápida revisión por nuestro equipo."
    "step2":
      "title": "Configura"
      "description": "Añade rondas, asigna puzzles e importa tu lista de participantes. Comparte el enlace del evento con tu comunidad."
    "step3":
      "title": "Ejecútalo"
      "description": "Inicia el cronómetro en vivo, gestiona resultados en tiempo real. Participantes y espectadores ven todo mientras sucede."
  "more_features":
    "title": "Y hay más"
    "series":
      "title": "Series recurrentes"
      "description": "¿Organizas eventos semanales o mensuales? Agrupa ediciones en una serie. Cada una conserva sus propios participantes y resultados."
    "co_maintainers":
      "title": "Co-organizadores"
      "description": "Comparte el acceso de gestión con tu equipo. Varios organizadores pueden editar el mismo evento simultáneamente."
    "excel":
      "title": "Importación y exportación Excel"
      "description": "Gestiona participantes masivamente con hojas de cálculo. Importa desde tu sistema de registro, exporta para tus archivos."
    "responsive":
      "title": "Funciona en cualquier dispositivo"
      "description": "Totalmente responsivo — funciona genial en teléfonos, tablets y escritorios. No requiere descarga de aplicación."
  "cta":
    "title": "¿Necesitas algo extra?"
    "description": "Escríbenos a <a href=\"mailto:%email%\">%email%</a> y ¡hagamos tu evento extraordinario!"
    "button": "Crea tu primer evento"
    "note": "Gratis. Sin tarifas de cuenta. Sin publicidad."
"faq":
  "meta":
    "title": "Speed Puzzling FAQ – Registra y compite"
    "description": "FAQ speed puzzling sobre cómo registrar tiempos puzzle, competir con otros y mejorar habilidades. ¡Empieza hoy!"
  "title": "Preguntas frecuentes"
  "intro_block": "<p>¡Tus comentarios son muy importantes para nosotros y los apreciamos mucho! Si tienes algo que te gustaría decirnos, por favor escríbenos a <a href=\"mailto:simona@speedpuzzling.cz\">simona@speedpuzzling.cz</a> (o a <a href=\"mailto:jan@myspeedpuzzling.com\">jan@myspeedpuzzling.com</a> para asuntos técnicos: el inicio de sesión, tu cuenta o tus datos) o en <a href=\"https://www.instagram.com/myspeedpuzzling/\" target=\"_blank\">Instagram</a>.</p>\n<p>Todos nuestros códigos fuente son de código abierto y públicos en <a href=\"https://github.com/MySpeedPuzzling\">GitHub SpeedPuzzling</a>. Nos adherimos a la filosofía de \"compartir es cuidar\" y nos esforzamos por compartir todo sobre myspeedpuzzling.com abiertamente.</p>\n"
  "question_fair_play": "¿Cómo sabes que no estoy haciendo trampa al ingresar tiempos?"
  "answer_fair_play": "<p>Honestamente - probablemente no lo sabremos. En la tabla de clasificación pública, donde los puzzleros ingresan tiempos ellos mismos, confiamos en la honestidad e integridad de cada puzzlero individual. ¿Realmente disfrutarías un resultado ingresado deshonestamente?</p>\n<p>Asumimos que, como nosotros, otros puzzleros arman principalmente por el placer de hacerlo, y los tiempos de este tipo de armado son indicativos para una idea aproximada de cómo nos comparamos con otros y cómo nos mediremos durante alguna competencia. Dime, ¿no se vería sospechoso si tuviera un tiempo de 20 minutos en la plataforma pero tomé 3 horas durante una competencia?</p>\n<p>En el futuro, también planeamos ligas clasificadas, donde la verificación de tiempo podría ser requerida, por ejemplo, a través de grabación de video.</p>\n<p class=\"text-danger mb-0\"><small>Dado que nuestra comunidad incluye finalistas\
    \ del Campeonato Mundial de Rompecabezas, que han quedado en la cima, podemos tomar sus tiempos como referencia. Los tiempos sospechosos serán monitoreados y si se prueba fraude, serán despiadadamente eliminados. En caso de trampas repetidas, el acceso del jugador a la plataforma será restringido.</small></p>\n"
  "question_qr": "Recibí rompecabezas con un código QR y el logo de myspeedpuzzling.com, ¿qué debo hacer?"
  "answer_qr": "<p>Para hacer el armado y la entrada de tiempos lo más placentera posible para ti, añadimos un código QR a todos los rompecabezas que pasan por nuestras manos - escanearlo te lleva a la página con los rompecabezas dados, donde puedes comenzar directamente a cronometrar o ingresar tu tiempo.</p>\n<p class=\"mb-0\">Si te gustaría ayudar a difundir la palabra sobre speedpuzzling y añadir un folleto con un código QR a tus rompecabezas, por favor escríbenos - te enviaremos un PDF que puedes imprimir, o podemos enviarte por correo folletos impresos directamente.</p>\n"
  "question_add_time_for_missing_puzzle": "¿Puedo añadir tiempo para rompecabezas que no están en la plataforma?"
  "answer_add_time_for_missing_puzzle": "<p>¡Definitivamente! Si has armado un rompecabezas que aún no está en nuestra plataforma, al añadir tiempo, cambia a la opción:</p>\n<div class=\"form-check form-switch mb-3\">\n    <input type=\"checkbox\" class=\"form-check-input\" id=\"switch-add-puzzle\">\n    <label class=\"form-check-label\" for=\"switch-add-puzzle\">Ingresar rompecabezas manualmente - fabricante desconocido o no en la lista</label>\n</div>\n<p class=\"mb-0\">Entonces tienes la opción de seleccionar de una lista de fabricantes. Si el fabricante tampoco está en la base de datos, puedes ingresarlo tú mismo.</p>\n"
  "question_edit_or_delete_time": "¿Cómo edito o elimino un tiempo ingresado?"
  "answer_edit_or_delete_time": "<p>En la sección <a href=\"%link%\">Mi Perfil</a>, junto a cada tiempo ingresado, encontrarás un enlace para editar (el enlace parece un icono de lápiz <span class=\"btn btn-sm btn-outline-dark px-2 py-1 border-0\"><i class=\"ci-edit\"></i></span>).</p>\n<p>En la página de edición, en la parte inferior, hay un <a class=\"btn btn-sm btn-outline-danger mx-2\">botón mágico</a> que de una vez por todas elimina el registro de toda la internet.</p>\n<p class=\"mb-0 mt-3\">Los tiempos en pareja y en equipo pueden ser editados por todos los puzzleros registrados del grupo, no solo por quien los ingresó. Eliminarlos sigue correspondiendo al puzzlero que ingresó el tiempo.</p>\n"
  "question_physical_puzzles": "¿Se arma el rompecabezas en línea en la web?"
  "answer_physical_puzzles": "<p>No, MySpeedPuzzling no es un juego en línea. Armas tus propios rompecabezas reales en casa (o donde quieras) y aquí solo registras cuánto tiempo te llevó.</p>\n<p>Puedes medir el tiempo con nuestro cronómetro directamente en la web, o con tu propio cronómetro e ingresar el tiempo manualmente después, incluso para rompecabezas que armaste en el pasado.</p>\n<p class=\"mb-0\">El cronómetro y el registro de tiempos son gratuitos, solo necesitas iniciar sesión. No hace falta ser miembro: la membresía solo desbloquea funciones extra, como estadísticas detalladas.</p>\n"
  "question_button_start_solving": "¿Qué hace el botón <a class=\"btn btn-accent btn-sm mx-2\"><i class=\"ci-time\"></i> Comenzar a Resolver</a>?"
  "answer_button_start_solving": "<p class=\"mb-0\">Abre el cronómetro para los rompecabezas seleccionados. Inícialo cuando empieces a armar tu rompecabezas real en casa y, al terminar, guarda el tiempo en tu perfil. El rompecabezas no se arma en la web.</p>\n"
  "question_button_add_my_time": "¿Qué hace el botón <a class=\"btn btn-accent btn-sm mx-2\"><i class=\"ci-add\"></i> Añadir Mi Tiempo</a>?"
  "answer_button_add_my_time": "<p class=\"mb-0\">Abre añadir tu tiempo a rompecabezas seleccionados - adecuado si usas tu propio cronómetro y acabas de terminar de armar. Si armaste en el pasado y quieres registrar el tiempo, tienes la opción de especificar también la fecha en que armaste.</p>\n"
  "question_helping": "¿Quieres una mano ayudante?"
  "answer_helping": "<p class=\"mb-0\">¡Claro! Conéctate con nosotros, idealmente con una idea de cómo te gustaría involucrarte en construir la comunidad speed puzzling, pondremos nuestras cabezas juntas y seguramente se nos ocurrirá algo.</p>\n"
  "question_what_is_speed_puzzling": "¿Qué es el speed puzzling?"
  "answer_what_is_speed_puzzling": "<p class=\"mb-0\">El speed puzzling es el deporte de armar puzzles lo más rápido posible — en solitario, en parejas o en equipos. Los puzzleros compiten contrarreloj, registran sus tiempos y participan en eventos presenciales y en línea por todo el mundo. ¿Quieres saber más? Lee nuestra <a href=\"%guide_link%\">guía completa de speed puzzling</a> (en inglés) — cubre los formatos, los tiempos típicos y cómo empezar.</p>\n"
  "question_how_long_1000_pieces": "¿Cuánto se tarda en armar un puzzle de 1000 piezas?"
  "answer_how_long_1000_pieces": "<p class=\"mb-0\">Según las resoluciones en solitario registradas en MySpeedPuzzling, el tiempo mediano para un puzzle de 1000 piezas es de alrededor de %median_1000%. Los speed puzzleros terminan habitualmente en menos de %fast_1000%, y los más rápidos muy por debajo. Consulta las <a href=\"%times_guide_link%\">estadísticas completas por número de piezas</a> (en inglés) para medianas, percentiles y récords.</p>\n"
  "question_how_competitions_work": "¿Cómo funcionan los campeonatos de speed puzzling?"
  "answer_how_competitions_work": "<p class=\"mb-0\">En la mayoría de los campeonatos y concursos, todos los participantes arman el mismo puzzle al mismo tiempo — gana quien termina primero o a quien le quedan menos piezas cuando se acaba el tiempo. Hay categorías individual, parejas y equipos, desde encuentros locales hasta el World Jigsaw Puzzle Championship, además de concursos en línea. Explora nuestro <a href=\"%events_link%\">calendario de eventos</a> para encontrar un campeonato cerca de ti.</p>\n"
  "question_duplicate_accounts": "He creado sin querer una segunda cuenta (por ejemplo, al iniciar sesión con Google, Microsoft, Apple o Facebook). ¿Qué hago?"
  "answer_duplicate_accounts": |
    <p>Puede ocurrir si inicias sesión con Google, Microsoft, Apple o Facebook usando una dirección de correo distinta de la de tu cuenta de MySpeedPuzzling (por ejemplo, una dirección de «Ocultar mi correo electrónico» de Apple). En ese caso no tenemos forma de saber que eres tú, así que se crea una cuenta nueva e independiente.</p>
    <p><strong>Cómo evitarlo:</strong> inicia sesión primero en tu cuenta existente (con tu correo y contraseña o con un enlace de inicio de sesión), abre <a href="%edit_profile_link%">Editar perfil</a> y conecta el proveedor en <strong>Métodos de inicio de sesión conectados</strong>. A partir de entonces, al iniciar sesión con Google, Microsoft, Apple o Facebook entrarás directamente en tu cuenta, aunque el proveedor use otra dirección de correo.</p>
    <p class="mb-0"><strong>Si ya ha ocurrido:</strong> tranquilo, no se pierde nada. Escríbenos a <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a> indicando las direcciones de correo (o los códigos de jugador) de ambas cuentas y cuál quieres conservar. Un administrador fusionará las cuentas manualmente.</p>
  "question_instagram_sign_in": "¿Puedo iniciar sesión con Instagram?"
  "answer_instagram_sign_in": |
    <p>No directamente, pero si tu cuenta de Instagram está vinculada a una cuenta de Facebook en el Centro de cuentas de Meta, basta con elegir <strong>Continuar con Facebook</strong> e iniciar sesión con esa cuenta de Facebook.</p>
    <p class="mb-0">¿No tienes cuenta de Facebook? Inicia sesión con Google, con Microsoft, con Apple o con tu dirección de correo electrónico.</p>
  "question_shared_computer": "He iniciado sesión en un ordenador compartido o público. ¿Qué hago?"
  "answer_shared_computer": "<p class=\"mb-0\">Cierra la sesión cuando termines: abre el menú de tu perfil y elige <strong>Cerrar sesión</strong>. Si no, seguirás con la sesión iniciada en ese ordenador durante 30 días.</p>"
