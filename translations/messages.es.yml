"wjpc_hub":
  "meta":
    "title": "Campeonato Mundial de Puzzles (WJPC)"
    "description": "Campeonato Mundial de Puzzles (WJPC): fechas, resultados, puzzles e historia de todas las ediciones desde 2019, y cómo participar en Valladolid, España."
  "intro": "El Campeonato Mundial de Puzzles (World Jigsaw Puzzle Championship, WJPC) es el mayor evento del puzzle de velocidad: cada año, puzzlers de todo el mundo compiten por montar puzzles idénticos en el menor tiempo posible. Esta página reúne todas las ediciones del WJPC con sus fechas, sedes y resultados, y explica cómo participar."
  "what_is":
    "heading": "¿Qué es el Campeonato Mundial de Puzzles?"
    "p1": "El WJPC está organizado por la World Jigsaw Puzzle Federation y se celebra en Valladolid, España, desde su primera edición en 2019. El concepto es sencillo y justo: todos los participantes de una ronda reciben el mismo puzzle, que se mantiene en secreto hasta la señal de salida. Gana quien termina más rápido, y quienes no acaban dentro del límite de tiempo se clasifican según el número de piezas colocadas correctamente."
    "p2": "El campeonato tiene tres categorías. En individual se montan puzzles de 500 piezas en las rondas clasificatorias y en la final. Las parejas montan 500 piezas hasta la semifinal y 1.000 piezas en la final. Los equipos de cuatro se enfrentan a puzzles de 1.000 piezas en todas las rondas. Entre todas las categorías participan miles de puzzlers de decenas de países durante varios días de competición."
    "p3": "El primer Campeonato Mundial de Puzzles se celebró en 2019. Tras la cancelación de las ediciones de 2020 y 2021 por la pandemia de COVID-19, el campeonato regresó en 2022 y no ha dejado de crecer desde entonces: hoy es la cita cumbre del calendario del puzzle de velocidad y la referencia de todo puzzler competitivo."
  "editions":
    "heading": "Ediciones del WJPC: fechas y resultados"
    "intro": "Todas las ediciones del Campeonato Mundial de Puzzles, de la más reciente a la más antigua. Cada enlace lleva a la página del evento en MySpeedPuzzling con los participantes, los puzzles y los resultados de ese año."
    "year": "Año"
    "location": "Lugar"
    "dates": "Fechas"
    "event_link": "Evento y resultados"
    "empty": "Las páginas de los eventos del WJPC están en preparación. Mientras tanto, puedes explorar todas las competiciones en nuestro <a href=\"%events_link%\">calendario de eventos</a>."
  "puzzles":
    "heading": "Todos los puzzles del Campeonato Mundial de Puzzles"
    "intro": "Todos los puzzles que se han montado en el Campeonato Mundial de Puzzles, edición a edición y empezando por la más reciente, con la mediana y el tiempo individual más rápido que los puzzleros han registrado en MySpeedPuzzling. Abre un puzzle para ver su clasificación completa."
    "edition_heading": "Puzzles del %edition%"
    "fastest_pair": "Pareja más rápida:"
    "fastest_team": "Equipo más rápido:"
    "no_times": "Aún sin tiempos"
  "participate":
    "heading": "Cómo participar en el WJPC"
    "p1": "Cualquier persona a partir de 14 años puede inscribirse: no hay requisitos de clasificación ni nivel mínimo, así que los principiantes compiten en las mismas mesas que los campeones del mundo. Las inscripciones se abren en la web oficial de la World Jigsaw Puzzle Federation, <a href=\"%official_link%\" target=\"_blank\" rel=\"noopener\">worldjigsawpuzzle.org</a>, normalmente varios meses antes del campeonato, y la cuota incluye los puzzles de competición. Las plazas por categoría son limitadas, por lo que conviene inscribirse pronto."
    "p2": "El WJPC es un evento presencial: no existe participación online. Si todavía no entra en tus planes viajar a España, los campeonatos nacionales y las competiciones locales de todo el mundo usan el mismo formato y son un punto de partida ideal: encuéntralos en nuestro <a href=\"%events_link%\">calendario de eventos</a>."
  "msp":
    "heading": "El WJPC en MySpeedPuzzling"
    "p1": "MySpeedPuzzling guarda un registro permanente del campeonato. Cada edición de la tabla tiene su propia página de evento con los participantes que han vinculado su perfil, los puzzles montados en cada ronda y enlaces a los resultados oficiales, para que puedas seguir cómo evolucionan el campeonato y sus puzzlers año tras año."
    "p2": "¿Quieres saber cómo te iría? Registra algunos tiempos y compárate con participantes del WJPC en la <a href=\"%ladder_link%\">clasificación</a>, encuentra tu próxima competición en el <a href=\"%events_link%\">calendario de eventos</a> o empieza por nuestra guía sobre <a href=\"%guide_link%\">qué es el puzzle de velocidad</a> (en inglés)."
  "faq":
    "heading": "Preguntas frecuentes"
    "next":
      "question": "¿Cuándo es el próximo Campeonato Mundial de Puzzles?"
      "answer_scheduled": "La próxima edición, %name%, se celebra %dates% en %location%."
      "answer_event_link": "Consulta nuestra página del evento para ver detalles, participantes y puzzles."
      "answer_evergreen": "El WJPC se celebra cada año en Valladolid, España, normalmente en septiembre. Las fechas de la próxima edición se anuncian en la web oficial y cada edición tiene su página en nuestro <a href=\"%events_link%\">calendario de eventos</a>."
    "results":
      "question": "¿Cómo funcionan los resultados del WJPC?"
      "answer": "Cada ronda se juega con puzzles idénticos y contrarreloj. Quienes terminan dentro del límite de tiempo se clasifican por su tiempo exacto; el resto, por el número de piezas colocadas correctamente. Los resultados oficiales los publica la World Jigsaw Puzzle Federation, y la página de cada edición en MySpeedPuzzling enlaza a ellos junto con los participantes y puzzles de ese año."
    "anyone":
      "question": "¿Puede competir cualquiera en el WJPC?"
      "answer": "Sí. La inscripción está abierta a cualquier puzzler a partir de 14 años y no se exige ninguna ronda de clasificación. Los principiantes comparten sala habitualmente con los puzzlers más rápidos del mundo: todos reciben el mismo puzzle y el mismo cronómetro."

