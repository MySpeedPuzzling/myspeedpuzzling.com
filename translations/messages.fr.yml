"homepage":
  "meta":
    "title": "Speed Puzzling – Suivez vos temps et concourez"
    "description": "Rejoignez la plus grande communauté de speed puzzling au monde. Suivez vos temps de puzzle, grimpez dans les classements mondiaux et trouvez des concours de puzzle près de chez vous."
  "global_statistics": "Il nous a fallu à tous ce temps pour résoudre <strong>%puzzles%</strong> puzzles.<br>Cela représente un incroyable <strong>%pieces%</strong> pièces."
  "title": "Bienvenue Puzzleur, dans le Monde du Speed Puzzling !"
  "intro_text": "Le Speed Puzzling est un sport passionnant où l'objectif est d'assembler des puzzles le plus rapidement possible. Chaque pièce compte, chaque seconde importe. Imaginez l'assemblage traditionnel de puzzles mais avec l'adrénaline d'un circuit de course ! Notre plateforme est la première de son genre - un endroit où vous pouvez tester vos compétences d'assemblage de puzzles non seulement contre le temps, mais aussi contre d'autres passionnés de puzzles."
  "why_block": "<h2 class=\"h3\">Pourquoi rejoindre ?</h2>\n<ul>\n    <li><strong>Concourir avec d'autres :</strong> Partagez vos temps et comparez-les avec d'autres puzzleurs</li>\n    <li><strong>Classements et statistiques :</strong> Découvrez les classements des puzzleurs les plus rapides, des puzzles les plus assemblés et des utilisateurs les plus actifs</li>\n    <li><strong>Chronomètre :</strong> Utilisez notre chronomètre intégré pour chronométrer facilement votre assemblage de puzzle</li>\n    <li><strong>Ajoutez vos puzzles :</strong> Vous avez un puzzle qui manque sur notre site ? Ajoutez-le et partagez vos temps avec la communauté.</li>\n    <li><strong>Construisez votre communauté de puzzles :</strong> Rejoignez notre communauté grandissante et partagez conseils, astuces et rivalité amicale</li>\n    <li><strong>Élargissez vos horizons :</strong> Nous prévoyons d'organiser des compétitions, à la fois en ligne et dans le futur hors ligne, pour que vous puissiez montrer vos compétences en\
    \ direct</li>\n</ul>\n"
  "help_us_grow_block": "<h2 class=\"h3\">Aidez-nous à grandir</h2>\n<p>Notre application ne fait que commencer, et vos idées, commentaires et aide pour trouver des bugs sont inestimables. Rejoignez-nous dans cette phase précoce et ayez un impact direct sur l'avenir du speed puzzling.</p>\n"
  "start_today_block": "<h2 class=\"h3\">Commencez aujourd'hui</h2>\n<p>Que vous soyez débutant ou puzzleur expérimenté, notre plateforme offre l'endroit parfait pour développer vos compétences et vous mesurer aux autres. Rejoignez-nous et devenez partie de l'avenir du speed puzzling !</p>\n"
