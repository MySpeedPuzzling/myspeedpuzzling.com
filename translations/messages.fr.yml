        overview_elo_desc: "Score compétitif basé sur un portefeuille. Vos meilleurs résultats des 24 derniers mois, pondérés par la difficulté avec décroissance temporelle."
        section_baseline_title: "Référence du joueur"
        section_baseline_desc: "La référence de chaque joueur est la <strong>médiane pondérée</strong> de ses temps de première tentative en solo pour un nombre de pièces donné. Les résolutions récentes comptent davantage grâce à une pondération par décroissance exponentielle."
        section_baseline_formula: "Une résolution d'il y a 18 mois a ~37% de poids. Une résolution d'hier a ~100% de poids."
        section_baseline_minimum: "<strong>Minimum :</strong> 5 puzzles distincts résolus (première tentative, solo) par nombre de pièces."
        baseline_decay_title: "Décroissance temporelle avec plateau de 3 mois"
        baseline_decay_desc: "Les résolutions des 3 derniers mois comptent à plein poids. Après cela, les résolutions plus anciennes perdent progressivement de l'influence pour que votre référence reflète votre vitesse actuelle."
        baseline_decay_formula_note: "La référence est une <strong>médiane pondérée</strong> de vos temps de première tentative en solo pour chaque nombre de pièces. Les résolutions récentes influencent davantage la médiane que les anciennes."
        baseline_exotic_title: "Nombres de pièces inhabituels"
        baseline_exotic_desc: "Pour les puzzles avec des nombres de pièces inhabituels (par ex. 631 pièces), la plupart des joueurs n'auront pas 5 résolutions à ce nombre exact. Nous résolvons cela en estimant leur référence à partir de nombres de pièces proches pour lesquels ils <em>ont</em> des données, par interpolation en espace logarithmique. Cela permet à davantage de puzzles d'obtenir des notes de difficulté."
