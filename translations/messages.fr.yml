  "auth_code_flow_title": "OAuth2 Authorization Code Flow"
  "auth_code_good_for": "Quand vous développez une application où les utilisateurs se connectent avec leur compte MySpeedPuzzling. Votre application peut ensuite accéder à leurs données en leur nom — afficher leurs résultats sur votre site web, leur permettre d'ajouter des temps de résolution via votre outil de compétition ou gérer leurs collections depuis une interface personnalisée."
  "auth_code_step1": "<strong>Étape 1 :</strong> Redirigez l'utilisateur pour qu'il autorise votre application :"
  "auth_code_step2": "<strong>Étape 2 :</strong> Échangez le code d'autorisation contre des tokens :"
