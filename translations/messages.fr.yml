        section_confidence_title: "Niveaux de fiabilité"
        section_skill_title: "Compétence du joueur"
        section_skill_desc: "La compétence du joueur mesure vos performances <strong>par rapport aux autres joueurs sur chaque puzzle</strong>, pondérée par la difficulté du puzzle. Les puzzles plus difficiles valent davantage."
        section_skill_formula: "Score > 1.0 = plus rapide que prévu. Score < 1.0 = plus lent que prévu."
        section_skill_minimum: "<strong>Minimum :</strong> 10 puzzles qualifiants, chacun avec au moins 20 joueurs en première tentative."
        section_skill_tiers_title: "Niveaux de compétence"
        skill_decay_title: "Pondération par récence de la compétence"
        skill_decay_desc: "Votre niveau de compétence reflète votre capacité actuelle. Les puzzles récents ont plus d'influence que les anciens grâce à une décroissance temporelle douce avec un plateau de 6 mois."
        skill_example_title: "Exemple : Comment votre score de compétence est calculé"
        skill_example_desc: "Vous avez résolu le <strong>Puzzle X</strong> en 45 min, <strong>il y a 3 mois</strong>."
        skill_example_slower: "Sur 50 joueurs en première tentative, <strong>38 étaient plus lents</strong> — votre percentile = <strong>0.78</strong>"
        skill_example_difficulty: "Le Puzzle X est <strong>Exigeant</strong> (difficulté 1.18) — poids de difficulté = <strong>1.09</strong>"
        skill_example_weighted: "Percentile pondéré : 0.78 × 1.09 = <strong>0.85</strong>"
        skill_example_age: "Résolution il y a 3 mois (dans le plateau) — poids temporel = <strong>1.00</strong>"
        skill_example_result: "Votre score de compétence = médiane pondérée de toutes ces entrées, où les résolutions récentes ont plus d'influence."
        section_elo_title: "Classement MSP Rating"
        section_elo_desc: "Un score compétitif <strong>basé sur un portefeuille</strong>. Vos meilleurs résultats de puzzles des 24 derniers mois sont évalués, combinant la performance en première tentative (75%) avec la performance du meilleur temps (25%). Les puzzles plus difficiles valent davantage. Les résultats récents pèsent plus grâce à une décroissance temporelle douce."
        section_elo_formula: "K = 60 pour les 10 premiers matchs (placement), K = 30 ensuite. Score de départ : 1000."
        section_elo_minimum: "<strong>Minimum :</strong> 20 premières tentatives + 50 puzzles qualifiants dans une fenêtre glissante de 24 mois. Chaque puzzle doit avoir 20+ joueurs."
        section_elo_periods: "Deux périodes disponibles : <strong>Mensuel</strong> (nouveau départ chaque mois) et <strong>Depuis toujours</strong> (persistant)."
        elo_fa_title: "Premières tentatives (75%)"
        elo_fa_desc: "Résoudre un puzzle à froid porte le plus de poids — c'est la mesure la plus pure de la compétence. Vos 100 meilleurs résultats en première tentative sont évalués."
        elo_bt_title: "Meilleurs temps (25%)"
        elo_bt_desc: "Votre temps le plus rapide sur chaque puzzle compte aussi — l'amélioration réelle par la pratique est récompensée, mais avec un poids inférieur à la résolution à froid."
        elo_decay_title: "Pondération par récence du Rating"
        elo_decay_desc: "Les entrées du portefeuille sont doucement atténuées avec le temps pour que les résultats récents comptent davantage, tout en conservant la valeur des anciens bons résultats. Un plateau de 3 mois maintient les résultats très récents à pleine valeur."
        elo_decay_cutoff: "Limite stricte à 24 mois — les résolutions plus anciennes sont entièrement exclues."
        elo_antigaming_title: "Propriétés anti-manipulation"
        elo_antigaming_easy: "<strong>Farming de puzzles faciles :</strong> La pondération par difficulté rend les puzzles difficiles plus valorisés au même percentile."
        elo_antigaming_grinding: "<strong>Refaire le même puzzle :</strong> N'affecte qu'une seule entrée de meilleur temps (25% de poids). Le score de première tentative est verrouillé."
        elo_antigaming_volume: "<strong>Accumulation par volume :</strong> Limite de 100. Au-delà de 100 puzzles, plus de résolutions n'aident que si elles sont meilleures que votre entrée la plus faible."
        elo_antigaming_inactivity: "<strong>Inactivité :</strong> La décroissance temporelle réduit progressivement les anciens résultats. Restez actif pour maintenir votre score."
        elo_example_title: "Exemple : Joueur à froid vs Répétiteur"
        elo_example_desc: "Même puzzle <strong>Difficile</strong> (difficulté 1.35, poids 1.175), résolu <strong>le mois dernier</strong> (décroissance = 1.0) :"
        elo_example_player_a: "<strong>Joueur A :</strong> Bonne première tentative (92e percentile), ne refait jamais"
        elo_example_player_a_score: "Score : 0.92 × 1.175 × 1.0 = <strong>1.08</strong>"
        elo_example_player_b: "<strong>Joueur B :</strong> Première tentative faible (60e), s'entraîne jusqu'au 95e percentile"
        elo_example_player_b_score: "Score : 0.75 × 0.70 + 0.25 × 1.12 = <strong>0.81</strong>"
        elo_example_conclusion: "Le Joueur A l'emporte nettement — le talent brut à froid prime, mais B obtient un crédit partiel pour son amélioration."
        section_prediction_title: "Prédiction de temps"
        section_prediction_formula: "La fourchette montre où 50%% des joueurs avec votre vitesse se situent (P25-P75). Pour les joueurs récurrents, basée sur votre historique personnel."
        prediction_intro: "Nous utilisons un système de prédiction en couches. Si vous avez déjà résolu le puzzle, vous obtenez une <strong>prédiction personnelle</strong> utilisant votre historique d'amélioration et des ratios d'amélioration basés sur les données. Sinon, vous obtenez une <strong>prédiction statistique</strong> basée sur votre référence et la difficulté du puzzle."
        prediction_ratios_title: "Ratios d'amélioration"
        prediction_ratios_desc: "Nous calculons des <strong>ratios d'amélioration</strong> — combien les joueurs s'améliorent typiquement entre tentatives consécutives (1re→2e, 2e→3e, etc.). Ceux-ci sont calculés à partir de données réelles de tous les joueurs et puzzles, stratifiés par l'intervalle entre les tentatives."
        prediction_ratios_formula: "ratio(N→N+1) = médiane(temps_tentative_N+1 / temps_tentative_N)\n\nSources (ordre de priorité) :\n  1. Votre ratio personnel (de toutes vos résolutions répétées)\n  2. Ratio global (de tous les joueurs, par nombre de pièces)\n  3. Défaut : 0,90\n\nCorrection d'intervalle : votre ratio personnel est ajusté\npar les données globales des intervalles de temps."
        prediction_ratios_gap_desc: "L'intervalle entre les tentatives affecte votre mémorisation. Les ratios sont regroupés par durée d'intervalle :"
        prediction_ratios_gap_header: "Groupe"
        prediction_ratios_gap_range: "Plage"
        prediction_personal_title: "Prédiction personnelle (1+ résolutions précédentes)"
        prediction_personal_desc: "Quand vous avez déjà résolu le puzzle, nous prédisons votre prochain temps en utilisant des <strong>ratios d'amélioration</strong> combinés avec le <strong>lissage de tendance amortie de Holt</strong>. Avec moins de données, le ratio d'amélioration domine. Avec plus d'historique, le modèle de tendance prend le relais."
        prediction_personal_formula: "ratio_prediction = dernier_temps × ratio_amélioration(N→N+1, intervalle)\n\nCombinaison avec tendance amortie de Holt (α=0,5, β=0,4, φ=0,8) :\n  N = 1 :   100%% prédiction par ratio\n  N = 2-5 : combinaison (poids Holt = (N-1)/5)\n  N ≥ 6 :   100%% tendance amortie de Holt\n\nPlancher : max(prédiction, meilleur_temps × 0,70)"
        prediction_personal_dampening: "La combinaison assure des transitions fluides : avec peu de données, les patterns d'amélioration inter-puzzles guident la prédiction. À mesure que l'historique spécifique au puzzle grandit, le modèle de tendance prend le relais."
        prediction_statistical_title: "Prédiction statistique (première résolution)"
        prediction_statistical_desc: "Quand vous n'avez pas encore résolu ce puzzle, nous combinons votre référence avec la difficulté du puzzle :"
        prediction_statistical_example_baseline: "Votre référence 500 pièces :"
        prediction_statistical_example_difficulty: "Difficulté du puzzle :"
        prediction_statistical_example_predicted: "Temps prévu :"
        prediction_statistical_range: "La fourchette utilise P25–P75 des indices de difficulté du puzzle : référence × P25 à référence × P75. Des bornes de sécurité maintiennent la fourchette entre 30%% et 300%% du temps prévu."
        section_data_quality_title: "Qualité des données"
        section_data_quality_solo: "<strong>Solo uniquement :</strong> Les résolutions en duo et en équipe sont exclues"
        section_data_quality_first: "<strong>Premières tentatives :</strong> Seules les premières rencontres avec chaque puzzle comptent pour la difficulté et les références"
        section_data_quality_suspicious: "<strong>En attente de vérification :</strong> les temps en attente de vérification sont exclus"
        section_data_quality_outlier: "<strong>Filtre des valeurs aberrantes :</strong> Les indices de difficulté supérieurs à 5.0 sont exclus (probablement des erreurs de chronomètre)"
        section_data_quality_recency: "<strong>Pondération par récence :</strong> Les résolutions récentes comptent davantage — les références, niveaux de compétence et Rating utilisent tous la décroissance temporelle pour refléter votre capacité actuelle"
        section_opt_out_title: "Se désinscrire"
        section_opt_out_desc: "Les joueurs peuvent se désinscrire du classement et du suivi des compétences dans les <a href=\"%url%\">paramètres de leur profil</a>. Les joueurs désinscrits sont toujours inclus dans tous les calculs en arrière-plan — leurs résultats contribuent aux scores de difficulté des puzzles et aux classements des autres joueurs. Ils n'apparaissent simplement pas dans le classement public MSP Rating et ne voient pas leur propre niveau de compétence ou score Rating. Se réinscrire rétablit immédiatement la visibilité complète."
        section_personality_title: "Métriques de personnalité du puzzle"
        personality_box_dependence_detail: "Ratio entre la difficulté sans boîte et avec boîte. 1.0 = aucune différence, 2.0 = deux fois plus difficile sans boîte. Min : 10 joueurs sans boîte + 5 avec boîte."
        personality_improvement_ceiling_detail: "Ratio entre le temps médian de première tentative et le 10e percentile de toutes les tentatives. Plus élevé signifie que la pratique améliore considérablement les temps. Min : 20 joueurs."
        personality_memorability_detail: "Mesure la vitesse à laquelle les joueurs apprennent ce puzzle au cours de leurs 3 premières tentatives, normalisée par rapport au taux d'apprentissage moyen. Une valeur > 1.0 signifie que ce puzzle récompense la familiarité plus que la moyenne. Min : 8 joueurs avec 3+ tentatives."
        personality_predictability_detail: "Score de 0 à 1 (borné). Plus proche de 1 = expérience de difficulté plus constante entre différents joueurs. Min : 20 indices qualifiants."
        personality_skill_sensitivity_detail: "Ratio entre le 75e et le 25e percentile des indices de difficulté. Plus élevé = plus grand écart entre joueurs rapides et lents. Min : 20 indices qualifiants."
        section_recalculation_note: "Toutes les métriques sont recalculées toutes les 15 minutes."
        section_recalculation_countdown: "Prochain recalcul dans"
        thresholds_title: "Seuils minimum de données"
        threshold_baseline: "5 résolutions distinctes en première tentative solo par nombre de pièces"
        threshold_difficulty: "5 indices qualifiants de joueurs différents"
        threshold_skill: "10 puzzles qualifiants avec 20+ joueurs en première tentative chacun"
