  "explainer":
    "title": "Comment fonctionnent les XP et les niveaux"
    "intro": "Chaque puzzle terminé vous fait avancer. Les XP (points d'expérience) célèbrent votre activité — pas votre vitesse, simplement le fait d'être là et de puzzler. Enregistrez une résolution, gagnez des XP et regardez votre niveau grimper de 1 jusqu'à 50."
    "currencies":
      "heading": "Les trois chiffres de MySpeedPuzzling"
      "header_what": "Quoi"
      "header_measures": "Mesure"
      "header_who": "Qui le voit"
      "xp_name": "XP et niveaux"
      "xp_measures": "Votre activité — chaque résolution compte"
      "xp_who": "Tout le monde, gratuit pour toujours"
      "ap_name": "Points de succès (AP)"
      "ap_measures": "Votre collection de succès obtenus"
      "ap_who": "Membres"
      "rating_name": "MSP Rating"
      "rating_measures": "Votre vitesse et vos compétences"
      "rating_who": "Membres (inchangé, séparé)"
      "never_bought": "Les XP ne s'achètent pas — pas de boosts, pas de multiplicateurs, pas de raccourcis. Jamais."
      "unlock_nothing": "Les niveaux ne débloquent rien de fonctionnel ; ils sont votre identité visuelle de puzzleur."
    "how":
      "heading": "Comment une résolution se transforme en XP"
      "intro": "Votre reçu après chaque résolution montre exactement d'où vient chaque point :"
      "base": "<strong>Base</strong> : environ 1 XP pour 100 pièces (un puzzle de 500 pièces ≈ 5 XP). Plafonné à 60."
      "difficulty": "<strong>Bonus de difficulté</strong> : les puzzles plus difficiles (niveaux de difficulté communautaires 3–6) ajoutent +15% à +50%."
      "team": "<strong>Résolutions en équipe</strong> : chaque membre du groupe gagne 75% de la valeur solo — puzzler ensemble compte pour chaque paire de mains."
      "unboxed": "<strong>Bonus sans boîte</strong> : résolu sans l'image de la boîte ? +20%."
      "repeat": "<strong>Résolutions répétées</strong> : la 2e résolution chronométrée du même puzzle rapporte 50%, les suivantes 25%. Mode relax : première résolution 50%, répétitions 0%."
      "speed": "<strong>Bonus de vitesse</strong> : les résolutions solo chronométrées plus rapides que la médiane communautaire du puzzle rapportent +5%, top 25% +10%, top 10% +15% (il faut les temps d'au moins 3 puzzleurs)."
      "weekly": "<strong>Boost hebdomadaire</strong> : vos 5 premières résolutions de la semaine rapportent +50% de plus."
      "daily": "<strong>Échauffement du jour</strong> : la première résolution de votre journée apporte +2 XP tout rond."
    "example":
      "heading": "Exemple concret"
      "body": "Une résolution solo, chronométrée et en première tentative d'un puzzle de 1 000 pièces de niveau 4, résolu sans la boîte, plus vite que la médiane, comme première résolution de la semaine et du jour :"
      "math": "base 10 + difficulté 3 + sans boîte 3 + vitesse 1 + boost hebdomadaire 8 + échauffement 2 = <strong>27 XP</strong>"
    "unrated":
      "heading": "Puzzles non notés"
      "body": "Les puzzles tout juste ajoutés au catalogue n'ont parfois pas encore de niveau de difficulté. Vous gagnez les XP de base immédiatement, et le bonus de difficulté arrive automatiquement (il est « régularisé ») dès que la communauté note le puzzle. Même chose pour le bonus de vitesse dès qu'assez de puzzleurs ont enregistré des temps."
    "achievements":
      "heading": "Les succès rapportent aussi des XP"
      "body": "Chaque palier de succès rapporte des XP une seule fois, pour toujours : Bronze 5 · Argent 10 · Or 25 · Platine 50 · Diamant 100."
    "levels":
      "heading": "Niveaux"
      "header_level": "Niveau"
      "header_xp": "XP"
      "summit": "Le niveau 50 est le sommet — 3 160 XP au total. Les XP continuent de s'accumuler ensuite ; au niveau 50, le classement des points de succès devient votre prochaine montagne."
    "lose":
      "heading": "Puis-je perdre des XP ?"
      "body": "Uniquement en supprimant ou en modifiant une résolution — les XP qu'elle avait rapportés partent avec elle. Rien d'autre ne retire jamais d'XP. Les succès sont permanents."
    "faq":
      "heading": "FAQ"
      "old_solves_question": "Les anciennes résolutions comptent-elles ?"
      "old_solves_answer": "Oui ! Tout votre historique a été converti au lancement (formule de base, sans les bonus liés au temps — ceux-ci ne s'appliquent qu'à partir de maintenant)."
      "opt_out_question": "Je ne veux rien de tout ça."
      "opt_out_answer": "Compris — désactivez-le dans les paramètres de votre profil (« système d'expérience »), et votre niveau, vos XP et les célébrations disparaissent de l'affichage."
      "friend_question": "Pourquoi mon ami a-t-il reçu plus d'XP pour le même puzzle ?"
      "friend_answer": "Les réductions pour répétition, les boosts hebdomadaires et les échauffements du jour sont personnels ; deux reçus se ressemblent rarement. Touchez une ligne du reçu pour voir sa raison."
      "fair_play_question": "Comment cela reste-t-il équitable ?"
      "fair_play_answer": "Quelques garde-fous discrets et automatiques gardent les chiffres honnêtes — découvrez-les sur la page <a href=\"%fair_play_link%\">Fair-play et confiance</a>."
  "fair_play":
    "title": "Fair-play et confiance"
    "intro": "MySpeedPuzzling fonctionne sur la confiance. Personne ne vérifie vos résolutions avant qu'elles comptent — nous vous croyons, et les chiffres de la communauté restent fiables grâce à quelques garde-fous discrets et automatiques :"
    "principle_no_buying": "Les XP mesurent l'activité, jamais les dépenses : il est impossible d'acheter des XP, des boosts ou des multiplicateurs."
    "principle_repeats": "Les résolutions répétées du même puzzle rapportent moins à chaque fois — enregistrer le même puzzle encore et encore n'est pas un raccourci."
    "principle_speed": "Le bonus de vitesse ne s'applique que lorsqu'une référence communautaire fiable existe, et les temps invraisemblablement rapides ne le reçoivent tout simplement pas. Pas d'accusation, pas de drame — le bonus ne s'applique pas, c'est tout."
    "principle_deleting": "Supprimer une résolution retire les XP qu'elle avait rapportés, automatiquement et en toute transparence (votre page d'historique d'XP montre chaque entrée)."
    "principle_caps": "Les entrées extrêmement grandes ou inhabituelles sont plafonnées pour qu'aucune résolution ne puisse fausser le classement."
    "closing_thresholds": "Nous ne publions volontairement pas les seuils exacts — ils existent pour que tout reste équitable, pas pour être contournés. Si quelque chose vous semble étrange dans un classement, écrivez-nous ; un humain examine chaque signalement."
    "closing_celebrate": "Puzzlez honnêtement, célébrez bruyamment. 🧩"
