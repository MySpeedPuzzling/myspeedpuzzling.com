  "auth_code_step4": "<strong>Étape 4 :</strong> Quand l'access token expire, utilisez le refresh token pour en obtenir un nouveau :"
  "auth_code_note": "L'access token expire au bout d'1 heure. Les refresh tokens sont valides pendant 1 mois."
  "client_cred_flow_title": "OAuth2 Client Credentials Flow"
  "client_cred_good_for": "Quand vous avez besoin de données statistiques ou souhaitez accéder aux résultats publics de n'importe quel joueur sans interaction utilisateur. Idéal pour créer des widgets de classement, des affichages de résultats de compétitions, des tableaux de bord de statistiques communautaires ou des outils d'analyse de données."
  "client_cred_step1": "<strong>Étape 1 :</strong> Demandez un access token directement :"
