"faq":
  "meta":
    "title": "FAQ Speed Puzzling – Suivre et Concourir"
    "description": "FAQ du speed puzzling couvrant comment suivre les temps de puzzle, concourir avec d'autres et améliorer vos compétences de résolution. Commencez aujourd'hui !"
  "title": "Questions fréquemment posées"
  "intro_block": "<p>Vos commentaires sont très importants pour nous et nous les apprécions grandement ! Si vous avez quelque chose à nous dire, veuillez nous écrire à <a href=\"mailto:simona@speedpuzzling.cz\">simona@speedpuzzling.cz</a> (ou à <a href=\"mailto:jan@myspeedpuzzling.com\">jan@myspeedpuzzling.com</a> pour les questions techniques – connexion, compte ou données personnelles) ou sur <a href=\"https://www.instagram.com/myspeedpuzzling/\" target=\"_blank\">Instagram</a>.</p>\n<p>Tous nos codes sources sont open-source et publics sur <a href=\"https://github.com/MySpeedPuzzling\">GitHub SpeedPuzzling</a>. Nous adhérons à la philosophie du \"partage c'est prendre soin\" et nous efforçons de partager tout sur myspeedpuzzling.com ouvertement.</p>\n"
  "question_fair_play": "Comment savez-vous que je ne triche pas en saisissant les temps ?"
  "answer_fair_play": "<p>Honnêtement - nous ne le saurons probablement pas. Dans le classement public, où les puzzleurs saisissent les temps eux-mêmes, nous comptons sur l'honnêteté et l'intégrité de chaque puzzleur individuel. Apprécieriez-vous vraiment un résultat saisi malhonnêtement ?</p>\n<p>Nous supposons que, comme nous, les autres puzzleurs assemblent principalement pour le plaisir, et les temps de ce type d'assemblage sont indicatifs pour une idée approximative de comment nous nous comparons aux autres et nous mesurerons lors d'une compétition. Dites-moi, ne serait-ce pas suspect si j'avais un temps de 20 minutes sur la plateforme mais que je prenais 3 heures lors d'une compétition ?</p>\n<p>À l'avenir, nous prévoyons également des ligues classées, où la vérification du temps pourrait être requise, par exemple, par enregistrement vidéo.</p>\n<p class=\"text-danger mb-0\"><small>Puisque notre\
    \ communauté inclut des finalistes du Championnat mondial de puzzle, qui se sont classés en haut, nous pouvons prendre leurs temps comme référence. Les temps suspects seront surveillés et si la fraude est prouvée, ils seront impitoyablement supprimés. En cas de triche répétée, l'accès du joueur à la plateforme sera restreint.</small></p>\n"
  "question_qr": "J'ai reçu des puzzles avec un code QR et le logo myspeedpuzzling.com, que dois-je faire ?"
  "answer_qr": "<p>Pour rendre l'assemblage et la saisie des temps aussi agréables que possible pour vous, nous ajoutons un code QR à tous les puzzles qui passent entre nos mains - le scanner vous emmène à la page avec les puzzles donnés, où vous pouvez directement commencer le chronométrage ou saisir votre temps.</p>\n<p class=\"mb-0\">Si vous aimeriez aider à faire connaître le speedpuzzling et ajouter un flyer avec un code QR à vos puzzles, veuillez nous écrire - nous vous enverrons un PDF que vous pouvez imprimer, ou nous pouvons vous envoyer des flyers imprimés directement.</p>\n"
  "question_add_time_for_missing_puzzle": "Puis-je ajouter un temps pour des puzzles non présents sur la plateforme ?"
  "answer_add_time_for_missing_puzzle": "<p>Absolument ! Si vous avez assemblé un puzzle qui n'est pas encore sur notre plateforme, lors de l'ajout de temps, basculez vers l'option :</p>\n<div class=\"form-check form-switch mb-3\">\n    <input type=\"checkbox\" class=\"form-check-input\" id=\"switch-add-puzzle\">\n    <label class=\"form-check-label\" for=\"switch-add-puzzle\">Saisir le puzzle manuellement - fabricant inconnu ou pas dans la liste</label>\n</div>\n<p class=\"mb-0\">Vous avez alors la possibilité de sélectionner dans une liste de fabricants. Si le fabricant n'est pas non plus dans la base de données, vous pouvez le saisir vous-même.</p>\n"
  "question_edit_or_delete_time": "Comment modifier ou supprimer un temps saisi ?"
  "answer_edit_or_delete_time": "<p>Dans la section <a href=\"%link%\">Mon profil</a>, à côté de chaque temps saisi, vous trouverez un lien pour modifier (le lien ressemble à une icône crayon <span class=\"btn btn-sm btn-outline-dark px-2 py-1 border-0\"><i class=\"ci-edit\"></i></span>).</p>\n<p>Sur la page de modification, tout en bas, il y a un <a class=\"btn btn-sm btn-outline-danger mx-2\">bouton magique</a> qui supprime une fois pour toutes l'enregistrement de tout l'internet.</p>\n<p class=\"mb-0 mt-3\">Les temps en duo et en équipe peuvent être modifiés par chaque puzzleur inscrit du groupe, et pas seulement par celui qui les a saisis. La suppression reste réservée au puzzleur qui a saisi le temps.</p>\n"
  "question_physical_puzzles": "Est-ce qu'on assemble le puzzle en ligne sur le site ?"
  "answer_physical_puzzles": "<p>Non, MySpeedPuzzling n'est pas un jeu en ligne. Vous assemblez vos propres puzzles, bien réels, chez vous (ou ailleurs) et vous enregistrez simplement chez nous le temps que cela vous a pris.</p>\n<p>Vous pouvez mesurer le temps avec notre chronomètre directement sur le site, ou avec votre propre chronomètre puis saisir le temps à la main - même après coup, pour des puzzles assemblés dans le passé.</p>\n<p class=\"mb-0\">Le chronomètre et l'enregistrement des temps sont gratuits, il suffit d'être connecté. Aucune adhésion n'est nécessaire : elle ne débloque que des fonctions supplémentaires, comme les statistiques détaillées.</p>\n"
  "question_button_start_solving": "Que fait le bouton <a class=\"btn btn-accent btn-sm mx-2\"><i class=\"ci-time\"></i> Commencer l'assemblage</a> ?"
  "answer_button_start_solving": "<p class=\"mb-0\">Ouvre le chronomètre pour les puzzles sélectionnés. Lancez-le lorsque vous commencez à assembler votre vrai puzzle chez vous, puis enregistrez le temps dans votre profil une fois terminé. L'assemblage ne se fait pas sur le site.</p>\n"
  "question_button_add_my_time": "Que fait le bouton <a class=\"btn btn-accent btn-sm mx-2\"><i class=\"ci-add\"></i> Ajouter mon temps</a> ?"
  "answer_button_add_my_time": "<p class=\"mb-0\">Ouvre l'ajout de votre temps aux puzzles sélectionnés - adapté si vous utilisez votre propre chronomètre et venez de terminer l'assemblage. Si vous avez assemblé dans le passé et voulez enregistrer le temps, vous avez la possibilité de spécifier également la date d'assemblage.</p>\n"
  "question_helping": "Voulez-vous un coup de main ?"
  "answer_helping": "<p class=\"mb-0\">Bien sûr ! Connectez-vous avec nous, idéalement avec une idée de comment vous aimeriez vous impliquer dans la construction de la communauté speed puzzling, nous mettrons nos têtes ensemble et trouverons sûrement quelque chose.</p>\n"
  "question_what_is_speed_puzzling": "Qu'est-ce que le speed puzzling ?"
  "answer_what_is_speed_puzzling": "<p class=\"mb-0\">Le speed puzzling est le sport qui consiste à assembler des puzzles le plus rapidement possible — en solo, en duo ou en équipe. Les puzzleurs courent contre la montre, suivent leurs temps et concourent lors d'événements en direct et en ligne dans le monde entier. Envie d'en savoir plus ? Lisez notre <a href=\"%guide_link%\">guide complet du speed puzzling</a> (en anglais) — il couvre les formats, les temps typiques et comment débuter.</p>\n"
  "question_how_long_1000_pieces": "Combien de temps faut-il pour un puzzle de 1000 pièces ?"
  "answer_how_long_1000_pieces": "<p class=\"mb-0\">D'après les assemblages en solo enregistrés sur MySpeedPuzzling, le temps médian pour un puzzle de 1000 pièces est d'environ %median_1000%. Les speed puzzleurs terminent régulièrement en moins de %fast_1000%, et les plus rapides bien en dessous. Consultez les <a href=\"%times_guide_link%\">statistiques complètes par nombre de pièces</a> (en anglais) pour les médianes, percentiles et records.</p>\n"
  "question_how_competitions_work": "Comment fonctionnent les concours de speed puzzling ?"
  "answer_how_competitions_work": "<p class=\"mb-0\">Dans la plupart des concours de puzzle, tous les participants assemblent le même puzzle en même temps — celui qui termine en premier, ou à qui il reste le moins de pièces à la fin du temps imparti, gagne. Il existe des catégories solo, duo et équipe, des rencontres locales au World Jigsaw Puzzle Championship, ainsi que des concours en ligne. Parcourez notre <a href=\"%events_link%\">calendrier des événements</a> pour trouver un concours près de chez vous.</p>\n"
  "question_duplicate_accounts": "J'ai créé un deuxième compte par erreur (par exemple en me connectant avec Google, Microsoft, Apple ou Facebook) – que faire ?"
  "answer_duplicate_accounts": |
    <p>Cela peut arriver si vous vous connectez avec Google, Microsoft, Apple ou Facebook en utilisant une adresse e-mail différente de celle de votre compte MySpeedPuzzling (par exemple une adresse créée avec « Masquer mon adresse e-mail » d'Apple). Nous n'avons alors aucun moyen de savoir que c'est vous, et un nouveau compte distinct est créé.</p>
    <p><strong>Comment l'éviter :</strong> connectez-vous d'abord à votre compte existant (avec votre e-mail et votre mot de passe, ou avec un lien de connexion), ouvrez <a href="%edit_profile_link%">Modifier le profil</a> et associez le fournisseur dans <strong>Méthodes de connexion associées</strong>. Ensuite, la connexion avec Google, Microsoft, Apple ou Facebook vous mènera directement à votre compte – même si le fournisseur utilise une autre adresse e-mail.</p>
    <p class="mb-0"><strong>Si c'est déjà arrivé :</strong> pas d'inquiétude, rien n'est perdu. Écrivez-nous à <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a> en indiquant les adresses e-mail (ou les codes joueur) des deux comptes et celui que vous souhaitez conserver. Un administrateur fusionnera les comptes manuellement.</p>
  "question_instagram_sign_in": "Puis-je me connecter avec Instagram ?"
  "answer_instagram_sign_in": |
    <p>Pas directement – mais si votre compte Instagram est associé à un compte Facebook dans l'Espace Comptes de Meta, choisissez simplement <strong>Continuer avec Facebook</strong> et connectez-vous avec ce compte Facebook.</p>
    <p class="mb-0">Vous n'avez pas de compte Facebook ? Connectez-vous avec Google, avec Microsoft, avec Apple ou avec votre adresse e-mail.</p>
  "question_shared_computer": "Je me suis connecté sur un ordinateur partagé ou public – que faire ?"
  "answer_shared_computer": "<p class=\"mb-0\">Déconnectez-vous une fois terminé : ouvrez le menu de votre profil et choisissez <strong>Se déconnecter</strong>. Sinon, vous restez connecté sur cet ordinateur pendant 30 jours.</p>"
