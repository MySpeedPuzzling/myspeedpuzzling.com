      "description": "Lorsque vous vous mettez d'accord sur un deal, marquez le puzzle comme réservé. Cela permet aux autres puzzlers de savoir que l'article est retenu pendant que la transaction se termine."
      "title": "Réservez des puzzles"
    "step5":
      "description": "Une fois le puzzle vendu ou échangé, marquez-le comme terminé. Le puzzle sera automatiquement retiré de votre collection et l'acheteur pourra l'ajouter directement à la sienne."
      "title": "Complétez la transaction"
    "step6":
      "description": "Après la transaction, n'oubliez pas d'évaluer l'autre puzzler ! Les évaluations aident à construire la confiance dans la communauté et montrent aux autres comment l'expérience s'est déroulée."
