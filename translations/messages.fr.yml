      "description": "Avant de publier, remplissez les pays vers lesquels vous expédiez, votre devise préférée et éventuellement vos frais d'expédition et vos coordonnées. Cela aide les acheteurs à savoir à quoi s'attendre."
      "title": "Configurez votre profil"
