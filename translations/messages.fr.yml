        section_difficulty_formula: "Indice < 1.0 = plus facile que la moyenne pour ce joueur. Indice > 1.0 = plus difficile."
        section_difficulty_median: "Le score de difficulté du puzzle est la <strong>médiane</strong> de tous les indices qualifiants. Les indices supérieurs à 5.0 sont exclus comme valeurs aberrantes."
        section_difficulty_minimum: "<strong>Minimum :</strong> 5 joueurs qualifiés nécessaires pour un score de difficulté."
