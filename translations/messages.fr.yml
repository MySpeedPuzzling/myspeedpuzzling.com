  "content": "<h1>Conditions d'utilisation</h1>\n<p>Ces conditions d'utilisation régissent la fourniture d'abonnement (adhésion) sur la plateforme MySpeedPuzzling.com. Nous voulons que vous ayez toutes les informations importantes en un seul endroit afin que vous puissiez facilement les consulter.</p>\n<h2>1. Qui nous sommes</h2>\n<ul>\n    <li><strong>Fournisseur :</strong> Simona Mikešová (Entrepreneur individuel)</li>\n    <li><strong>Adresse :</strong> Františka Formana 237/31, 700 30 Ostrava, République Tchèque</li>\n    <li><strong>N° ID :</strong> 06868878</li>\n    <li><strong>Email de contact :</strong> <a href=\"mailto:simona@speedpuzzling.cz\">simona@speedpuzzling.cz</a></li>\n</ul>\n<p>En tant qu'opérateur de la plateforme MySpeedPuzzling.com, nous sommes votre partenaire contractuel pour l'achat et l'utilisation d'une adhésion payante.</p>\n<h2>2. Comment fonctionne le service</h2>\n<p>MySpeedPuzzling.com est une plateforme en ligne pour les passionnés de puzzles. Nous offrons\
    \ diverses fonctionnalités, tandis que les parties premium de l'application sont accessibles uniquement aux utilisateurs avec une adhésion active.</p>\n<ul>\n    <li>L'adhésion est un produit virtuel (numérique) – une fois que vous payez, vous obtenez immédiatement l'accès aux fonctionnalités exclusives.</li>\n    <li>Puisque c'est un service électronique, aucune livraison physique ou conditions d'expédition ne s'appliquent.</li>\n    <li>Le contenu et les fonctionnalités disponibles dans le cadre de l'adhésion peuvent changer avec le temps – nous les améliorons continuellement.</li>\n</ul>\n<h2>3. Commande et conclusion du contrat</h2>\n<p>Si vous décidez d'acheter une adhésion payante, choisissez simplement l'abonnement mensuel dans la section \"Adhésion\". Vous serez ensuite redirigé vers la passerelle de paiement Stripe.</p>\n<ul>\n    <li><strong>Détails de paiement :</strong> Tous les détails de paiement sont traités via Stripe en utilisant une communication chiffrée – nous n'avons\
    \ pas accès à ces informations.</li>\n    <li><strong>Confirmation de commande :</strong> Le contrat entre vous et nous est conclu au moment du paiement réussi. Votre adhésion est immédiatement activée par la suite.</li>\n    <li><strong>Facture :</strong> Vous pouvez télécharger la facture pour votre abonnement payant directement depuis le portail de paiement Stripe.</li>\n    <li><strong>Gestion d'adhésion ultérieure :</strong> Les modifications de la méthode de paiement, l'annulation ou l'extension sont également gérées via le portail de paiement Stripe, accessible via la section \"Adhésion\" de votre compte.</li>\n</ul>\n<h2>4. Prix et conditions de paiement</h2>\n<ul>\n    <li><strong>Prix de l'adhésion :</strong> Tous les prix sont indiqués TTC. Selon la devise que vous utilisez pour le paiement, les prix peuvent varier légèrement.</li>\n    <li><strong>Méthodes de paiement :</strong> Stripe supporte les paiements par carte, Apple Pay et Link (d'autres méthodes peuvent être ajoutées\
    \ avec le temps).</li>\n    <li><strong>Paiement récurrent :</strong> C'est un abonnement mensuel, ce qui signifie que le paiement se répète chaque mois jusqu'à ce que vous annuliez votre adhésion.</li>\n</ul>\n<h2>5. Annulation et remboursements</h2>\n<ul>\n    <li><strong>Vous pouvez annuler votre adhésion à tout moment :</strong> Après l'annulation, vous conserverez l'accès jusqu'à la fin de la période prépayée. Aucun autre paiement ne sera prélevé une fois cette période terminée.</li>\n    <li><strong>Remboursements :</strong> Si vous demandez un remboursement pour la période de facturation actuelle, nous rembourserons le paiement en utilisant la même méthode que celle utilisée pour payer, et votre adhésion se terminera immédiatement.</li>\n    <li><strong>Rapidité de traitement :</strong> Nous traitons les remboursements et réclamations rapidement (généralement dans le jour ouvrable suivant), au plus tard dans les 30 jours comme requis par la loi.</li>\n    <li><strong>Coûts de\
    \ remboursement :</strong> Nous couvrons tous les frais pour les remboursements – nous voulons que vous soyez satisfait.</li>\n</ul>\n<h2>6. Réclamations</h2>\n<p>Si vous sentez que le service n'a pas été fourni avec la qualité appropriée ou si vous rencontrez des problèmes techniques, veuillez nous contacter à\n    <a href=\"mailto:simona@speedpuzzling.cz\">simona@speedpuzzling.cz</a>.\n</p>\n<ul>\n    <li>Nous traitons les réclamations aussi rapidement que possible, généralement dans les 1–2 jours ouvrables.</li>\n    <li>Le temps de résolution maximum pour les réclamations est de 30 jours.</li>\n</ul>\n<h2>7. Protection des données personnelles</h2>\n<p>Nous fournissons des informations sur le traitement des données personnelles sur <a href=\"%privacyPolicyLink%\">une page séparée</a> dédiée à la protection de la vie privée. Vous y trouverez tous les détails sur les données que nous collectons, pourquoi nous les traitons et comment nous les gérons.</p>\n<h2>8. Dispositions finales</h2>\n\
    <ul>\n    <li>Ces conditions sont régies par le droit tchèque, et tout litige sera résolu par les tribunaux compétents de la République Tchèque.</li>\n    <li>Nous croyons qu'aucun litige ne surviendra, mais s'ils surviennent, vous pouvez contacter l'Autorité tchèque d'inspection du commerce (ČOI) ou utiliser la plateforme européenne de résolution des litiges en ligne (ODR).</li>\n    <li>La version actuelle des conditions est toujours disponible sur MySpeedPuzzling.com. Nous nous réservons le droit d'apporter des modifications raisonnables pour les maintenir en ligne avec la législation ou les besoins opérationnels.</li>\n</ul>\n<p><em><small>Dernière mise à jour : Janvier 2025</small></em></p>\n"
"privacy_policy":
  "meta":
    "title": "Politique de confidentialité"
    "description": "Politique de confidentialité de la plateforme MySpeedPuzzling.com"
  "content": |
    <h1>Politique de confidentialité</h1>
    <p>Le but de ce document est de vous informer sur la façon dont nous gérons vos données personnelles sur MySpeedPuzzling.com. Nous apprécions grandement votre confiance et votre vie privée.</p>
    <h2>1. Qui est responsable de vos données</h2>
    <p>Le responsable du traitement de vos données personnelles est l'exploitante de MySpeedPuzzling.com :</p>
    <ul>
        <li><strong>Simona Mikešová</strong> (entrepreneure individuelle)</li>
        <li>Františka Formana 237/31, 700 30 Ostrava, République tchèque</li>
        <li>N° d'identification (IČO) : 06868878</li>
    </ul>
    <p>Pour toute question concernant vos données personnelles, votre compte, la connexion ou un problème technique, écrivez à <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a>. Si possible, écrivez depuis l'adresse e-mail de votre compte, afin que nous puissions vérifier qu'il s'agit bien de vous.</p>
    <h2>2. Nom public</h2>
    <p>Lors de l'inscription sur MySpeedPuzzling.com, vous pouvez choisir un <strong>nom public</strong> – cela peut être un surnom, une abréviation, ou des initiales. Ce nom est affiché à tous les visiteurs du site web. Veuillez être prudent lors du choix d'un nom si vous souhaitez rester plus anonyme.</p>
    <h2>3. E-mail</h2>
    <ul>
        <li>Vous fournissez votre adresse e-mail pour vous connecter et communiquer avec les administrateurs de la plateforme.</li>
        <li><strong>L'adresse e-mail n'est pas publique</strong> – elle n'apparaît nulle part dans votre profil et les autres joueurs ne peuvent pas la voir.</li>
        <li>Nous ne vendons jamais votre adresse e-mail et ne la transmettons à personne à des fins de marketing. Seuls les prestataires qui nous aident à faire fonctionner la plateforme (voir la section 13) l'utilisent et – si vous avez un compte auprès de la World Jigsaw Puzzle Federation – nous nous en servons pour associer les deux comptes (voir la section 11).</li>
        <li>Lorsque vous créez un compte avec une adresse e-mail et un mot de passe, nous vous envoyons un message unique contenant un lien pour confirmer que l'adresse vous appartient bien. En dehors de cela, nous ne vous envoyons que les e-mails nécessaires à votre compte (par exemple les liens de connexion, la réinitialisation du mot de passe ou la confirmation de la suppression du compte) et les messages que vous avez choisi de recevoir dans vos paramètres.</li>
    </ul>
    <h2>4. Mot de passe</h2>
    <ul>
        <li>Votre mot de passe est stocké dans notre base de données uniquement sous forme de <strong>hash</strong> – une transformation à sens unique, donc aucun administrateur ou développeur ne peut découvrir sa forme originale.</li>
        <li>Quand vous vous connectez, l'information que vous saisissez est comparée au hash stocké dans la base de données.</li>
        <li>Pour des raisons de sécurité, nous n'envoyons jamais le mot de passe original par e-mail ; si nécessaire, vous pouvez le réinitialiser en utilisant le processus « Mot de passe oublié ».</li>
    </ul>
    <h2>5. Informations publiques optionnelles</h2>
    <p>Les utilisateurs ont la possibilité de fournir des <strong>informations publiques</strong> supplémentaires sur leur profil (par ex., ville, pays, liens de réseaux sociaux, description, avatar) pour une meilleure interaction communautaire.</p>
    <ul>
        <li>Ces informations sont visibles par tous les visiteurs ; ne renseignez donc que ce que vous acceptez de partager publiquement.</li>
        <li>Vous serez notifié que ces informations sont publiques lors du remplissage.</li>
        <li>Il en va de même pour vos temps, vos collections et les autres contenus que vous publiez sur la plateforme. Si vous rendez votre profil privé, seuls vous et les joueurs que vous choisissez pouvez le voir.</li>
    </ul>
    <h2>6. Informations de paiement</h2>
    <ul>
        <li>La plateforme MySpeedPuzzling.com <strong>ne collecte aucune donnée sur les méthodes de paiement</strong> – tous les paiements sont traités exclusivement par la société partenaire Stripe.</li>
        <li>Nous n'avons jamais accès aux détails de votre carte de paiement, informations de compte bancaire, ou toute autre donnée financière.</li>
        <li>Stripe conserve l'historique de vos paiements (paiements, factures et reçus) aussi longtemps que l'exige la législation comptable et fiscale – même après la suppression de votre compte.</li>
    </ul>
    <h2>7. Sécurité</h2>
    <ul>
        <li>La sécurité de nos utilisateurs est notre priorité – serveurs et bases de données sont protégés contre l'accès non autorisé, les fuites de données et autres cybermenaces.</li>
        <li>Toutes les communications avec le site web sont chiffrées (HTTPS), et seules les personnes qui exploitent la plateforme ont accès à la base de données.</li>
        <li>Nous respectons toutes les mesures de sécurité standard et travaillons continuellement à améliorer notre sécurité.</li>
    </ul>
    <h2>8. Connexion avec Google, Microsoft, Apple et Facebook (Meta)</h2>
    <p>Au lieu d'utiliser un mot de passe, vous pouvez vous connecter avec votre compte Google, Microsoft, Apple ou Facebook. Si vous utilisez Instagram, vous pouvez vous connecter via le compte Facebook qui y est associé dans l'Espace Comptes de Meta. Ces modes de connexion sont entièrement facultatifs : vous pouvez toujours vous connecter avec votre adresse e-mail et votre mot de passe, ou avec un lien de connexion envoyé par e-mail.</p>
    <h3 class="h5">Ce que nous recevons du fournisseur</h3>
    <ul>
        <li>un identifiant unique de votre compte chez ce fournisseur – une suite de caractères qui, à elle seule, ne dit rien de vous,</li>
        <li>votre adresse e-mail, si vous acceptez de la partager – Apple vous permet de masquer votre véritable adresse et de nous communiquer à la place une adresse de relais privée (…@privaterelay.appleid.com), qui vous transmet nos messages; une adresse e-mail Microsoft qui n'est pas une boîte Outlook.com, Hotmail, Live ou MSN est considérée comme non confirmée – nous ne l'utilisons jamais pour rattacher automatiquement un compte existant, et un nouveau compte créé avec elle reçoit un e-mail de confirmation,</li>
        <li>votre nom – nous l'utilisons uniquement pour préremplir le nom public d'un compte nouvellement créé, et vous pouvez le modifier à tout moment (Apple ne transmet le nom que lors de la toute première connexion).</li>
    </ul>
    <p>Un fournisseur peut également envoyer des informations de profil de base, comme une photo de profil. Nous ne les utilisons pas et ne les conservons pas.</p>
    <h3 class="h5">Ce que nous conservons</h3>
    <ul>
        <li>de quel fournisseur il s'agit et votre identifiant chez lui,</li>
        <li>l'adresse e-mail communiquée par le fournisseur au moment de l'association – à des fins d'assistance, pour savoir quel compte est associé,</li>
        <li>la date à laquelle vous avez associé le fournisseur et celle de votre dernière connexion avec lui.</li>
    </ul>
    <h3 class="h5">Ce que nous ne recevons jamais</h3>
    <ul>
        <li>Nous ne voyons jamais votre mot de passe Google, Microsoft, Apple ou Facebook.</li>
        <li>Nous n'avons aucun accès à vos publications, photos, amis, contacts, messages ni à quoi que ce soit d'autre dans votre compte chez le fournisseur, et nous ne publions jamais rien en votre nom.</li>
        <li>Nous ne conservons pas les jetons d'accès émis par le fournisseur – ils servent une seule fois, lors de la connexion, à lire les informations ci-dessus, puis sont supprimés.</li>
    </ul>
    <h3 class="h5">Finalité et base juridique</h3>
    <p>Nous utilisons ces données uniquement pour vous connecter et protéger votre compte. La base juridique est l'exécution d'un contrat – la fourniture du service auquel vous vous êtes inscrit (article 6, paragraphe 1, point b) du RGPD). Nous ne les utilisons pas à des fins marketing et ne les transmettons à personne.</p>
    <h3 class="h5">Dissocier un fournisseur</h3>
    <p>Vous pouvez dissocier un fournisseur à tout moment dans <a href="%edit_profile_link%">Modifier le profil</a> → <strong>Méthodes de connexion associées</strong>, à condition de disposer encore d'un autre moyen de connexion (par exemple un mot de passe). La dissociation supprime immédiatement l'association enregistrée. Pour nous retirer également l'accès du côté du fournisseur, supprimez MySpeedPuzzling dans ses paramètres :</p>
    <ul>
        <li><strong>Facebook :</strong> Paramètres et confidentialité → Paramètres → Applications et sites web</li>
        <li><strong>Google :</strong> <a href="https://myaccount.google.com/connections" target="_blank" rel="noopener">myaccount.google.com</a> → Sécurité → Vos connexions à des applications et services tiers</li>
        <li><strong>Microsoft :</strong> <a href="https://account.live.com/consent/Manage" target="_blank" rel="noopener">account.live.com/consent/Manage</a> → Applications et services auxquels vous avez donné accès → MySpeedPuzzling → Modifier → Supprimer ces autorisations</li>
        <li><strong>Apple :</strong> sur iPhone ou iPad, Réglages → votre nom (compte Apple) → Connexion et sécurité → Se connecter avec Apple ; sur le web, sur <a href="https://account.apple.com" target="_blank" rel="noopener">account.apple.com</a></li>
    </ul>
    <h3 class="h5">Les fournisseurs sont des responsables de traitement indépendants</h3>
    <p>Lorsque vous vous connectez avec Google, Microsoft, Apple ou Facebook, ces sociétés traitent vos données en tant que responsables de traitement indépendants, selon leurs propres conditions et politiques de confidentialité, sur lesquelles nous n'avons aucune influence :</p>
    <ul>
        <li>Google (Google Ireland Limited) : <a href="https://policies.google.com/privacy?hl=fr" target="_blank" rel="noopener">policies.google.com/privacy</a></li>
        <li>Microsoft (Microsoft Ireland Operations Limited) : <a href="https://privacy.microsoft.com/privacystatement" target="_blank" rel="noopener">privacy.microsoft.com/privacystatement</a></li>
        <li>Meta (Meta Platforms Ireland Limited) : <a href="https://www.facebook.com/privacy/policy/" target="_blank" rel="noopener">facebook.com/privacy/policy</a></li>
        <li>Apple (Apple Distribution International Limited) : <a href="https://www.apple.com/fr/legal/privacy/" target="_blank" rel="noopener">apple.com/legal/privacy</a></li>
    </ul>
    <h2>9. Journal de sécurité des connexions</h2>
    <p>Pour protéger votre compte, nous enregistrons les événements liés à sa sécurité : connexions réussies et échouées, déconnexions, demandes de liens de connexion ou de réinitialisation du mot de passe, changements de mot de passe et d'adresse e-mail, inscription, association et dissociation de Google, Microsoft, Apple ou Facebook, ainsi que les demandes de suppression du compte.</p>
    <ul>
        <li>Chaque entrée contient le type d'événement, sa date et son heure, le mode de connexion utilisé, l'adresse e-mail concernée, l'adresse IP et l'identification de votre navigateur et de votre appareil (le « user agent »).</li>
        <li>Nous l'utilisons pour détecter les accès non autorisés aux comptes et enquêter à leur sujet, ainsi que pour vous montrer votre propre historique – vous pouvez le consulter à tout moment sur la page <strong>Activité récente du compte</strong>, dans les paramètres de votre profil.</li>
        <li>La base juridique est notre intérêt légitime à assurer la sécurité de votre compte et de l'ensemble de la plateforme (article 6, paragraphe 1, point f) du RGPD).</li>
        <li>Les entrées sont supprimées automatiquement au bout de 24 mois ; celles qui concernent votre compte sont supprimées immédiatement avec lui. Les entrées qui ne sont liées à aucun compte (par exemple une tentative de connexion avec une adresse qui n'a pas de compte chez nous) ne sont supprimées qu'au bout de ces 24 mois.</li>
    </ul>
    <h2>10. Newsletter</h2>
    <p>Si vous vous abonnez à notre newsletter (dans vos paramètres, ou via le formulaire en bas de page, qui vous demande de confirmer l'abonnement par e-mail), nous utilisons votre adresse e-mail et votre langue préférée pour vous l'envoyer. La base juridique est votre consentement (article 6, paragraphe 1, point a) du RGPD). Vous pouvez vous désabonner à tout moment grâce au lien présent dans chaque newsletter ou dans vos paramètres ; nous cessons alors immédiatement de vous l'envoyer. La liste des abonnés est hébergée sur notre propre serveur.</p>
    <h2>11. Association avec la World Jigsaw Puzzle Federation</h2>
    <p>La World Jigsaw Puzzle Federation (WJPF, worldjigsawpuzzle.org) gère la base de données internationale des joueurs utilisée pour les compétitions officielles. Pour savoir si vous avez également un compte joueur WJPF, nous communiquons votre adresse e-mail à la WJPF. Si elle possède un compte joueur avec la même adresse, chaque partie enregistre l'identifiant de joueur de l'autre, afin que les deux plateformes sachent que les deux comptes appartiennent au même joueur. Vous pouvez aussi associer les comptes vous-même depuis votre compte WJPF.</p>
    <h2>12. Statistiques d'utilisation, journaux et rapports d'erreurs</h2>
    <ul>
        <li><strong>Activité :</strong> nous enregistrons les jours où vous avez été actif sur le site en étant connecté, afin de comprendre comment la plateforme est utilisée. Ces données sont supprimées au bout de 24 mois, ou immédiatement avec votre compte.</li>
        <li><strong>Journaux du serveur :</strong> nos serveurs enregistrent des informations techniques sur les requêtes (comme l'adresse IP, l'adresse de la page et l'identification du navigateur) pour assurer le fonctionnement et la sécurité du service. Ces journaux sont supprimés au bout de 30 jours.</li>
        <li><strong>Rapports d'erreurs :</strong> lorsqu'un problème survient, les détails de l'erreur – qui peuvent inclure l'adresse IP, l'identifiant de votre compte et les données de la requête qui a échoué – sont envoyés à Sentry, un service qui nous aide à trouver et corriger les bugs.</li>
        <li><strong>Google Analytics :</strong> nous utilisons Google Analytics pour savoir combien de personnes visitent le site et quelles pages elles consultent. Il ne se charge qu'après une interaction de votre part avec la page et enregistre des cookies dans votre navigateur (voir la section 14). Vous pouvez le bloquer avec un bloqueur de publicités ou de traçage, ou avec le <a href="https://tools.google.com/dlpage/gaoptout" target="_blank" rel="noopener">module complémentaire de désactivation</a> de Google.</li>
    </ul>
    <p>La base juridique des données d'activité, des journaux du serveur et des rapports d'erreurs est notre intérêt légitime à exploiter un service sûr et fonctionnel et à comprendre comment il est utilisé (article 6, paragraphe 1, point f) du RGPD).</p>
    <h2>13. Qui traite les données pour notre compte</h2>
    <p>Nous ne vendons pas de données personnelles. Pour faire fonctionner la plateforme, nous faisons appel aux prestataires suivants, qui traitent les données uniquement pour notre compte et selon nos instructions :</p>
    <ul>
        <li><strong>Hetzner Online GmbH</strong> (Allemagne) – serveurs, base de données et stockage des images téléversées, dans des centres de données situés dans l'UE,</li>
        <li><strong>Seznam.cz, a.s.</strong> (République tchèque) – envoi de nos e-mails,</li>
        <li><strong>Stripe</strong> (Stripe Payments Europe, Limited, Irlande) – paiements de l'adhésion,</li>
        <li><strong>Functional Software, Inc. (Sentry)</strong> (États-Unis) – rapports d'erreurs,</li>
        <li><strong>Google Ireland Limited</strong> (Google Analytics) – statistiques de fréquentation du site,</li>
        <li><strong>Cloudflare, Inc.</strong> (États-Unis) – diffusion rapide des images (img.myspeedpuzzling.com).</li>
    </ul>
    <p>Google, Microsoft, Apple et Meta (lorsque vous vous connectez avec eux) ainsi que la World Jigsaw Puzzle Federation (lorsque vous associez vos comptes) traitent les données en tant que responsables de traitement indépendants. Si vous autorisez une application tierce à accéder à votre compte via notre API, elle reçoit les données que vous avez approuvées dans cette demande ; vous pouvez révoquer cet accès à tout moment dans les paramètres de votre profil.</p>
    <h2>14. Cookies</h2>
    <p>Nous utilisons des cookies et des technologies de stockage similaires dans votre navigateur aux fins suivantes :</p>
    <ul>
        <li><strong>Les cookies nécessaires</strong> vous maintiennent connecté (jusqu'à 30 jours après votre dernière visite), protègent les formulaires contre les abus et nous aident à distinguer les vrais visiteurs des robots. Le site ne peut pas fonctionner sans eux.</li>
        <li><strong>Cookie de parrainage :</strong> si vous ouvrez un lien contenant le code de parrainage d'un joueur, nous mémorisons ce code pendant 30 jours, afin que ce joueur soit crédité si vous devenez membre.</li>
        <li><strong>Les cookies Google Analytics</strong> (<code>_ga</code>, <code>_ga_*</code>) comptent les visites ; ils sont conservés jusqu'à 2 ans.</li>
    </ul>
    <p>Vous pouvez supprimer ou bloquer les cookies à tout moment dans les paramètres de votre navigateur ; si vous bloquez les cookies nécessaires, la connexion ne fonctionnera plus.</p>
    <h2>15. Transferts hors de l'UE</h2>
    <p>Certains prestataires (Sentry, Cloudflare, ainsi que Stripe ou Google au sein de leurs groupes) peuvent traiter des données aux États-Unis. Ces transferts reposent sur le cadre de protection des données UE–États-Unis (Data Privacy Framework) ou sur les clauses contractuelles types de la Commission européenne.</p>
    <h2>16. Durée de conservation de vos données</h2>
    <ul>
        <li>Votre compte et tout ce qu'il contient sont conservés aussi longtemps que vous avez un compte.</li>
        <li>Lorsque vous supprimez votre compte, vos données personnelles sont supprimées immédiatement (détails sur la page <a href="%data_deletion_link%">Comment supprimer vos données</a>). Nous ne conservons ensuite plus rien vous concernant – à la seule exception de l'historique de vos paiements (paiements, factures et reçus), que Stripe conserve aussi longtemps que l'exige la législation comptable et fiscale.</li>
        <li>Nos sauvegardes sont écrasées en 7 jours ; les données supprimées en disparaissent donc aussi dans ce délai.</li>
        <li>Les durées de conservation du journal de sécurité, des données d'activité et des journaux du serveur sont indiquées aux sections 9 et 12.</li>
    </ul>
    <h2>17. Vos droits</h2>
    <p>En vertu du RGPD, vous avez le droit :</p>
    <ul>
        <li>d'accéder à vos données personnelles et d'en obtenir une copie – vous pouvez exporter vous-même vos temps dans les paramètres de votre profil,</li>
        <li>de faire rectifier des données inexactes – vous pouvez modifier vous-même la plupart d'entre elles dans <a href="%edit_profile_link%">Modifier le profil</a>,</li>
        <li>de faire effacer vos données – vous pouvez supprimer vous-même votre compte à tout moment,</li>
        <li>de demander la limitation du traitement et de recevoir vos données dans un format portable,</li>
        <li>de vous opposer à un traitement fondé sur notre intérêt légitime,</li>
        <li>de retirer à tout moment votre consentement (par exemple à la newsletter) – cela n'affecte pas le traitement effectué auparavant.</li>
    </ul>
    <p>Pour exercer l'un de ces droits, écrivez à <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a>. Si vous estimez que nous traitons vos données de manière illicite, vous pouvez également introduire une réclamation auprès de l'autorité de contrôle – en République tchèque, il s'agit de l'Office pour la protection des données personnelles (Úřad pro ochranu osobních údajů, <a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).</p>
    <h2>18. Suppression de vos données</h2>
    <p>Vous pouvez supprimer vous-même votre compte, y compris vos données personnelles, à tout moment. Vous trouverez les instructions détaillées sur la page <a href="%data_deletion_link%">Comment supprimer vos données</a>.</p>
    <p>Si vous avez des questions sur la protection des données personnelles ou si vous n'êtes pas sûr que quelque chose soit suffisamment clair, veuillez nous contacter à <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a>.</p>
    <p><em><small>Dernière mise à jour : 30 septembre 2026</small></em></p>

"data_deletion":
  "meta":
    "title": "Comment supprimer vos données"
    "description": "Comment supprimer votre compte MySpeedPuzzling et vos données personnelles, dissocier Google, Microsoft, Apple ou Facebook et retirer l'application chez le fournisseur."
  "content": |
    <h1>Comment supprimer vos données</h1>
    <p>Vous pouvez supprimer vous-même votre compte MySpeedPuzzling, y compris vos données personnelles – à tout moment et en quelques clics. Cette page explique comment faire, ce qui est supprimé exactement et que faire si vous souhaitez seulement dissocier Google, Microsoft, Apple ou Facebook.</p>
    <h2>1. Supprimer votre compte</h2>
    <ol>
        <li>Connectez-vous et ouvrez <a href="%edit_profile_link%">Modifier le profil</a> (dans le menu utilisateur).</li>
        <li>Faites défiler jusqu'à la <strong>Zone de danger</strong>, tout en bas de la page.</li>
        <li>Vous souhaitez conserver vos temps ? Cliquez sur <strong>Exporter mes données d'abord</strong> – une fois le compte supprimé, ils ne pourront plus être récupérés.</li>
        <li>Cliquez sur <strong>M'envoyer le lien de confirmation par e-mail</strong>. Nous l'envoyons à l'adresse e-mail de votre compte ; il est valable une heure.</li>
        <li>Ouvrez le lien, cochez <strong>Je comprends que cette action est définitive et irréversible.</strong> et cliquez sur <strong>Oui, supprimer définitivement mon compte</strong>.</li>
    </ol>
    <p>Votre compte est supprimé immédiatement. Il n'y a ni délai d'attente ni retour en arrière possible.</p>
    <h2>2. Ce qui est supprimé</h2>
    <ul>
        <li>votre compte : l'adresse e-mail de connexion, le mot de passe, les méthodes de connexion associées (Google, Microsoft, Apple, Facebook) et le journal de sécurité des connexions,</li>
        <li>votre profil de joueur avec toutes ses informations,</li>
        <li>vos temps en solo, vos collections, votre liste de souhaits, les puzzles proposés à la vente ou à l'échange, vos badges, chronomètres et notifications,</li>
        <li>votre adhésion (un abonnement actif est résilié) et votre inscription à la newsletter.</li>
    </ul>
    <p>Certaines choses sont partagées avec d'autres joueurs et restent donc visibles pour eux – mais elles ne sont plus liées à aucun compte et n'affichent plus que le nom que vous utilisiez, en simple texte : les temps en duo et en équipe réalisés avec d'autres joueurs inscrits, les conversations et les transactions de la place de marché, y compris les évaluations, ainsi que les suggestions et leurs commentaires. Les puzzles que vous avez ajoutés au catalogue y restent, sans aucun lien avec vous. Dans notre journal des e-mails envoyés, votre adresse est remplacée par une empreinte (hash) à sens unique.</p>
    <h2>3. Ce que nous conservons</h2>
    <p>Rien qui vous concerne – à une seule exception près : l'historique de vos paiements (paiements, factures et reçus). Stripe, qui traite nos paiements, le conserve aussi longtemps que l'exige la législation comptable et fiscale. Nos sauvegardes sont écrasées en 7 jours ; les données supprimées en disparaissent donc aussi dans ce délai.</p>
    <h2>4. Dissocier uniquement Google, Microsoft, Apple ou Facebook</h2>
    <p>Si vous souhaitez garder votre compte et simplement ne plus vous connecter avec Google, Microsoft, Apple ou Facebook, ouvrez <a href="%edit_profile_link%">Modifier le profil</a> → <strong>Méthodes de connexion associées</strong> et cliquez sur <strong>Dissocier</strong> à côté du fournisseur. L'association enregistrée (l'identifiant du fournisseur, l'adresse e-mail au moment de l'association, ainsi que les dates d'association et de dernière utilisation) est supprimée immédiatement. S'il s'agit de votre seul moyen de connexion, ajoutez d'abord un mot de passe pour ne pas perdre l'accès à votre compte.</p>
    <h2>5. Retirer MySpeedPuzzling chez le fournisseur</h2>
    <p>La dissociation sur notre site ne change rien à votre compte Google, Microsoft, Apple ou Facebook. Pour nous retirer également l'accès de ce côté, supprimez MySpeedPuzzling dans les paramètres du fournisseur :</p>
    <ul>
        <li><strong>Facebook :</strong> Paramètres et confidentialité → Paramètres → Applications et sites web</li>
        <li><strong>Google :</strong> <a href="https://myaccount.google.com/connections" target="_blank" rel="noopener">myaccount.google.com</a> → Sécurité → Vos connexions à des applications et services tiers</li>
        <li><strong>Microsoft :</strong> <a href="https://account.live.com/consent/Manage" target="_blank" rel="noopener">account.live.com/consent/Manage</a> → Applications et services auxquels vous avez donné accès → MySpeedPuzzling → Modifier → Supprimer ces autorisations</li>
        <li><strong>Apple :</strong> sur iPhone ou iPad, Réglages → votre nom (compte Apple) → Connexion et sécurité → Se connecter avec Apple ; sur le web, sur <a href="https://account.apple.com" target="_blank" rel="noopener">account.apple.com</a></li>
    </ul>
    <p>Retirer l'application chez le fournisseur ne supprime pas votre compte MySpeedPuzzling – pour cela, suivez l'étape 1.</p>
    <h2>6. Vous n'arrivez pas à vous connecter ?</h2>
    <p>Vous devez être connecté pour supprimer votre compte. Vous avez oublié votre mot de passe, ou vous n'utilisez plus Google, Microsoft, Apple ou Facebook ? Sur la page de connexion, vous pouvez vous faire envoyer un lien de connexion à l'adresse e-mail de votre compte. Si cela ne suffit pas, écrivez-nous à <a href="mailto:jan@myspeedpuzzling.com">jan@myspeedpuzzling.com</a>, de préférence depuis l'adresse e-mail de votre compte, et nous vous aiderons à retrouver l'accès à votre compte.</p>
    <p>Pour en savoir plus sur la manière dont nous traitons les données personnelles, consultez notre <a href="%privacy_link%">Politique de confidentialité</a>.</p>

