"fair_use_policy":
    "meta":
        "title": "Politique d'utilisation équitable de l'API"
        "description": "Règles d'utilisation de l'API et politique d'utilisation équitable pour la plateforme MySpeedPuzzling."
    "heading": "Politique d'utilisation équitable de l'API"
    "last_updated": "Dernière mise à jour : 2 avril 2026"
    "already_accepted": "Vous avez déjà accepté la politique d'utilisation de l'API."
    "accept_button": "J'accepte la politique d'utilisation de l'API"
    "intro_title": "Bienvenue, développeur"
    "intro_p1": "Nous sommes ravis d'ouvrir nos données à la communauté des puzzles. L'API MySpeedPuzzling existe pour permettre aux développeurs de créer des intégrations, des outils et des expériences créatives — pas pour exploiter notre plateforme ou ses utilisateurs."
    "intro_p2": "En utilisant l'API, vous acceptez les conditions décrites sur cette page. Elles sont rédigées en langage clair parce que nous voulons que vous les lisiez vraiment."
    "rate_limits_title": "Limites de débit & accès"
    "rate_limits_p1": "Nous commençons avec des limites de débit généreuses — nous voulons faciliter le développement avec notre API. Cependant, tout le trafic est activement surveillé par clé API et par adresse IP."
    "rate_limits_p2": "Si une utilisation excessive est détectée, des limites de débit seront instaurées et fixées à un nombre raisonnable. Un abus persistant ou le dépassement des limites imposées entraînera un blocage automatique de l'IP nécessitant un déblocage manuel par notre équipe."
    "rate_limits_p3": "Les tentatives de contournement des limites de débit en distribuant les requêtes sur plusieurs IPs, en utilisant des proxies, des VPNs, une infrastructure rotative ou plusieurs clés API seront détectées et traitées comme une violation grave de la politique."
    "rate_limits_p4": "Si vous avez besoin de limites plus élevées pour un projet légitime, contactez-nous — n'essayez pas de contourner le système."
    "rate_limits_p5": "Respectez les en-têtes <code>Retry-After</code> et implémentez un recul approprié dans votre client."
    "permitted_title": "Utilisation autorisée"
    "permitted_personal": "L'accès à l'API est réservé à un <strong>usage personnel et non commercial uniquement</strong>."
    "permitted_no_sell": "Il est strictement interdit de vendre, revendre, licencier ou fournir des données de l'API à un tiers sans notre approbation écrite explicite."
    "permitted_no_bulk": "Aucune énumération ni téléchargement en masse de l'intégralité de la base de données ou de portions significatives de celle-ci."
    "permitted_no_scrape": "Pas de scraping du site web comme solution de contournement des limitations de l'API."
    "permitted_no_compete": "Il est interdit d'utiliser l'API pour créer une plateforme concurrente ou reproduire les fonctionnalités principales de MySpeedPuzzling (classements, palmarès, profils d'utilisateurs en tant que service) — sauf si cela est explicitement demandé et accordé."
    "permitted_no_interfere": "Les applications ne doivent pas interférer avec le fonctionnement de la plateforme ni dégrader l'expérience des autres utilisateurs."
    "data_title": "Propriété des données & traitement"
    "data_ownership": "Toutes les données restent la propriété de MySpeedPuzzling et de ses utilisateurs. L'accès à l'API accorde une licence d'utilisation des données, pas leur propriété."
    "data_personal": "Les données personnelles des utilisateurs (profils, temps de résolution) ne doivent pas être utilisées pour identifier, profiler ou contacter des personnes en dehors de la plateforme sans leur consentement."
    "data_cache": "Les données mises en cache ne doivent pas être conservées plus de 24 heures — nous sommes la source de vérité."
    "data_misrepresent": "Les données ne doivent pas être modifiées, déformées ou présentées dans un contexte trompeur."
    "keys_title": "Clés API & règles de compte"
    "keys_personal": "Les clés API sont personnelles et non transférables. Aucun partage."
    "keys_responsible": "Les développeurs sont responsables de la sécurité de leur clé et de toute utilisation effectuée avec celle-ci."
    "keys_no_automated": "Pas de création automatisée de comptes pour obtenir plusieurs clés API."
    "monitoring_title": "Surveillance & application"
    "monitoring_active": "L'utilisation de l'API est activement surveillée — y compris les types de requêtes, les volumes, les adresses IP et les schémas d'accès."
    "monitoring_retention": "Les données de surveillance (journaux de requêtes, adresses IP, schémas d'utilisation) peuvent être conservées indéfiniment à des fins de sécurité et de prévention des abus."
    "monitoring_revoke": "Nous nous réservons le droit de révoquer l'accès à l'API à tout moment sans préavis en cas de violation de cette politique."
    "monitoring_circumvent": "Tout contournement des restrictions est traité comme une violation de confiance entraînant une révocation permanente."
    "attribution_title": "Attribution"
    "attribution_mention": "Lorsque vous présentez des données de MySpeedPuzzling dans votre application, veuillez indiquer leur provenance. Un simple « Données issues de MySpeedPuzzling » avec un lien est suffisant."
    "attribution_logo": "N'hésitez pas à utiliser notre logo dans votre projet :"
    "attribution_download": "Télécharger le logo (SVG)"
    "attribution_link": "Ajoutez un lien vers myspeedpuzzling.com lorsque c'est approprié."
    "tell_us_title": "Dites-nous ce que vous créez"
    "tell_us_p1": "Nous serions vraiment ravis de savoir sur quoi vous travaillez. Entendre parler des projets de la communauté nous inspire et nous aide à améliorer l'API pour tout le monde."
    "tell_us_p2": "Une brève description du cas d'usage est demandée lors de l'obtention d'une clé API. Nous pourrions mettre en avant des projets communautaires intéressants sur notre site (avec votre permission, bien sûr)."
    "tell_us_p3": "Des questions, des idées ou des retours ? Contactez-nous à jan@myspeedpuzzling.com."
    "updates_title": "Mises à jour de la politique"
    "updates_notice": "Nous nous réservons le droit de mettre à jour cette politique avec un préavis raisonnable (30 jours). La poursuite de l'utilisation après les modifications vaut acceptation."
    "updates_email": "Les modifications importantes seront communiquées aux développeurs enregistrés par e-mail."
    "contact_title": "Contact"
    "contact_info": "Pour des limites de débit plus élevées, des demandes de partenariat, des discussions sur les cas d'usage ou des questions relatives à la politique :"
    "closing": "Nous voulons que vous réussissiez. Jouez le jeu et nous vous soutiendrons."
