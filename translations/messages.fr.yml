      "description": "Utilisez le chat intégré pour communiquer directement avec les acheteurs intéressés ici sur la plateforme. Vous pouvez également organiser les choses en dehors de la plateforme si vous préférez - c'est à vous de décider."
      "title": "Discutez avec les puzzlers"
