  "seo_sections":
    "what_is":
      "title": "Qu'est-ce que le speed puzzling ?"
      "text": "Le speed puzzling (ou speed puzzle) est le sport qui consiste à assembler des puzzles contre la montre — en solo, en duo ou en équipe. Ce qui a commencé comme un loisir tranquille est devenu une scène compétitive mondiale avec ses propres championnats et une communauté chaleureuse. Vous débutez ? Lisez notre <a href=\"%guide_link%\">guide complet du speed puzzling</a> (en anglais) pour découvrir comment ça marche et comment commencer."
    "track":
      "title": "Suivez vos temps de puzzle"
      "text": "MySpeedPuzzling est une <a href=\"%tracker_link%\">application de suivi de puzzles</a> gratuite pour tous les amoureux de puzzles. Chronométrez vos assemblages avec le <a href=\"%stopwatch_link%\">chronomètre</a> intégré, enregistrez vos puzzles terminés avec photos et gardez toute votre collection organisée au même endroit. Chaque temps enregistré alimente vos statistiques personnelles : vous verrez vos progrès puzzle après puzzle."
    "leaderboards":
      "title": "Concourez dans les classements mondiaux"
      "text": "Comparez vos temps à ceux des speed puzzleurs du monde entier. Le <a href=\"%ladder_link%\">classement mondial</a> répertorie les temps d'assemblage les plus rapides par nombre de pièces, en solo, en duo et en équipe, tandis que le <a href=\"%rating_link%\">classement MSP Rating</a> mesure votre niveau global. Que vous chassiez les records ou soyez simplement curieux, il y a un classement pour vous."
    "competitions":
      "title": "Concours de puzzle et événements"
      "text": "Des rencontres locales au World Jigsaw Puzzle Championship, les concours de puzzle et de speed puzzling ont lieu partout dans le monde — en direct et en ligne. Parcourez le <a href=\"%events_link%\">calendrier des événements</a> pour trouver les prochains concours de puzzle près de chez vous, suivre les résultats et rencontrer des puzzleurs aussi passionnés que vous."
    "database":
      "title": "Parcourez la base de données de puzzles"
      "text": "Explorez des milliers de puzzles avec de vrais temps d'assemblage enregistrés par la communauté. Comparez les temps médians et records des puzzles <a href=\"%ravensburger_link%\">Ravensburger</a>, <a href=\"%schmidt_link%\">Schmidt</a> ou <a href=\"%trefl_link%\">Trefl</a>, vérifiez la difficulté réelle d'un puzzle avant de l'acheter et choisissez votre prochain défi dans la <a href=\"%puzzles_link%\">base de données de puzzles</a> complète."
