      "description": "Allez sur un puzzle de votre collection et ajoutez-le à votre liste de vente/échange. Vous pouvez le faire depuis la page de détail du puzzle, votre bibliothèque de puzzles ou directement depuis votre collection. Assurez-vous de cocher \"Afficher sur le marché\" pour que les autres puzzlers puissent le trouver."
