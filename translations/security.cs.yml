# Messages thrown by LoginFormAuthenticator (issue #147). Symfony renders an
# authentication error as `error.messageKey|trans(error.messageData, 'security')`,
# so the English sentence is the key; Symfony's own catalogue supplies every
# built-in message ("Invalid credentials.", throttling, ...) in all six locales.
"This password was found in a public data breach. To protect your account, please reset your password to sign in.": "Toto heslo se objevilo ve veřejném úniku dat. Pro ochranu vašeho účtu si prosím před přihlášením nastavte nové heslo."
"Sign-in is temporarily unavailable. Please try again in a moment.": "Přihlášení je dočasně nedostupné. Zkuste to prosím za chvíli znovu."
