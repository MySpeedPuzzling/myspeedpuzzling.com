# Custom authentication messages. Symfony renders an authentication error as
# `error.messageKey|trans(error.messageData, 'security')`, so the English
# sentence is the key; Symfony's own catalogue supplies every built-in message
# ("Invalid credentials.", throttling, ...) in all six locales.
#
# Thrown by SocialAccountResolver (auth hardening PR 2).
"There is already an account with this email address, but that address has not been verified yet. To be sure we connect the right accounts, please sign in to that account first (with your password or an emailed sign-in link), then connect %provider% in your profile settings under Connected sign-in methods.": "Für diese E-Mail-Adresse gibt es bereits ein Konto, die Adresse wurde aber noch nicht bestätigt. Damit wir sicher die richtigen Konten verbinden, melden Sie sich bitte zuerst bei diesem Konto an (mit Ihrem Passwort oder über einen per E-Mail gesendeten Anmeldelink) und verbinden Sie %provider% dann in Ihren Profileinstellungen unter „Verbundene Anmeldemethoden“."
"There is already an account with this email address, but %provider% has not confirmed that the address belongs to you. To be sure we connect the right accounts, please sign in to that account first (with your password or an emailed sign-in link), then connect %provider% in your profile settings under Connected sign-in methods.": "Für diese E-Mail-Adresse gibt es bereits ein Konto, aber %provider% hat nicht bestätigt, dass die Adresse Ihnen gehört. Damit wir sicher die richtigen Konten verbinden, melden Sie sich bitte zuerst bei diesem Konto an (mit Ihrem Passwort oder über einen per E-Mail gesendeten Anmeldelink) und verbinden Sie %provider% dann in Ihren Profileinstellungen unter „Verbundene Anmeldemethoden“."
"%provider% did not share an email address with us, so we cannot sign you in this way. Please try again and allow access to your email address when %provider% asks - or sign in another way.": "%provider% hat uns keine E-Mail-Adresse mitgeteilt, deshalb können wir Sie auf diesem Weg nicht anmelden. Bitte versuchen Sie es erneut und erlauben Sie den Zugriff auf Ihre E-Mail-Adresse, wenn %provider% danach fragt - oder melden Sie sich auf einem anderen Weg an."
