# Messages thrown by LoginFormAuthenticator (issue #147). Symfony renders an
# authentication error as `error.messageKey|trans(error.messageData, 'security')`,
# so the English sentence is the key; Symfony's own catalogue supplies every
# built-in message ("Invalid credentials.", throttling, ...) in all six locales.
"This password was found in a public data breach. To protect your account, please reset your password to sign in.": "Dieses Passwort wurde in einem öffentlichen Datenleck gefunden. Bitte setzen Sie zum Schutz Ihres Kontos Ihr Passwort zurück, um sich anzumelden."
"Sign-in is temporarily unavailable. Please try again in a moment.": "Die Anmeldung ist vorübergehend nicht verfügbar. Bitte versuchen Sie es gleich noch einmal."
