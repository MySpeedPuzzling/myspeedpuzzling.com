# Custom authentication messages. Symfony renders an authentication error as
# `error.messageKey|trans(error.messageData, 'security')`, so the English
# sentence is the key; Symfony's own catalogue supplies every built-in message
# ("Invalid credentials.", throttling, ...) in all six locales.
#
# Thrown by SocialAccountResolver (auth hardening PR 2).
"There is already an account with this email address, but that address has not been verified yet. To be sure we connect the right accounts, please sign in to that account first (with your password or an emailed sign-in link), then connect %provider% in your profile settings under Connected sign-in methods.": "Ya existe una cuenta con esta dirección de correo electrónico, pero esa dirección aún no se ha verificado. Para asegurarnos de conectar las cuentas correctas, inicia sesión primero en esa cuenta (con tu contraseña o con un enlace de inicio de sesión enviado por correo) y después conecta %provider% en la configuración de tu perfil, en Métodos de inicio de sesión conectados."
"There is already an account with this email address, but %provider% has not confirmed that the address belongs to you. To be sure we connect the right accounts, please sign in to that account first (with your password or an emailed sign-in link), then connect %provider% in your profile settings under Connected sign-in methods.": "Ya existe una cuenta con esta dirección de correo electrónico, pero %provider% no ha confirmado que la dirección sea tuya. Para asegurarnos de conectar las cuentas correctas, inicia sesión primero en esa cuenta (con tu contraseña o con un enlace de inicio de sesión enviado por correo) y después conecta %provider% en la configuración de tu perfil, en Métodos de inicio de sesión conectados."
"%provider% did not share an email address with us, so we cannot sign you in this way. Please try again and allow access to your email address when %provider% asks - or sign in another way.": "%provider% no ha compartido con nosotros ninguna dirección de correo electrónico, así que no podemos iniciar tu sesión de esta forma. Vuelve a intentarlo y permite el acceso a tu dirección de correo electrónico cuando %provider% te lo pida, o inicia sesión de otra manera."
#
# Every social sign-in failure (SocialLoginFailureReason) shows one of these.
# The last one is shared by every account-dependent refusal (admin-only stage,
# refused auto-link), so it reveals nothing about the account.
"You cancelled signing in with %provider%. Nothing was changed.": "Has cancelado el inicio de sesión con %provider%. No se ha cambiado nada."
"Signing in with %provider% took too long or was opened twice. Please try again.": "El inicio de sesión con %provider% ha tardado demasiado o se ha abierto dos veces. Vuelve a intentarlo."
"Signing in with %provider% didn't work. Please try again, or sign in with your e-mail.": "El inicio de sesión con %provider% no ha funcionado. Vuelve a intentarlo o inicia sesión con tu correo electrónico."
"We couldn't sign you in with %provider%. Please sign in with your e-mail or password, then connect %provider% in your profile settings.": "No hemos podido iniciar tu sesión con %provider%. Inicia sesión con tu correo electrónico o tu contraseña y después conecta %provider% en la configuración de tu perfil."
