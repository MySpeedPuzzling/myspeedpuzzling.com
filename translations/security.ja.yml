# Custom authentication messages. Symfony renders an authentication error as
# `error.messageKey|trans(error.messageData, 'security')`, so the English
# sentence is the key; Symfony's own catalogue supplies every built-in message
# ("Invalid credentials.", throttling, ...) in all six locales.
"An account with this email address already exists. Sign in with your password first, then connect %provider% in your profile settings.": "このメールアドレスのアカウントはすでに存在します。まずパスワードでサインインしてから、プロフィール設定で%provider%を接続してください。"
"%provider% did not share an email address with us, so we cannot sign you in this way. Please sign in another way.": "%provider%からメールアドレスが提供されなかったため、この方法ではサインインできません。別の方法でサインインしてください。"
